name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: selftest · worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: worker/package-lock.json
      # Imports the page's modules (site/src/*.js) and the Worker's into Node with stub browser APIs.
      - run: node selftest.js
      - run: npm ci
        working-directory: worker
      # Bundles the Worker exactly as `wrangler deploy` would, without uploading.
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dist"
        working-directory: worker
      - run: npm audit --audit-level=high
        working-directory: worker

  # The repo is public and GitHub secret scanning watches new pushes; gitleaks
  # scans the whole history on every run as a second line of defence
  # (.gitleaksignore lists the one historical public key).
  secrets:
    name: secrets
    # The action lists the PR's commits through the API; the default token
    # cannot read pull requests.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
