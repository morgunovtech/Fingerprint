name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: selftest · worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: worker/package-lock.json
      # Runs the page's inline script and site/src/profiler.js in a vm sandbox.
      - run: node selftest.js
      - run: npm ci
        working-directory: worker
      # Bundles the Worker exactly as `wrangler deploy` would, without uploading.
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dist"
        working-directory: worker
      - run: npm audit --audit-level=high
        working-directory: worker

  # Private repos on the free plan get no GitHub secret scanning; gitleaks
  # scans the whole history instead (.gitleaksignore lists the one public key).
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
