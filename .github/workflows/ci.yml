name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: selftest · worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: worker/package-lock.json
      # Imports the page's modules (site/src/*.js) and the Worker's into Node with stub browser APIs.
      - run: node selftest.js
      # wrangler runs without its dependencies' install scripts (esbuild and workerd ship
      # their binaries as optional packages), so none of them gets to run code here.
      - run: npm ci --ignore-scripts
        working-directory: worker
      # Bundles the Worker exactly as `wrangler deploy` would, without uploading.
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dist"
        working-directory: worker
      - run: npm audit --audit-level=high
        working-directory: worker

  # The repo is public and GitHub secret scanning watches new pushes; gitleaks
  # scans the whole history on every run as a second line of defence
  # (.gitleaksignore lists the one historical public key).
  secrets:
    name: secrets
    # The action lists the PR's commits through the API; the default token
    # cannot read pull requests.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
