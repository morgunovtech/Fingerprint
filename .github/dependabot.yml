# One grouped PR per week with the Worker's npm updates (wrangler), monthly
# PRs for the Actions. CI checks them; dependabot-automerge.yml then merges
# minor and patch updates once CI is green, majors wait for a human.
version: 2
updates:
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
      day: saturday
    groups:
      worker-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
