    introTitle:'“Digital fingerprint”: what it is and why it matters',
    introRichHtml:/* html */`
      <section class="fp-section" lang="en" aria-labelledby="fp-title">
        <h2 id="fp-title">“Digital fingerprint”: what it is and why it matters</h2>
        <p>
          Every device and browser exposes a unique mix of characteristics — a “digital fingerprint”.
          It lets sites recognise you between visits and connect activity across services — even without an account.
        </p>
        <h3>How it works</h3>
        <p>
          You visit sites n1, n2, n3 without signing in. Later, on site n4 (for example a social network) you create an account.
          Data brokers (<abbr title="intermediaries that trade and aggregate user data">data brokers</abbr>) and ad networks with access to your fingerprint
          compare matching traits and link those previous visits to a specific person.
        </p>
        <h3>What it can lead to</h3>
        <ul class="fp-list">
          <li>Persistent targeting and price discrimination.</li>
          <li>Deep profiles of your interests and habits.</li>
          <li>Phishing and social engineering.</li>
          <li>Extortion or fraud if the data leaks.</li>
        </ul>
        <h3>What this service does</h3>
        <p>
          We show which signals are visible right now, explain the risk in plain language,
          and provide step-by-step tips to shrink your digital footprint.
        </p>
        <h3>How we process data</h3>
        <p>
          All calculations run locally in your browser: nothing is sent or stored, and you do not need to register.
          You can save the result as a PDF or share it safely without exposing the raw data.
        </p>
        <h3>Extra: “Detect IP & refine data”</h3>
        <p>
          On demand it measures your connection speed, explains what your IP address reveals,
          and estimates whether you appear to use a VPN.
        </p>
      </section>
    `,

          .replace('cellular-like','Uyali tarmoqqa o‘xshaydi')
          .replace('unknown','tarmoq turi nomaʼlum'),
        'location.region':finding=>{
          const raw=String(finding.value||'');
          return raw

            .replace('IP says','IP ko‘rsatmoqda')
            .replace('IP country','IP bo‘yicha davlat')
            .replace('Region unclear','Mintaqa nomaʼlum')
            .replace(' (local & IP agree)',' (mahalliy va IP mos keladi)');
        },
        'device.peripherals':finding=>{
          const raw=String(finding.value||'');
          if(!raw) return raw;
          if(raw.startsWith('Capabilities:')) return raw.replace('Capabilities:','Mavjud API:');
          if(raw==='No special peripheral APIs exposed') return 'Qo‘shimcha periferik API ko‘rinmayapti';
          return raw;
        },
        'storage.quota':finding=>{
          const raw=String(finding.value||'');
          if(!raw) return raw;
          const match=raw.match(/Using ([^ ]+ MB) of ([^ ]+ MB) \(([^)]+)\)/);
          if(match){
            return `${match[1]} dan ${match[2]} foydalanilmoqda (${match[3]})`;
          }
          return raw.replace(/Using/i,'Foydalanilmoqda').replace(' of ',' dan ');
        },
        'fingerprint.fonts':finding=>{
          const raw=String(finding.value||'');
          if(raw.startsWith('Detected fonts:')) return raw.replace('Detected fonts:','Aniqlangan shriftlar:');
          if(raw==='System fonts not observable') return 'Tizim shriftlari aniqlanmadi';
          return raw;
        },

          const raw=String(finding.value||'');
          if(raw==='Cookies enabled') return 'Cookie yoqilgan';
          if(raw==='Cookies blocked or disabled') return 'Cookie bloklangan yoki o‘chirilgan';
          return raw;
        },
        'privacy.supercookie':finding=>{
          const raw=String(finding.value||'');
          return raw
            .replace('Multiple supercookie surfaces available','Bir nechta supercookie xotiralari mavjud')
            .replace('Single supercookie surface available','Bitta supercookie xotirasi mavjud')
            .replace('Supercookie surfaces blocked or unavailable','Supercookie xotirasi yopilgan yoki mavjud emas');
        },
        'privacy.adblock':finding=>{
          const raw=String(finding.value||'');
          if(raw==='Ad blocker likely enabled') return 'Reklama bloklagichi ehtimol yoqilgan';
          if(raw==='Ad blocker unlikely') return 'Reklama bloklagichi aniqlanmadi';
          if(raw==='Ad blocker status unknown') return 'Reklama bloklagichi holati nomaʼlum';
          return raw;
        },
        'network.webrtcLeak':finding=>{
          const raw=String(finding.value||'');
          return raw
            .replace('No local WebRTC addresses observed','WebRTC mahalliy manzillari topilmadi')
            .replace('Local/WebRTC IP exposure detected (hypothesis)','WebRTC orqali IP sizishi mumkin (gipoteza)');
        }

const ALPHA = 1; // Laplace
const FREQ_META = Object.fromEntries(Object.entries(FREQ).map(([name,table])=>{
  const entries=Object.entries(table).map(([k,v])=>[k,Math.max(v,0)]);
  const total=entries.reduce((sum,[,v])=>sum+v,0);
  return [name,{table:Object.fromEntries(entries),total,size:entries.length}];
}));
const FREQ_SAMPLERS = Object.fromEntries(Object.entries(FREQ_META).map(([name,meta])=>{
  let acc=0;
  const cdf=Object.entries(meta.table).map(([key,val])=>{
    acc+=val;
    return {key,threshold:acc};
  });
  return [name,{cdf,total:acc||1}];
}));

function bucketPlugins(n){if(n<=0)return'0';if(n<=3)return'1-3';return'4+';}
function bucketPerms(n){if(n<=0)return'0';if(n<=3)return'1-3';return'4+';}
function canonicalOsFamily(osLabel){
  const label=(osLabel||'').toLowerCase();
  if(!label) return'unknown';
  if(label.includes('windows'))return'Windows';
  if(label.includes('android'))return'Android';
  if(label.includes('ios')||label.includes('ipad')||label.includes('iphone'))return'iOS';
  if(label.includes('mac'))return'macOS';
  if(label.includes('chromeos')||label.includes('chrome os'))return'ChromeOS';
  if(label.includes('linux'))return'Linux';
  return'__other';
}
function bucketDeviceMemory(mem){
  if(!mem||Number.isNaN(mem))return'unknown';
  if(mem<=4)return'≤4';
  if(mem<=8)return'5-8';
  if(mem<=16)return'9-16';
  return'17+';
}
function bucketCoreCount(cores){
  if(!cores||Number.isNaN(cores))return'unknown';
  if(cores<=4)return'≤4';
  if(cores<=8)return'5-8';
  if(cores<=16)return'9-16';
  return'17+';
}
function storageBucketKey(storage,cookiesEnabled){
  if(!storage) return'unknown';
  const hasLocal=!!storage.local;
  const hasSession=!!storage.session;
  const hasIdb=!!storage.indexedDB;
  if(hasLocal&&hasSession&&hasIdb)return'full';
  if(hasLocal&&hasSession)return'local+session';
  if(hasLocal||hasSession||hasIdb)return'partial';
  if(cookiesEnabled)return'cookies-only';
  return'restricted';
}
function touchBucketKey(touch,pointer){
  if(!touch)return'unknown';
  const maxPoints=Number(touch.maxTouchPoints||0);
  if(maxPoints<=0)return'none';
  if(maxPoints<=2)return'limited';
  if(pointer==='fine'&&maxPoints<=1)return'limited';
  return'multi';
}
function brandFromRenderer(r){
  r=(r||'').toLowerCase();
  if(r.includes('nvidia'))return'NVIDIA';
  if(r.includes('intel'))return'Intel';
  if(r.includes('amd')||r.includes('ati'))return'AMD';
  if(r.includes('apple'))return'Apple';
  return'__other';
}
function browserFamily(ua){
  if(/Edg\//.test(ua))return'Edge';
  if(/Firefox\//.test(ua))return'Firefox';
  if(/Safari\//.test(ua)&&!/Chrome\//.test(ua))return'Safari';
  if(/Chrome\//.test(ua))return'Chrome';
  return'__other';
}
function pFrom(table,key){
  const meta=FREQ_META[table];
  if(!meta)return 1;
  const {table:freq,total,size}=meta;
  const fallback=freq.__other??0;
  const value=Object.prototype.hasOwnProperty.call(freq,key)?freq[key]:fallback;

function entropyFromFeatures(f){

  H += -Math.log2(pFrom('os.family', f.osFamily));

  H += -Math.log2(pFrom('dpr', f.dpr));
  H += -Math.log2(pFrom('langs.count', f.langsCount));
  H += -Math.log2(pFrom('gpu.brand', f.gpuBrand));
  H += -Math.log2(pFrom('memory.bucket', f.memoryBucket));
  H += -Math.log2(pFrom('cores.bucket', f.coresBucket));
  H += -Math.log2(pFrom('has.canvas', f.hasCanvas));
  H += -Math.log2(pFrom('has.audio', f.hasAudio));
  H += -Math.log2(pFrom('plugins.bucket', f.pluginsBucket));
  H += -Math.log2(pFrom('perm.bucket', f.permBucket));
  H += -Math.log2(pFrom('storage.bucket', f.storageBucket));
  H += -Math.log2(pFrom('touch.bucket', f.touchBucket));
  H += -Math.log2(pFrom('ip.detail', f.ipDetail));
  H += -Math.log2(pFrom('ip.country', f.ipCountry));
  H += -Math.log2(pFrom('speed.bucket', f.speedBucket));
  H += -Math.log2(pFrom('latency.bucket', f.latencyBucket));
  // лёгкая коррекция зависимостей (GPU×browser Safari/Apple; screen×dpr)
  if(f.browser==='Safari' && f.gpuBrand==='Apple') H -= 1.0;
  if(f.browser==='Safari' && f.osFamily!=='macOS' && f.osFamily!=='iOS') H -= 0.5;

function sampleFromTable(table){
  const sampler=FREQ_SAMPLERS[table];
  if(!sampler) return'__other';
  const target=Math.random()*sampler.total;
  for(const entry of sampler.cdf){
    if(target<=entry.threshold) return entry.key;
  }
  return sampler.cdf[sampler.cdf.length-1]?.key||'__other';
}
function buildEntropyDistribution(samples=25000){
  const dist=[];
  for(let i=0;i<samples;i++){
    const f={
      browser:sampleFromTable('browser.family'),
      osFamily:sampleFromTable('os.family'),
      screen:sampleFromTable('screen'),
      dpr:sampleFromTable('dpr'),
      langsCount:sampleFromTable('langs.count'),
      gpuBrand:sampleFromTable('gpu.brand'),
      memoryBucket:sampleFromTable('memory.bucket'),
      coresBucket:sampleFromTable('cores.bucket'),
      hasCanvas:sampleFromTable('has.canvas'),
      hasAudio:sampleFromTable('has.audio'),
      pluginsBucket:sampleFromTable('plugins.bucket'),
      permBucket:sampleFromTable('perm.bucket'),
      storageBucket:sampleFromTable('storage.bucket'),
      touchBucket:sampleFromTable('touch.bucket'),
      ipDetail:sampleFromTable('ip.detail'),
      ipCountry:sampleFromTable('ip.country'),
      speedBucket:sampleFromTable('speed.bucket'),
      latencyBucket:sampleFromTable('latency.bucket')
    };
    dist.push(entropyFromFeatures(f));
  }
  dist.sort((a,b)=>a-b);
  return dist;
}
const H_DISTRIBUTION = buildEntropyDistribution();
function percentileFromH(H){
  if(!Array.isArray(H_DISTRIBUTION)||!H_DISTRIBUTION.length)return 100;
  let lo=0,hi=H_DISTRIBUTION.length;
  while(lo<hi){
    const mid=(lo+hi)>>>1;
    if(H_DISTRIBUTION[mid]<=H) lo=mid+1; else hi=mid;
  }
  const percentile=lo/H_DISTRIBUTION.length;
  return Math.min(100,Math.max(0,Math.round(percentile*100)));
}

async function computeSnapshot(){
  const uaData=navigator.userAgentData;
  const memoryInfo=detectMemory();
  const hw={
    deviceMemory:memoryInfo.deviceMemory??null,
    hardwareConcurrency:navigator.hardwareConcurrency??null,
    memoryLimitGb:memoryInfo.heapLimit??null
  };
  const tz=LOCAL_TZ;
  const tzOffset=new Date().getTimezoneOffset();
  const gl=webglInfo();
  const [cv,au,perms,media,bat,uaHints]=await Promise.all([
    canvasHash(),
    audioHash(),
    getPermissions(),
    getMediaDevices(),
    getBattery(),
    getUaHints(uaData)
  ]);
  const net=netInfo();
  const pixelRatio=Number(window.devicePixelRatio||1)||1;
  const languages=getLanguages();
  const screenSetup=detectScreenSetup();
  const pointer=detectPointerType();
  const basic={
    userAgent:navigator.userAgent,
    uaBrands:uaData?.brands||null, uaMobile:uaData?.mobile??null, uaPlatform:uaData?.platform||null,
    uaHighEntropy:uaHints,
    platform:navigator.platform||null,
    languages,
    screen:{w:screen.width,h:screen.height,colorDepth:screen.colorDepth,pixelRatio,monitors:screenSetup},
    timezone:tz, tzOffsetMinutes:tzOffset,
    cookiesEnabled:navigator.cookieEnabled??null,
    dnt:navigator.doNotTrack||null,
    gpc:(typeof navigator.globalPrivacyControl!=='undefined')?Boolean(navigator.globalPrivacyControl):null,
    storage:{local:hasStorage('localStorage'),session:hasStorage('sessionStorage'),indexedDB:!!window.indexedDB},
    touch:{maxTouchPoints:navigator.maxTouchPoints||0,ontouchstart:('ontouchstart' in window)},
    pointer,
    hw, gl, net, perms, media, plugins:getPlugins(), battery:bat, hashes:{canvas:cv,audio:au}, server:state.serverData, speed:state.speed
  };
  try{
    basic.exposure=await collectExposureData(basic);
  }catch(_){
    basic.exposure=null;
  }
  try{
    globalThis.__fingerprintBasic=basic;
  }catch(_){/* ignore */}
  const json=JSON.stringify(sortDeep(basic));
  const fp=await sha256(json);

  const browser=browserFamily(basic.userAgent);
  const osFamily=canonicalOsFamily(guessOSVersion(basic));
  const scr=`${basic.screen.w}x${basic.screen.h}@${basic.screen.pixelRatio}`;
  const langCount=languages.length;
  const langsCount = langCount>=4?'4+':String(langCount||0);
  const gpuBrand=brandFromRenderer(basic.gl?.renderer||'');
  const hasCanvas = basic.hashes.canvas? '1':'0';
  const hasAudio  = basic.hashes.audio?  '1':'0';
  const pluginsBucket = bucketPlugins((basic.plugins||[]).length);
  const permEntries=Object.entries(basic.perms||{});
  const permBucket = bucketPerms(permEntries.length);
  const memoryBucket = bucketDeviceMemory(hw.deviceMemory);
  const coresBucket = bucketCoreCount(hw.hardwareConcurrency);
  const storageBucket = storageBucketKey(basic.storage,basic.cookiesEnabled);
  const touchBucket = touchBucketKey(basic.touch,basic.pointer);
  const ipDetail = state.serverData?categorizeIpDetail(state.serverData.details||extractCanonicalDetailsFromPayload(state.serverData.raw)||null):'none';
  const ipCountry = ipCountryKey(state.serverData);
  const speedBucket = bucketSpeedValue(state.speed);
  const latencyBucket = bucketLatencyValue(state.speed);

  const H = entropyFromFeatures({browser,osFamily,screen:scr,dpr:String(basic.screen.pixelRatio),langsCount,gpuBrand,memoryBucket,coresBucket,hasCanvas,hasAudio,pluginsBucket,permBucket,storageBucket,touchBucket,ipDetail,ipCountry,speedBucket,latencyBucket});
  const pct = percentileFromH(H);

  return {basic, fp, H, pct};
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, ch=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[ch]);
}

function pillValue(value){
  if(value==null) return '';
  const str=String(value).trim();
  if(!str) return '';
  if(str.includes('<span class="pill">')) return str;
  return `<span class="pill">${escapeHtml(str)}</span>`;
}

function pillList(values){
  return values.map(pillValue).filter(Boolean).join(' ');
}

function pillOr(value,fallback='—'){
  return pillValue(value)||pillValue(fallback);
}

function loadThemePreference(){
  try{
    const stored=localStorage.getItem(THEME_KEY);
    if(stored==='light'||stored==='dark'||stored==='auto'||stored==='contrast') return stored;
  }catch(_){/* ignore */}
  return'auto';
}

function applyThemePreference(mode){
  themePreference=mode;
  document.documentElement.classList.remove('force-light','force-dark','force-contrast');
  if(mode==='light') document.documentElement.classList.add('force-light');
  else if(mode==='dark') document.documentElement.classList.add('force-dark');
  else if(mode==='contrast'){
    document.documentElement.classList.remove('force-dark','force-light');
    document.documentElement.classList.add('force-contrast');
  }
  try{
    if(mode==='auto') localStorage.setItem(THEME_KEY,'auto');
    else localStorage.setItem(THEME_KEY,mode);
  }catch(_){/* ignore */}
}

async function fetchWithTimeout(url,{timeout=6000,...options}={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const resp=await fetch(url,{...options,signal:controller.signal});
    if(!resp.ok) throw new Error(resp.statusText||`HTTP ${resp.status}`);
    return resp;
  }catch(e){
    if(e.name==='AbortError') throw new Error('timeout');
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

function normalizeCallingCode(code){
  if(code==null) return null;
  let str=String(code).trim();
  if(!str) return null;
  str=str.replace(/[^0-9+]/g,'');
  while(str.startsWith('+')){
    str=str.slice(1);
  }
  if(!str) return null;
  return `+${str}`;
}

function normalizeTimeZoneValue(tz){

function providerLooksLikeVpn(details,raw){
  const lower=str=>String(str||'').toLowerCase();
  const candidates=[
    details?.org,
    raw?.org,
    raw?.isp,
    raw?.as,
    raw?.company,
    raw?.connection?.isp,
    raw?.connection?.org,
    raw?.asn?.org,
    raw?.asn?.name
  ].map(lower).filter(Boolean);
  if(candidates.some(org=>VPN_KEYWORDS.some(key=>org.includes(key)))) return true;
  const security=raw?.security||raw?.threat||{};
  if([security.vpn,security.proxy,security.relay,security.tor,raw?.proxy,raw?.vpn,raw?.tor].some(val=>val===true)) return true;
  const type=lower(raw?.connection?.type||raw?.type);
  if(type&&(type.includes('hosting')||type.includes('datacenter')||type.includes('data center'))) return true;
  return false;
}

function primaryLanguageCode(){
  const langs=navigator.languages;
  if(langs&&langs.length){
    return String(langs[0]).split('-')[0].toLowerCase();

  return String(navigator.language||'').split('-')[0].toLowerCase();
}

function languageMismatch(langCode,countryCode){
  if(!langCode||!countryCode) return false;
  const lang=langCode.toLowerCase();
  if(!lang) return false;
  if(lang==='en') return false;
  const allowed=COUNTRY_LANG_MAP[countryCode.toLowerCase()];
  if(!allowed) return false;
  return !allowed.includes(lang);
}

function extractCanonicalDetailsFromPayload(payload){
  if(!payload||typeof payload!=='object') return null;
  const details={};
  const region=payload.region_name||payload.region||payload.state_prov||payload.state||payload.province||payload.regionName||null;
  if(region) details.region=String(region);
  const countryName=payload.country_name||payload.country||payload.countryName||payload.country_long||payload.country_full||null;
  if(countryName) details.country_name=String(countryName);
  const countryCode=payload.country_code||payload.countryCode||payload.country_code2||payload.country_code_iso3166||payload.country_code_iso3166_1_alpha_2||payload.cc||payload.country_code_iso||null;
  if(countryCode) details.country_code=String(countryCode).toUpperCase();
  let timezone=null;
  if(typeof payload.timezone==='string'){
    timezone=payload.timezone;
  }else if(payload.timezone&&typeof payload.timezone==='object'){
    timezone=payload.timezone.id||payload.timezone.name||payload.timezone.timezone||payload.timezone.current_time_zone||payload.timezone.current_time||payload.timezone.abbreviation||null;
  }else if(typeof payload.time_zone==='string'){
    timezone=payload.time_zone;
  }else if(payload.time_zone&&typeof payload.time_zone==='object'){
    timezone=payload.time_zone.name||payload.time_zone.id||null;
  }
  if(timezone) details.timezone=String(timezone);
  const calling=payload.country_calling_code||payload.calling_code||payload.country_call_code||payload.country_phone_code||payload.telephone_code||payload.phone_prefix||null;
  const normalizedCalling=normalizeCallingCode(calling);
  if(normalizedCalling) details.country_calling_code=normalizedCalling;
  const org=payload.org||payload.organization||payload.connection && (payload.connection.org||payload.connection.isp||payload.connection.asn)||payload.isp||payload.as||payload.company||payload.provider||payload.org_name||null;
  if(org) details.org=String(org);
  return Object.keys(details).length?details:null;
}

function normalizeHeaders(headers){
  if(!headers || typeof headers!=='object') return {};
  const out={};
  Object.entries(headers).forEach(([key,value])=>{
    if(value==null) return;
    if(Array.isArray(value)){
      out[key]=value.map(v=>String(v)).join(', ');
      out[key.toLowerCase()]=out[key];
    }else if(typeof value==='object'){
      const str=String(value.value||JSON.stringify(value));
      out[key]=str;
      out[key.toLowerCase()]=str;
    }else{
      const str=String(value);
      out[key]=str;
      out[key.toLowerCase()]=str;
    }
  });
  return out;
}

function ipFromHeaders(headers){
  const get=h=>headers[h]||headers[h.toLowerCase()]||headers[h.toUpperCase()];
  const forwarded=get('x-forwarded-for');
  if(forwarded){
    const first=forwarded.split(',')[0].trim();
    if(first) return first;
  }
  return get('cf-connecting-ip')||get('x-real-ip')||get('client-ip')||get('remote-addr')||null;
}

async function fetchIpData(){
  const attempts=[fetchIpFromHeaders,fetchIpFromIpapi,fetchIpFromIpwho,fetchIpFromIpify,fetchIpFromMyip];
  const errors=[];
  let aggregated=null;
  let details=null;
  let detailSource=null;
  for(const attempt of attempts){
    try{
      const result=await attempt();
      if(!result || (!result.ip && !result.raw)) throw new Error('empty');
      if(!aggregated){
        aggregated={...result};
      }else{
        if(result.ip && !aggregated.ip) aggregated.ip=result.ip;
        if(result.geo && (!aggregated.geo || (!aggregated.geo.city && !aggregated.geo.country))) aggregated.geo=result.geo;
        if(result.raw && !aggregated.raw) aggregated.raw=result.raw;
        if(result.headers && !aggregated.headers) aggregated.headers=result.headers;
        if(result.source && !aggregated.source) aggregated.source=result.source;
      }
      const candidate=extractCanonicalDetailsFromPayload(result.raw);
      if(candidate){
        if(!details) details={};
        Object.keys(candidate).forEach(key=>{
          if(candidate[key] && !details[key]){
            details[key]=candidate[key];
          }
        });
        if(!detailSource && result.source){
          detailSource=result.source;
        }
      }
      if(details && DETAIL_FIELDS.every(key=>details[key])){
        const completed={...aggregated};
        completed.details={...details};
        completed.detailSource=detailSource||result.source||aggregated.source||null;
        return completed;
      }
    }catch(err){
      errors.push(err.message||String(err));
    }
  }
  if(aggregated){
    const completed={...aggregated};
    if(details){
      completed.details={...details};
      completed.detailSource=detailSource||aggregated.source||null;
    }
    return completed;
  }
  const e=new Error(errors.join('; '));
  e.attempts=errors;
  throw e;
}

function evaluateVpnState(serverData){
  if(!serverData) return {status:'uncertain',reasons:[],checked:false};
  const details=serverData.details||extractCanonicalDetailsFromPayload(serverData.raw);
  if(!details) return {status:'uncertain',reasons:[],checked:false};
  const raw=serverData.raw||{};
  const headers=serverData.headers||{};
  const reasons=[];
  const ipTz=details.timezone||null;
  const localTz=LOCAL_TZ||null;
  if(ipTz && localTz && normalizeTimeZoneValue(ipTz)!==normalizeTimeZoneValue(localTz)){
    reasons.push('timezone');
  }
  const langCode=primaryLanguageCode();
  const countryCandidate=normalizeCountryCodeValue(details.country_code||raw.country_code||raw.countryCode||raw.cc);
  if(langCode && countryCandidate && languageMismatch(langCode,countryCandidate)){
    reasons.push('language');
  }
  if(providerLooksLikeVpn(details,raw)){
    reasons.push('asn');
  }
  const forwardedHeaders=['via','forwarded','x-forwarded-for','x-forwarded-host','x-forwarded-proto'];
  for(const name of forwardedHeaders){
    const value=headers?.[name]||headers?.[name?.toLowerCase?.()||name]||headers?.[name?.toUpperCase?.()||name];
    if(value){
      reasons.push('forwarded');
      break;
    }
  }
  if(raw.proxy===true||raw.vpn===true||raw.tor===true){
    reasons.push('forwarded');
  }
  const uniqueReasons=Array.from(new Set(reasons));
  let score=0;
  uniqueReasons.forEach(reason=>{
    if(reason==='asn'||reason==='forwarded') score+=3;
    else if(reason==='timezone') score+=1.5;
    else if(reason==='language') score+=1;
  });
  const connectionType=String(raw?.connection?.type||'').toLowerCase();
  const asType=String(raw?.asn?.type||'').toLowerCase();
  const looksResidential=[connectionType,asType].some(val=>val.includes('residential')||val.includes('consumer')||val.includes('isp')||val.includes('mobile')||val.includes('cellular'));
  let status='uncertain';
  if(score>=3){
    status='likely';
  }else if(score>=2.5){
    status='likely';
  }else if(score===0 && (details.timezone||details.country_name)){
    status='unlikely';
  }else if(looksResidential && score<2){
    status='unlikely';
  }
  return {status,reasons:uniqueReasons,checked:true};
}
async function runSpeedTest(){
  const BYTES=2000000;
  async function measure(url,timeout=10000){
    const cacheBust=Date.now();
    const target=url.includes('?')?`${url}&cacheBust=${cacheBust}`:`${url}?cacheBust=${cacheBust}`;
    const start=performance.now();
    const resp=await fetchWithTimeout(target,{timeout,mode:'cors',cache:'no-store',credentials:'omit'});
    let bytes=0;
    if(resp.body?.getReader){
      const reader=resp.body.getReader();
      while(true){
        const {done,value}=await reader.read();
        if(done) break;
        if(value) bytes+=value.byteLength;
      }
    }else{
      const buf=await resp.arrayBuffer();
      bytes=buf.byteLength;
    }
    if(bytes===0){
      const hint=parseInt(resp.headers.get('content-length')||'0',10);
      if(hint>0) bytes=hint;
    }
    if(bytes===0) bytes=BYTES;
    const duration=Math.max((performance.now()-start)/1000,0.001);
    const mbps=Number(((bytes*8)/(duration*1e6)).toFixed(2));
    const latency=Math.max(1,Math.round(duration*1000));
    return {mbps,latency,note:null};
  }

  const attempts=[
    {url:`https://speed.cloudflare.com/__down?bytes=${BYTES}`,timeout:12000},
    {url:`https://httpbin.org/bytes/${BYTES}`,timeout:12000}
  ];
  const errors=[];
  for(const attempt of attempts){
    try{
      return await measure(attempt.url,attempt.timeout);
    }catch(err){
      errors.push(err.message||String(err));
    }
  }
  const conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  if(conn?.downlink){
    const downlink=Number(conn.downlink||0);
    if(downlink>0){
      const latency=Math.max(1,Math.round(conn.rtt||100));
      return {mbps:Number(downlink.toFixed(2)),latency,note:'approx'};
    }
  }
  const e=new Error(errors.join('; '));
  e.attempts=errors;
  throw e;
}

let ipFetchPromise=null;
function autoFetchIp(){
  if(state.serverData) return Promise.resolve(state.serverData);
  if(ipFetchPromise) return ipFetchPromise;
  ipFetchPromise=(async()=>{
    try{
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),5000);
      const data=await fetchIpData();
      clearTimeout(timer);
      if(!data||typeof data!=='object') return null;
      state.serverData=data;
      state.vpn=evaluateVpnState(data);
      return data;
    }catch(e){
      console.warn('Auto IP fetch failed:',e.message);
      return null;
    }finally{
      ipFetchPromise=null;
    }
  })();
  return ipFetchPromise;
}


function resolveLocaleText(map,lang,fallback=''){
  if(!map) return fallback;
  const order=[];
  if(lang) order.push(lang);
  order.push('en','ru','uz');
  const seen=new Set();
  for(const code of order){
    if(!code || seen.has(code)) continue;
    seen.add(code);
    const candidate=map?.[code];
    if(typeof candidate==='string' && candidate.trim()){
      return candidate;
    }
  }
  const first=Object.values(map).find(val=>typeof val==='string' && val.trim());
  return first||fallback;
}

function humanConnectionType(type){
  if(!type) return '—';
  const lower=String(type).toLowerCase();
  const map={wifi:'Wi‑Fi',ethernet:'Ethernet',cellular:'Cellular',bluetooth:'Bluetooth'};
  if(map[lower]) return map[lower];
  if(/^\d[g]$/.test(lower)) return lower.toUpperCase();
  if(lower==='slow-2g') return '2G (slow)';
  if(lower==='2g'||lower==='3g'||lower==='4g'||lower==='5g') return lower.toUpperCase();
  return type;
}

function formatNetworkSummary(net){
  if(!net||(!net.effectiveType&&net.downlink==null&&net.rtt==null)) return null;
  const type=humanConnectionType(net.effectiveType);
  let downlink=null;
  if(typeof net.downlink==='number'&&!Number.isNaN(net.downlink)&&net.downlink>0){
    downlink=parseFloat(net.downlink.toFixed(1));
  }
  let rtt=null;
  if(typeof net.rtt==='number'&&!Number.isNaN(net.rtt)&&net.rtt>0){
    rtt=Math.round(net.rtt);
  }
  return {type,downlink,rtt};
}

const clockIntervals=new Map();

function clearClockIntervals(){
  clockIntervals.forEach(id=>clearInterval(id));
  clockIntervals.clear();
}

function initClockIntervals(root){
  if(typeof window==='undefined'||!root) return;
  root.querySelectorAll('[data-clock-tz]').forEach(node=>{
    const tz=node.getAttribute('data-clock-tz');
    if(!tz) return;
    const locale=node.getAttribute('data-clock-locale')||'ru-RU';
    const includeSeconds=node.getAttribute('data-clock-seconds')==='1';
    const update=()=>{
      try{
        const text=timeInTZ(tz,locale,includeSeconds);
        if(text) node.textContent=text;
      }catch(_){/* ignore */}
    };
    update();
    const id=window.setInterval(update,1000);
    clockIntervals.set(node,id);
  });
}

function describeTimeZoneLabel(timezone,locale){
  const result={country:null,raw:null};
  if(!timezone) return result;
  try{
    const fmt=new Intl.DateTimeFormat(locale,{timeZone:timezone,timeZoneName:'longGeneric'});
    const parts=fmt.formatToParts(new Date());
    const tzName=parts.find(part=>part.type==='timeZoneName')?.value||'';
    if(tzName){
      result.raw=tzName;
      result.country=extractCountryFromTimeZoneName(tzName);
    }
  }catch(_){/* ignore */}
  return result;
}

function extractCountryFromTimeZoneName(name){
  if(!name) return '';
  const comma=name.indexOf(',');
  if(comma!==-1) return name.slice(0,comma).trim();
  const patterns=[' standard time',' daylight time',' time',' vaqti',' vaqt',' waktu',' tijd',' zeit',' hora',' tiempo','時間','時刻','시간','saati','čas'];
  const lower=name.toLowerCase();
  for(const pattern of patterns){
    const idx=lower.indexOf(pattern);
    if(idx>0) return name.slice(0,idx).trim();
  }
  return name.trim();
}

function formatGpuRenderer(renderer){

  let cleaned=renderer.replace(/^ANGLE \((.*)\)$/,'$1');
  cleaned=cleaned.replace(/Direct3D.+/i,'');
  cleaned=cleaned.replace(/OpenGL ES [0-9\.]+/i,'');
  return cleaned.trim();
}

function summarizeKeyPermissions(entries,t){
  if(!Array.isArray(entries)||!entries.length) return [];
  const names=t.permNames||{};
  const states=t.permStates||{};
  const map=new Map(entries);
  const order=['geolocation','notifications','camera','microphone'];
  const out=[];
  order.forEach(key=>{
    if(!map.has(key)) return;
    const value=map.get(key);
    const label=names[key]||key;
    const state=states[value]||value;
    out.push(`${label}: ${state}`);
    map.delete(key);

    const state=states[value]||value;
    out.push(`${label}: ${state}`);
  });
  return out;
}


function renderShockBullets(basic,t,snapshot){
  const ul=getEl('shockList');
  if(!ul) return;
  if(!basic){
    clearClockIntervals();
    ul.innerHTML='';
    shockBulletCount=0;
    syncShockVisibility();
    return;
  }
  clearClockIntervals();
  const lines=[];
  const details=state.serverData?.details||{};
  const hasIp=!!state.serverData;

  // LOCATION (IP-dependent)
  if(hasIp){
    const city=details.city||state.serverData?.geo?.city||'';
    const region=details.region||details.country_name||state.serverData?.geo?.country||'';
    if(city||region){
      lines.push(t.shock.location(city||region,city?region:''));
    }
  }else if(!state.ipFetchDone){
    lines.push(t.shock.locationLoading);
  }

  // DEVICE
  const deviceRaw=guessDevice(basic);
  const deviceName=localizeDeviceName(deviceRaw,currentLang);
  if(deviceName){
    lines.push(t.shock.device(deviceName));
  }

  // SCREEN (only if HiDPI / Retina)
  if(basic.screen?.pixelRatio>=2){
    const desc=`${basic.screen.w}\u00D7${basic.screen.h}`;
    lines.push(t.shock.screen(desc));
  }

  // ISP (IP-dependent)
  if(hasIp&&details.org){
    lines.push(t.shock.isp(details.org));
  }

  // VPN (IP-dependent)
  const vpnState=state.vpn||{};
  if(hasIp&&vpnState.status==='likely'){
    lines.push(t.shock.vpnLikely);
  }

  // TIMEZONE MISMATCH (IP-dependent)
  if(hasIp&&details.timezone&&basic.timezone){
    const ipTzCountry=details.timezone.split('/')[0]||'';
    const browserTzCountry=basic.timezone.split('/')[0]||'';
    if(ipTzCountry&&browserTzCountry&&ipTzCountry!==browserTzCountry){
      const ipCountry=details.country_name||ipTzCountry;
      const tzCountry=browserTzCountry;
      lines.push(t.shock.tzMismatch(ipCountry,tzCountry));
    }
  }

  // WEBRTC LEAK
  const profiling=state.profilingContext;
  const webrtcIp=profiling?.webrtcLocalIp||null;
  if(webrtcIp&&state.serverData?.ip&&webrtcIp!==state.serverData.ip){
    lines.push(t.shock.webrtcLeak(webrtcIp));
  }

  // CANVAS
  if(basic.hashes?.canvas){
    lines.push(t.shock.canvas);
  }

  // AD BLOCKER
  if(basic.exposure?.adblock){
    lines.push(t.shock.adblock);
  }

  // PLUGINS
  const pluginCount=(basic.plugins||[]).length;
  if(pluginCount>3){
    lines.push(t.shock.plugins(pluginCount));
  }

  // CAMERA/MIC GRANTED
  const perms=basic.perms||{};
  if(perms.camera==='granted'||perms.microphone==='granted'){
    lines.push(t.shock.micGranted);
  }

  // LANGUAGES (if more than 2)
  if(basic.languages&&basic.languages.length>2){
    const langs=basic.languages.slice(0,5).join(', ');
    lines.push(t.shock.languages(langs));
  }

  // BATTERY (if low)
  if(basic.battery&&basic.battery.level!=null&&!basic.battery.unavailable&&basic.battery.level<0.3){
    const pct=Math.round(basic.battery.level*100);
    lines.push(t.shock.battery(pct));
  }

  // MEDIA DEVICES (if many)
  const mediaCount=(basic.media?.audioInput||0)+(basic.media?.videoInput||0);
  if(mediaCount>2){
    lines.push(t.shock.mediaDevices(mediaCount));
  }

  // SLOW/MOBILE CONNECTION
  const net=basic.net||{};
  if(net.effectiveType==='slow-2g'||net.effectiveType==='2g'||net.effectiveType==='3g'){
    lines.push(t.shock.slowConnection(net.effectiveType));
  }else if(net.effectiveType==='4g'&&net.downlink&&net.downlink<5){
    lines.push(t.shock.mobileConnection);
  }

  // FINGERPRINT ID (always last)
  if(snapshot?.fp){
    const shortHash=snapshot.fp.substring(0,8);
    const pct=snapshot.pct||0;
    lines.push(t.shock.fingerprintId(shortHash,Math.round(pct)));
  }

  // Render
  ul.innerHTML='';
  lines.filter(Boolean).forEach(text=>{
    const li=document.createElement('li');
    li.textContent=text;
    ul.appendChild(li);
  });
  shockBulletCount=lines.filter(Boolean).length;
  syncShockVisibility();
}

function buildPersonalizedAdvice({basic,state,pct,level},t){
  const adv=t.uniqAdvice||{};

  const trackerCount=Array.isArray(exposure.trackers)?exposure.trackers.length:0;
  const resourceCount=Array.isArray(exposure.resources)?exposure.resources.length:0;
  const context={basic,state,pct,level,grantedPerms,fontCount,trackerCount,resourceCount};
  const push=(key,condition=true)=>{
    if(!condition||used.has(key)) return;
    const template=adv[key];
    if(!template) return;
    const text=typeof template==='function'?template(context):template;
    if(!text) return;
    used.add(key);
    picks.push(text);
  };

  push('separateProfiles',level!=='low');
  push('canvasShield',Boolean(basic.hashes?.canvas||basic.hashes?.audio));
  push('storage',Boolean(basic.storage?.local||basic.storage?.session||basic.storage?.indexedDB));
  push('cookies',basic.cookiesEnabled===true);
  push('permissions',grantedPerms.length>0);
  push('plugins',Array.isArray(basic.plugins)&&basic.plugins.length>0);
  push('fonts',fontCount>0);
  push('trackers',trackerCount>0);
  push('resources',resourceCount>3);
  push('vpn',state.vpn?.status!=='likely'&&level!=='low');
  push('browser',Array.isArray(basic.uaBrands)&&basic.uaBrands.some(brand=>(brand.brand||'').toLowerCase().includes('arc')));

  push('privacyMode',level==='high');
  push('network',String(basic.net?.effectiveType||'').toLowerCase().includes('cell'));

  for(const key of fallback){
    if(picks.length>=7) break;
    push(key,true);
  }
  return picks.slice(0,7);
}

  let speedText=null;
  if(speedState.status==='done'){
    const parts=[];
    if(typeof speedState.mbps==='number'&&!Number.isNaN(speedState.mbps)) parts.push(`${speedState.mbps.toFixed(1)} ${units.mbps||'Mbps'}`);
    if(typeof speedState.latency==='number'&&!Number.isNaN(speedState.latency)) parts.push(`${labels.latency||'Latency'} ${speedState.latency} ${units.ms||'ms'}`);
    speedText=parts.join(' • ');
  }else if(speedState.status==='running'){
    speedText=t.speed?.running||null;
  }else if(speedState.status==='error'){
    speedText=speedState.error||null;
  }
  let location=locationLabel;
  if(!location){
    const details=state.serverData?.details||{};
    const parts=[details.region,details.country_name].filter(Boolean);
    if(parts.length) location=parts.join(', ');
    else if(details.timezone) location=details.timezone;
  }
  const provider=state.serverData?.details?.org||state.serverData?.detailSource||null;
  const ctx={
    unknown:cfg.unknown||'—',
    deviceLabel,
    deviceConfidence:Math.round((deviceFinding?.confidence||0)*100),
    osLabel,
    osConfidence:Math.round((osFinding?.confidence||0)*100),
    vpnLabel,
    vpnConfidence:Math.round((vpnFinding?.confidence||0)*100),
    location:location||null,
    connection:connectionText||networkLabel||null,
    connectionRaw:networkLabel||null,
    speedText:speedText,
    provider:provider||null,
    batteryText:batteryText,
    localTime:`${localTime}${timezone?` (${timezone})`:''}`,
    deviceFinding,
    osFinding,
    vpnFinding,
    locationFinding,
    networkFinding
  };
  return ctx;
}

async function collectExposureData(basic){
  const fonts=new Set();
  const trackers=new Set();
  const resources=new Set();
  try{
    const entries=performance?.getEntriesByType?.('resource')||[];
    entries.forEach(entry=>{
      const name=entry?.name;
      if(!name||typeof name!=='string') return;
      if(name.startsWith('data:')) return;
      let url;
      try{url=new URL(name,location.href);}catch(_){return;}
      if(url.origin===location.origin) return;
      const host=url.host;
      const initiator=(entry.initiatorType||'resource');
      resources.add(`${host} (${initiator})`);
      if((initiator||'').toLowerCase()==='font') fonts.add(host);
      const hostLower=host.toLowerCase();
      const pathLower=url.pathname.toLowerCase();
      if(TRACKER_PATTERNS.some(pattern=>hostLower.includes(pattern)||pathLower.includes(pattern))){
        trackers.add(host);
      }
    });
  }catch(_){/* ignore */}
  return {
    fonts:Array.from(fonts),
    trackers:Array.from(trackers),
    resources:Array.from(resources)
  };
}

function formatMonitorText(info,t){
  if(!info||!info.mode) return t.monitorText?.unknown||'';
  if(info.mode==='multi'){
    const label=t.monitorText?.multi;
    const count=info.count||2;
    if(typeof label==='function') return label(count);
    return label||'';
  }
  if(info.mode==='single'){
    const label=t.monitorText?.single;
    if(typeof label==='function') return label(info.count||1);
    return label||'';
  }
  return t.monitorText?.unknown||'';
}


let profilerModulePromise=null;
let profilerLoadError=null;
let profilingSequence=0;

function loadProfilerModule(){
  if(profilerModulePromise) return profilerModulePromise;
  if(globalThis.__profilerModule){
    profilerModulePromise=Promise.resolve(globalThis.__profilerModule);
    return profilerModulePromise;
  }
  profilerLoadError=null;
  profilerModulePromise=import('./src/profiler.js').then(mod=>{profilerLoadError=null;globalThis.__profilerModule=mod;return mod;}).catch(err=>{
    profilerLoadError=err;
    profilerModulePromise=null;
    throw err;
  });
  return profilerModulePromise;
}

function normalizeAsnCategory(value){
  const str=String(value||'').toLowerCase();
  if(!str) return 'unknown';
  if(str.includes('residential')||str.includes('consumer')||str.includes('isp')||str.includes('mobile')||str.includes('cellular')) return 'residential';
  if(str.includes('hosting')||str.includes('datacenter')||str.includes('data center')||str.includes('cloud')||str.includes('cdn')) return 'hosting';
  if(str.includes('business')||str.includes('corporate')||str.includes('enterprise')||str.includes('university')) return 'corporate';
  return 'unknown';
}

function buildProfilerIpGeo(){
  if(!state.serverData) return undefined;
  const details=state.serverData.details||extractCanonicalDetailsFromPayload(state.serverData.raw)||{};
  const geo=state.serverData.geo||{};
  const raw=state.serverData.raw||{};
  const ip=state.serverData.ip||details.ip||raw.ip||null;
  const country=details.country_name||details.country||geo.country_name||geo.country||raw.country_name||null;
  const region=details.region||details.city||geo.region||geo.city||null;
  const asnRaw=raw.asn||{};
  const asn=details.asn||details.org||asnRaw.asn||asnRaw.name||raw.org||null;
  const asnType=normalizeAsnCategory(details.asn_type||asnRaw.type||raw.connection?.type||raw.type);
  const latency=typeof state.speed?.latency==='number'?state.speed.latency:(typeof raw.connection?.rtt==='number'?raw.connection.rtt:null);
  const result={asnType};
  if(ip) result.ip=String(ip);
  if(country) result.country=String(country);
  if(region) result.region=String(region);
  if(asn) result.asn=String(asn);
  if(latency!=null) result.rttMs=Number(latency);
  return result;
}

function formatProfilingValue(finding,cfg){
  const values=cfg.values||{};
  const formatter=values[finding.key];
  if(typeof formatter==='function') return formatter(finding);
  return finding.value;
}

function syncShockVisibility(){
  const shock=getEl('shock');
  const section=getEl('shockSection');
  const visible=shockBulletCount>0;
  if(shock) shock.style.display=visible?'block':'none';
  if(section) section.style.display=visible?'block':'none';
}

async function renderProfilingSection(basic,t){
  state.profilingContext=null;
  if(!basic){
    renderShockBullets(null,t);
    syncShockVisibility();
    return;
  }
  try{
    globalThis.__fingerprintBasic=basic;
  }catch(_){/* ignore */}
  const runId=++profilingSequence;
  const ipGeo=buildProfilerIpGeo();
  try{
    const mod=await loadProfilerModule();
    if(runId!==profilingSequence) return;
    if(profilerLoadError){
      throw profilerLoadError;
    }
    const findings=await mod.runProfiling(ipGeo);
    if(runId!==profilingSequence) return;
    const context=buildProfilingContext(findings,basic,t);
    state.profilingContext=context;
    renderShockBullets(basic,t,snapshotCache);
    syncShockVisibility();
  }catch(err){
    if(runId!==profilingSequence) return;
    state.profilingContext=null;
    console.error('Profiling error',err);
    renderShockBullets(basic,t,snapshotCache);
    syncShockVisibility();
  }
}

        else if(typeof v==='number'&&!Number.isNaN(v))filled++;

function detectLang(){

    const saved=localStorage.getItem('fp_lang');
    if(saved&&I18N[saved])return saved;
    const n=navigator.language||'ru';
    if(n.startsWith('ru'))return'ru';
    if(n.startsWith('en'))return'en';
    if(n.startsWith('uz'))return'uz';
    return'ru';
  }catch(_){return'ru';}
}

function resolveShareUrl(){
  try{
    const {origin,pathname}=window.location;
    if(origin&&origin!=='null'&&origin.startsWith('http')){
      const cleanPath=pathname.replace(/index\.html$/,'');
      const base=`${origin}${cleanPath}`.replace(/\/$/,'');
      return base||origin;
    }
  }catch(_){/* ignore */}
  return CANONICAL_URL;
}

function svgEscape(str){
  return String(str||'').replace(/[&<>'"]/g,ch=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[ch]);
}

async function copyText(value){
  if(navigator.clipboard&&window.isSecureContext){
    await navigator.clipboard.writeText(value);
    return;
  }
  const textarea=document.createElement('textarea');
  textarea.value=value;
  textarea.setAttribute('readonly','');
  textarea.style.position='absolute';
  textarea.style.left='-9999px';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
}

  const payload=state.sharePayload;
  if(!payload){
    flashShareMessage(btn,t.share?.unavailable||t.ip?.button||t.saveButton,btn.dataset.label);
    return;
  }
  const defaultLabel=btn.dataset.label||btn.textContent;
  btn.disabled=true;
  try{
    const text=payload.text;
    const title=payload.title;
    const url=payload.url;
    let shared=false;
    if(typeof navigator.share==='function'){
      let file=null;
      if(typeof File==='function'){
        try{
          const svg=createShareCardSvg(payload,t);
          file=new File([svg],'fingerprint-share.svg',{type:'image/svg+xml'});
        }catch(_){file=null;}
      }
      const baseData={title,text,url};
      if(file){
        const richData={...baseData,files:[file]};
        if(typeof navigator.canShare!=='function'||navigator.canShare(richData)){
          await navigator.share(richData);
          shared=true;
        }
      }
      if(!shared){
        await navigator.share(baseData);
        shared=true;
      }
    }
    if(shared){
      flashShareMessage(btn,t.share?.shared||t.share?.success||t.copy?.done||'Shared!',defaultLabel);
      return;
    }
    await copyText(`${text}\n${url}`);
    flashShareMessage(btn,t.share?.copied||t.copy?.done||'Copied!',defaultLabel);
  }catch(err){
    try{
      await copyText(`${payload.text}\n${payload.url}`);
      flashShareMessage(btn,t.share?.copied||t.copy?.done||'Copied!',defaultLabel);
    }catch(copyErr){
      console.error('share failed',err,copyErr);
      alert(t.share?.error||t.errorMessage?.(copyErr.message||String(copyErr))||String(copyErr));
    }
  }finally{
    btn.disabled=false;
  }
}

async function handleSaveClick(){
  const filename=`fingerprint-${new Date().toISOString().slice(0,10)}.html`;
  const html=document.documentElement.outerHTML;
  const blob=new Blob([html],{type:'text/html'});
  if(IS_IOS && typeof navigator.share==='function'){
    try{
      const fileType={type:'text/html'};
      const file=typeof File==='function'?new File([blob],filename,fileType):null;
      const payload=file?{files:[file],title:'Fingerprint snapshot'}:{title:'Fingerprint snapshot',text:html};
      let canShare=true;
      if(typeof navigator.canShare==='function'){
        try{
          canShare=navigator.canShare(payload);
        }catch(_){
          canShare=false;
        }
      }
      if(canShare){
        await navigator.share(payload);
        return;
      }
    }catch(_){/* fallback to download */}
  }else if(typeof window.print==='function'){
    try{
      window.print();
      return;
    }catch(_){/* fallback */}
  }
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.download=filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function renderChangelog(lang){
  const t=I18N[lang]||I18N.ru;
  const modal=document.getElementById('changelogModal');
  const content=document.getElementById('changelogContent');
  const heading=document.getElementById('changelogTitle');
  const headingLabels={ru:'История изменений',en:'Changelog',uz:"O'zgarishlar tarixi"};
  if(heading) heading.textContent=headingLabels[lang]||headingLabels.ru;
  if(!content) return;
  const frag=document.createDocumentFragment();
  CHANGELOG.forEach(entry=>{
    const section=document.createElement('div');
    section.style.cssText='margin-bottom:20px';
    const header=document.createElement('div');
    header.style.cssText='display:flex;gap:10px;align-items:baseline;margin-bottom:8px';
    const ver=document.createElement('strong');
    ver.style.cssText='font-size:15px;color:var(--accent)';
    ver.textContent=`v${entry.version}`;
    const date=document.createElement('span');
    date.style.cssText='font-size:13px;color:var(--muted)';
    date.textContent=entry.date;
    header.appendChild(ver);
    header.appendChild(date);
    section.appendChild(header);
    const ul=document.createElement('ul');
    ul.style.cssText='margin:0 0 0 18px;padding:0;font-size:14px;line-height:1.6';
    const items=(entry.changes[lang]||entry.changes.en||[]);
    items.forEach(item=>{
      const li=document.createElement('li');
      li.style.cssText='margin:3px 0;color:var(--text)';
      li.textContent=item;
      ul.appendChild(li);
    });
    section.appendChild(ul);
    frag.appendChild(section);
  });
  content.innerHTML='';
  content.appendChild(frag);
}

function openChangelog(){
  const modal=document.getElementById('changelogModal');
  if(modal){
    renderChangelog(currentLang);
    modal.style.display='block';
    document.body.style.overflow='hidden';
    const closeBtn=document.getElementById('changelogClose');
    if(closeBtn) closeBtn.focus();
  }
}

function closeChangelog(){
  const modal=document.getElementById('changelogModal');
  if(modal){
    modal.style.display='none';
    document.body.style.overflow='';
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  themePreference=loadThemePreference();
  applyThemePreference(themePreference);
  const lang=detectLang();
  try{localStorage.setItem('fp_lang',lang);}catch(_){/* ignore */}
  const shareBtnEl=getEl('shareBtn');
  if(shareBtnEl){
    shareBtnEl.addEventListener('click',()=>{handleShareClick().catch(()=>{});});
  }
  const printBtn=getEl('printBtn');
  if(printBtn){
    printBtn.addEventListener('click',()=>{handleSaveClick().catch(()=>{});});
  }
  const langBtn=getEl('langBtn');
  const langMenu=getEl('langMenu');
  if(langBtn&&langMenu){
    langBtn.addEventListener('click',event=>{
      event.preventDefault();
      event.stopPropagation();
      const next=!langMenuIsOpen;
      setThemeMenu(false);
      setLangMenu(next);
    });
    langMenu.querySelectorAll('button[data-lang]').forEach(btn=>{
      btn.addEventListener('click',event=>{
        event.preventDefault();
        event.stopPropagation();
        const value=btn.dataset.lang;
        if(!value) return;
        langMenuIsOpen=false;
        setLangMenu(false);
        try{localStorage.setItem('fp_lang',value);}catch(_){/* ignore */}
        langBtn.focus({preventScroll:true});
        render(value);
      });
    });
    document.addEventListener('click',event=>{
      if(!langMenuIsOpen) return;
      if(langMenu.contains(event.target)||event.target===langBtn) return;
      setLangMenu(false);
    });
  }
  const themeBtn=getEl('themeBtn');
  const themeMenu=getEl('themeMenu');
  if(themeBtn&&themeMenu){
    themeBtn.addEventListener('click',event=>{
      event.preventDefault();
      event.stopPropagation();
      const next=!themeMenuIsOpen;
      setLangMenu(false);
      setThemeMenu(next);
    });
    themeMenu.querySelectorAll('button[data-theme]').forEach(btn=>{
      btn.addEventListener('click',event=>{
        event.preventDefault();
        event.stopPropagation();
        const value=btn.dataset.theme;
        if(!value) return;
        applyThemePreference(value);
        updateThemeButton(I18N[currentLang]||I18N.ru);
        setThemeMenu(false);
        themeBtn.focus({preventScroll:true});
      });
    });
    document.addEventListener('click',event=>{
      if(themeMenuIsOpen&&!(themeMenu.contains(event.target)||event.target===themeBtn)){
        setThemeMenu(false);
      }
    });
  }
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'){
      setLangMenu(false);
      setThemeMenu(false);
      closeChangelog();
    }
  });
  document.getElementById('changelogClose')?.addEventListener('click', closeChangelog);
  document.getElementById('changelogModal')?.addEventListener('click', e => {
    if(e.target===document.getElementById('changelogModal')) closeChangelog();
  });
  render(lang);
});
</script>
