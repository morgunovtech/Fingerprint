<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fingerprint — by morgunov.tech</title>
  <meta name="description" content="Fingerprint показывает, какие данные о вас сразу получает сайт, как они влияют на приватность и какие шаги помогут защититься. Все расчеты выполняются локально." />
  <style>
    :root{
      --bg:#0b0f14; --card:#0f1520; --text:#e6edf3; --muted:#9aa7b3; --border:#243042;
      --r:16px; --shadow:0 10px 30px rgba(0,0,0,.25);
      --good:#22c55e; --mid:#f59e0b; --bad:#ef4444; --accent:#60a5fa;
    }
    @media (prefers-color-scheme: light){
      :root{ --bg:#ffffff; --card:#ffffff; --text:#0b1220; --muted:#4b5563; --border:#e5e7eb; --shadow:0 6px 24px rgba(17,24,39,.08); --accent:#2563eb; }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);
         font:15px/1.65 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Helvetica,Arial;
         -webkit-font-smoothing:antialiased}
    .wrap{max-width:1100px;margin:24px auto 72px;padding:0 20px}
    header{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
    h1{font-size:22px;margin:0}
    .sub{color:var(--muted);font-size:14px}
    .toolbar{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
    select{
      border:1px solid var(--border);background:transparent;color:var(--text);
      padding:6px 10px;border-radius:10px;font:inherit
    }
    .block{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:16px 0}
    .legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);margin:12px 0 0}
    .chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;border:1px solid var(--border)}
    .dot{display:inline-block;width:12px;height:12px;border-radius:50%}
    .low{background:#22c55e}.med{background:#f59e0b}.high{background:#ef4444}
    .big{font-weight:700;font-size:21px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;margin-bottom:12px}
    .big .dot{margin-top:0}
    .uniq-note{font-size:14px;color:var(--muted);line-height:1.5;display:block;margin:0;grid-column:1/-1;max-width:720px}
    .danger{margin:8px 0 0; padding:10px 12px; border:1px solid #ef4444; border-radius:10px; background:rgba(239,68,68,.08);}
    .danger ul{margin:6px 0 0 18px; padding:0}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
    .card{border:1px solid var(--border);border-radius:12px;padding:12px}
    .title{font-weight:700;margin-bottom:6px}
    .val{white-space:normal;word-break:break-word}
    .line{display:block;margin-top:4px}
    .hint{color:var(--text)}
    .adv{color:var(--muted)}
    .small{color:var(--muted);font-size:14px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:13px}
    .copyable{cursor:pointer}
    @media (max-width:920px){ .cards{grid-template-columns:1fr} }
    a{color:var(--accent);text-decoration:none}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{display:inline-flex;justify-content:center;align-items:center;border:1px solid var(--border);background:transparent;color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;transition:background-color .2s,border-color .2s,color .2s;text-align:center}
    .btn:hover{background-color:rgba(96,165,250,0.12);border-color:var(--accent);color:var(--accent)}
    .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    #shockList{list-style:none;margin:6px 0 0;padding:0}
    #shockList li{margin:4px 0}
    details{margin-top:8px}
    @media (max-width:720px){
      h1{font-size:20px}
      .wrap{padding:0 16px}
      .block{padding:16px}
      .big{font-size:19px;grid-template-columns:min-content 1fr}
      header{align-items:flex-start}
      .toolbar{margin-left:0}
    }
    @media (max-width:520px){
      body{font-size:14px}
      .legend span{font-size:13px}
      .legend .chip{padding:4px 8px;font-size:12px}
      .big{gap:10px}
      .btn{width:100%;justify-content:center}
      .legend{gap:6px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fingerprint</h1><span class="sub">by morgunov.tech</span>
    <div class="toolbar">
      <select id="lang">
        <option value="ru">🇷🇺 Русский</option>
        <option value="en">🇬🇧 English</option>
        <option value="uz">🇺🇿 Oʻzbekcha</option>
      </select>
      <button class="btn" id="printBtn"></button>
    </div>
  </header>

  <!-- Block 1: Intro -->
  <section class="block">
    <div id="introTitle" style="font-weight:700;margin-bottom:6px"></div>
    <div id="introText" class="small"></div>
    <div id="legend" class="legend"></div>
  </section>

  <!-- Block 2: Uniqueness + shock -->
  <section class="block">
    <div id="uniqLine" class="big"></div>
    <div class="row" id="ipActionRow" style="margin:10px 0">
      <button class="btn" id="ipBtn"></button>
    </div>
    <div id="shock" class="danger" style="display:none">
      <div class="small" id="shockTitle"></div>
      <ul id="shockList"></ul>
      <div id="ipInfo" class="small" style="margin-top:10px"></div>
      <div id="speedResult" class="small" style="margin-top:6px"></div>
    </div>
  </section>

  <!-- Block 3: Detailed cards -->
  <section class="block">
    <div id="detailTitle" style="font-weight:700;margin-bottom:6px"></div>
    <div class="cards" id="cards"></div>
  </section>

  <!-- Block 4: Methodology & Policy -->
  <section class="block">
    <details>
      <summary id="methodSummary"></summary>
      <div class="small" id="methodText" style="margin-top:6px"></div>
    </details>
    <details>
      <summary id="policySummary"></summary>
      <div class="small" id="policyText" style="margin-top:6px"></div>
    </details>
  </section>

  <footer class="small" style="text-align:center;color:var(--muted)" id="footerText">
    © morgunov.tech • Локальный аудит отпечатка • Версия: 07.10.25 (CalVer (DD.MM.YY))
  </footer>
</div>

const H_CDF = [

const ALPHA = 1; // Laplace
const FREQ_META = Object.fromEntries(Object.entries(FREQ).map(([name,table])=>{
  const entries=Object.entries(table).map(([k,v])=>[k,Math.max(v,0)]);
  const total=entries.reduce((sum,[,v])=>sum+v,0);

function pFrom(table,key){
  const meta=FREQ_META[table];
  if(!meta)return 1;
  const {table:freq,total,size}=meta;
  const fallback=freq.__other??0;
  const value=Object.prototype.hasOwnProperty.call(freq,key)?freq[key]:fallback;
  return (value+ALPHA)/(total+ALPHA*size);

function entropyFromFeatures(f){

  H += -Math.log2(pFrom('langs.count', f.langsCount));
  H += -Math.log2(pFrom('gpu.brand', f.gpuBrand));
  H += -Math.log2(pFrom('has.canvas', f.hasCanvas));
  H += -Math.log2(pFrom('has.audio', f.hasAudio));
  H += -Math.log2(pFrom('plugins.bucket', f.pluginsBucket));
  H += -Math.log2(pFrom('perm.bucket', f.permBucket));
  H += -Math.log2(pFrom('ip.detail', f.ipDetail));
  H += -Math.log2(pFrom('ip.country', f.ipCountry));
  H += -Math.log2(pFrom('speed.bucket', f.speedBucket));
  H += -Math.log2(pFrom('latency.bucket', f.latencyBucket));
  // лёгкая коррекция зависимостей (GPU×browser Safari/Apple; screen×dpr)
  if(f.browser==='Safari' && f.gpuBrand==='Apple') H -= 1.0;

function percentileFromH(H){

  if(H<=H_CDF[0][0])return Math.round(H_CDF[0][1]*100);
  for(let i=1;i<H_CDF.length;i++){
    const [x1,y1]=H_CDF[i-1]; const [x2,y2]=H_CDF[i];
    if(H<=x2){ const t=(H-x1)/(x2-x1); return Math.round((y1+t*(y2-y1))*100); }
  }
  return 100;
}

async function fetchWithTimeout(url,{timeout=6000,...options}={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const resp=await fetch(url,{...options,signal:controller.signal});
    if(!resp.ok) throw new Error(resp.statusText||`HTTP ${resp.status}`);
    return resp;
  }catch(e){
    if(e.name==='AbortError') throw new Error('timeout');
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

function normalizeCallingCode(code){
  if(code==null) return null;
  let str=String(code).trim();
  if(!str) return null;
  str=str.replace(/[^0-9+]/g,'');
  while(str.startsWith('+')){
    str=str.slice(1);
  }
  if(!str) return null;
  return `+${str}`;
}

function normalizeTimeZoneValue(tz){
  return String(tz||'').trim().toLowerCase();
}

function providerLooksLikeVpn(details,raw){
  const lower=str=>String(str||'').toLowerCase();
  const candidates=[
    details?.org,
    raw?.org,
    raw?.isp,
    raw?.as,
    raw?.company,
    raw?.connection?.isp,
    raw?.connection?.org,
    raw?.asn?.org,
    raw?.asn?.name
  ].map(lower).filter(Boolean);
  if(candidates.some(org=>VPN_KEYWORDS.some(key=>org.includes(key)))) return true;
  const security=raw?.security||raw?.threat||{};
  if([security.vpn,security.proxy,security.relay,security.tor,raw?.proxy,raw?.vpn,raw?.tor].some(val=>val===true)) return true;
  const type=lower(raw?.connection?.type||raw?.type);
  if(type&&(type.includes('hosting')||type.includes('datacenter')||type.includes('data center'))) return true;
  return false;
}

function primaryLanguageCode(){
  const langs=navigator.languages;
  if(langs&&langs.length){
    return String(langs[0]).split('-')[0].toLowerCase();
  }
  return String(navigator.language||'').split('-')[0].toLowerCase();
}

function languageMismatch(langCode,countryCode){
  if(!langCode||!countryCode) return false;
  const lang=langCode.toLowerCase();
  if(!lang) return false;
  if(lang==='en') return false;
  const allowed=COUNTRY_LANG_MAP[countryCode.toLowerCase()];
  if(!allowed) return false;
  return !allowed.includes(lang);
}

function extractCanonicalDetailsFromPayload(payload){
  if(!payload||typeof payload!=='object') return null;
  const details={};
  const region=payload.region_name||payload.region||payload.state_prov||payload.state||payload.province||payload.regionName||null;
  if(region) details.region=String(region);
  const countryName=payload.country_name||payload.country||payload.countryName||payload.country_long||payload.country_full||null;
  if(countryName) details.country_name=String(countryName);
  const countryCode=payload.country_code||payload.countryCode||payload.country_code2||payload.country_code_iso3166||payload.country_code_iso3166_1_alpha_2||payload.cc||payload.country_code_iso||null;
  if(countryCode) details.country_code=String(countryCode).toUpperCase();
  let timezone=null;
  if(typeof payload.timezone==='string'){
    timezone=payload.timezone;
  }else if(payload.timezone&&typeof payload.timezone==='object'){
    timezone=payload.timezone.id||payload.timezone.name||payload.timezone.timezone||payload.timezone.current_time_zone||payload.timezone.current_time||payload.timezone.abbreviation||null;
  }else if(typeof payload.time_zone==='string'){
    timezone=payload.time_zone;
  }else if(payload.time_zone&&typeof payload.time_zone==='object'){
    timezone=payload.time_zone.name||payload.time_zone.id||null;
  }
  if(timezone) details.timezone=String(timezone);
  const calling=payload.country_calling_code||payload.calling_code||payload.country_call_code||payload.country_phone_code||payload.telephone_code||payload.phone_prefix||null;
  const normalizedCalling=normalizeCallingCode(calling);
  if(normalizedCalling) details.country_calling_code=normalizedCalling;
  const org=payload.org||payload.organization||payload.connection && (payload.connection.org||payload.connection.isp||payload.connection.asn)||payload.isp||payload.as||payload.company||payload.provider||payload.org_name||null;
  if(org) details.org=String(org);
  return Object.keys(details).length?details:null;
}

function normalizeHeaders(headers){
  if(!headers || typeof headers!=='object') return {};
  const out={};
  Object.entries(headers).forEach(([key,value])=>{
    if(value==null) return;
    if(Array.isArray(value)){
      out[key]=value.map(v=>String(v)).join(', ');
      out[key.toLowerCase()]=out[key];
    }else if(typeof value==='object'){
      const str=String(value.value||JSON.stringify(value));
      out[key]=str;
      out[key.toLowerCase()]=str;
    }else{
      const str=String(value);
      out[key]=str;
      out[key.toLowerCase()]=str;
    }
  });
  return out;
}

function ipFromHeaders(headers){
  const get=h=>headers[h]||headers[h.toLowerCase()]||headers[h.toUpperCase()];
  const forwarded=get('x-forwarded-for');
  if(forwarded){
    const first=forwarded.split(',')[0].trim();
    if(first) return first;
  }
  return get('cf-connecting-ip')||get('x-real-ip')||get('client-ip')||get('remote-addr')||null;
}

async function fetchIpData(){
  const attempts=[fetchIpFromHeaders,fetchIpFromIpapi,fetchIpFromIpwho,fetchIpFromIpify,fetchIpFromMyip];
  const errors=[];
  let aggregated=null;
  let details=null;
  let detailSource=null;
  for(const attempt of attempts){
    try{
      const result=await attempt();
      if(!result || (!result.ip && !result.raw)) throw new Error('empty');
      if(!aggregated){
        aggregated={...result};
      }else{
        if(result.ip && !aggregated.ip) aggregated.ip=result.ip;
        if(result.geo && (!aggregated.geo || (!aggregated.geo.city && !aggregated.geo.country))) aggregated.geo=result.geo;
        if(result.raw && !aggregated.raw) aggregated.raw=result.raw;
        if(result.headers && !aggregated.headers) aggregated.headers=result.headers;
        if(result.source && !aggregated.source) aggregated.source=result.source;
      }
      const candidate=extractCanonicalDetailsFromPayload(result.raw);
      if(candidate){
        if(!details) details={};
        Object.keys(candidate).forEach(key=>{
          if(candidate[key] && !details[key]){
            details[key]=candidate[key];
          }
        });
        if(!detailSource && result.source){
          detailSource=result.source;
        }
      }
      if(details && DETAIL_FIELDS.every(key=>details[key])){
        const completed={...aggregated};
        completed.details={...details};
        completed.detailSource=detailSource||result.source||aggregated.source||null;
        return completed;
      }
    }catch(err){
      errors.push(err.message||String(err));
    }
  }
  if(aggregated){
    const completed={...aggregated};
    if(details){
      completed.details={...details};
      completed.detailSource=detailSource||aggregated.source||null;
    }
    return completed;
  }
  const e=new Error(errors.join('; '));
  e.attempts=errors;
  throw e;
}

function evaluateVpnState(serverData){
  if(!serverData) return {status:'uncertain',reasons:[],checked:false};
  const details=serverData.details||extractCanonicalDetailsFromPayload(serverData.raw);
  if(!details) return {status:'uncertain',reasons:[],checked:false};
  const raw=serverData.raw||{};
  const headers=serverData.headers||{};
  const reasons=[];
  const ipTz=details.timezone||null;
  const localTz=LOCAL_TZ||null;
  if(ipTz && localTz && normalizeTimeZoneValue(ipTz)!==normalizeTimeZoneValue(localTz)){
    reasons.push('timezone');
  }
  const langCode=primaryLanguageCode();
  const countryCandidate=normalizeCountryCodeValue(details.country_code||raw.country_code||raw.countryCode||raw.cc);
  if(langCode && countryCandidate && languageMismatch(langCode,countryCandidate)){
    reasons.push('language');
  }
  if(providerLooksLikeVpn(details,raw)){
    reasons.push('asn');
  }
  const forwardedHeaders=['via','forwarded','x-forwarded-for','x-forwarded-host','x-forwarded-proto'];
  for(const name of forwardedHeaders){
    const value=headers?.[name]||headers?.[name?.toLowerCase?.()||name]||headers?.[name?.toUpperCase?.()||name];
    if(value){
      reasons.push('forwarded');
      break;
    }
  }
  if(raw.proxy===true||raw.vpn===true||raw.tor===true){
    reasons.push('forwarded');
  }
  const uniqueReasons=Array.from(new Set(reasons));
  let score=0;
  uniqueReasons.forEach(reason=>{
    if(reason==='asn'||reason==='forwarded') score+=3;
    else if(reason==='timezone') score+=1.5;
    else if(reason==='language') score+=1;
  });
  const connectionType=String(raw?.connection?.type||'').toLowerCase();
  const asType=String(raw?.asn?.type||'').toLowerCase();
  const looksResidential=[connectionType,asType].some(val=>val.includes('residential')||val.includes('consumer')||val.includes('isp')||val.includes('mobile')||val.includes('cellular'));
  let status='uncertain';
  if(score>=3){
    status='likely';
  }else if(score>=2.5){
    status='likely';
  }else if(score===0 && (details.timezone||details.country_name)){
    status='unlikely';
  }else if(looksResidential && score<2){
    status='unlikely';
  }
  return {status,reasons:uniqueReasons,checked:true};
}
async function runSpeedTest(){
  const BYTES=2000000;
  async function measure(url,timeout=10000){
    const cacheBust=Date.now();
    const target=url.includes('?')?`${url}&cacheBust=${cacheBust}`:`${url}?cacheBust=${cacheBust}`;
    const start=performance.now();
    const resp=await fetchWithTimeout(target,{timeout,mode:'cors',cache:'no-store',credentials:'omit'});
    let bytes=0;
    if(resp.body?.getReader){
      const reader=resp.body.getReader();
      while(true){
        const {done,value}=await reader.read();
        if(done) break;
        if(value) bytes+=value.byteLength;
      }
    }else{
      const buf=await resp.arrayBuffer();
      bytes=buf.byteLength;
    }
    if(bytes===0){
      const hint=parseInt(resp.headers.get('content-length')||'0',10);
      if(hint>0) bytes=hint;
    }
    if(bytes===0) bytes=BYTES;
    const duration=Math.max((performance.now()-start)/1000,0.001);
    const mbps=Number(((bytes*8)/(duration*1e6)).toFixed(2));
    const latency=Math.max(1,Math.round(duration*1000));
    return {mbps,latency,note:null};
  }

  const attempts=[
    {url:`https://speed.cloudflare.com/__down?bytes=${BYTES}`,timeout:12000},
    {url:`https://httpbin.org/bytes/${BYTES}`,timeout:12000}
  ];
  const errors=[];
  for(const attempt of attempts){
    try{
      return await measure(attempt.url,attempt.timeout);
    }catch(err){
      errors.push(err.message||String(err));
    }
  }
  const conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  if(conn?.downlink){
    const downlink=Number(conn.downlink||0);
    if(downlink>0){
      const latency=Math.max(1,Math.round(conn.rtt||100));
      return {mbps:Number(downlink.toFixed(2)),latency,note:'approx'};
    }
  }
  const e=new Error(errors.join('; '));
  e.attempts=errors;
  throw e;
}

async function detectIpAndSpeed(){
  if(state.fetchingIp) return;
  state.fetchingIp=true;
  state.ipError=null;
  state.speed={status:'running',mbps:null,latency:null,error:null,note:null};
  state.vpn={status:'uncertain',reasons:[],checked:false};
  render(currentLang);
  try{
    const data=await fetchIpData();
    if(!data || typeof data!=='object') throw new Error('empty');
    state.serverData=data;
    state.vpn=evaluateVpnState(data);
    render(currentLang);
  }catch(e){
    const noDataMsg=(I18N[currentLang]?.ip?.noData)||'No data';
    let msg;
    if(e.message==='timeout'){
      msg=timeoutMessages[currentLang]||timeoutMessages.ru;
    }else if(e.message==='empty'){
      msg=noDataMsg;
    }else if(e.attempts){
      const base=(I18N[currentLang]?.ip?.allFailed)||'All services failed';
      msg=`${base}. ${e.attempts.filter(Boolean).join(' • ')}`;
    }else{
      msg=e.message||String(e);
    }
    state.ipError=msg;
    state.serverData=null;
    state.speed={status:'idle',mbps:null,latency:null,error:null,note:null};
    state.vpn={status:'uncertain',reasons:[],checked:false};
    state.fetchingIp=false;
    invalidateSnapshot();
    render(currentLang);
    return;
  }
  try{
    const speed=await runSpeedTest();
    state.speed={status:'done',mbps:speed.mbps,latency:speed.latency,error:null,note:speed.note||null};
    state.vpn=evaluateVpnState(state.serverData);
  }catch(e){
    const message=(e.message||String(e));
    const lowered=message.toLowerCase();
    let friendly=message;
    if(e.attempts?.length){
      const base=(I18N[currentLang]?.speed?.allFailed)||(I18N.en?.speed?.allFailed)||message;
      friendly=`${base}. ${e.attempts.filter(Boolean).join(' • ')}`;
    }else if(lowered.includes('timeout')){
      friendly=timeoutMessages[currentLang]||timeoutMessages.ru;
    }else if(lowered.includes('failed to fetch')){
      friendly=speedFetchMessages[currentLang]||speedFetchMessages.en;
    }
    state.speed={status:'error',mbps:null,latency:null,error:friendly,note:null};
    state.vpn=evaluateVpnState(state.serverData);
  }
  state.fetchingIp=false;
  invalidateSnapshot();
  render(currentLang);
}

function createCard(key,value,t){
  const info=CARD_CONTENT[key];
  const card=document.createElement('div');
  card.className='card';
  const title=document.createElement('div');
  title.className='title';
  title.innerHTML=`<span class="dot ${info.risk}"></span> ${info.label[currentLang]}`;
  card.appendChild(title);
  const valueEl=document.createElement('div');
  valueEl.className='val';
  valueEl.textContent=value??'—';
  card.appendChild(valueEl);
  const useEl=document.createElement('div');
  useEl.className='line hint small';
  useEl.textContent=info.use[currentLang];
  card.appendChild(useEl);
  const exampleEl=document.createElement('div');
  exampleEl.className='line small';
  exampleEl.textContent=`${t.examplePrefix} ${info.ex[currentLang]}`;
  card.appendChild(exampleEl);
  const advText=info.adv?.[currentLang];
  if(advText && advText.trim()){
    const advEl=document.createElement('div');
    advEl.className='line adv small';
    advEl.textContent=`${t.advicePrefix} ${advText}`;
    card.appendChild(advEl);
  }
  return {card,valueEl};
}

function addCard(frag,key,value,t){
  const {card}=createCard(key,value,t);
  frag.appendChild(card);
}

function addHashCard(frag,key,value,t){
  const {card,valueEl}=createCard(key,value||'—',t);
  if(value){
    valueEl.classList.add('mono','copyable');
    valueEl.title=t.copy.hint;
    valueEl.addEventListener('click',async()=>{
      try{
        await navigator.clipboard.writeText(value);
        valueEl.title=t.copy.done;
        setTimeout(()=>{valueEl.title=t.copy.hint;},1200);
      }catch(_){/* ignore */}
    });
  }
  frag.appendChild(card);
}

function updateIpSection(t){
  const el=getEl('ipInfo');
  if(state.fetchingIp && !state.serverData){
    el.textContent=t.ip.buttonLoading;
    return;
  }
  if(state.ipError){
    el.textContent=t.ip.error(state.ipError);
    return;
  }
  if(!state.serverData){
    el.textContent=t.ip.none;
    return;
  }
  const {ip,details,detailSource,source}=state.serverData;
  const fields=t.ip.fields||{};
  const rows=[`<div class="title">${t.ip.title}</div>`];
  const ipLabel=fields.ip||'IP';
  const ipValue=ip?String(ip):'—';
  rows.push(`<div><b>${escapeHtml(ipLabel)}:</b> ${escapeHtml(ipValue)}</div>`);
  if(details){
    DETAIL_FIELDS.forEach(key=>{
      const label=fields[key]||key;
      const rawValue=details[key];
      const value=(rawValue!=null && String(rawValue).trim())?String(rawValue):'—';
      rows.push(`<div><b>${escapeHtml(label)}:</b> ${escapeHtml(value)}</div>`);
    });
  }else{
    rows.push(`<div>${escapeHtml(t.ip.noDetails||'—')}</div>`);
  }
  const src=detailSource||source||null;
  if(src){
    rows.push(`<div class="small" style="margin-top:4px;color:var(--muted)">${t.ip.sourceLabel} ${escapeHtml(src)}</div>`);
  }
  el.innerHTML=rows.join('');
}

function formatSpeedSummary(t){
  const status=state.speed.status;
  if(status==='running') return t.speed.running;
  if(status==='done'){
    let text=t.speed.result(state.speed.mbps,state.speed.latency);
    if(state.speed.note && t.speed.notes?.[state.speed.note]){
      text+=` (${t.speed.notes[state.speed.note]})`;
    }
    return text;
  }
  if(status==='error') return t.speed.error(state.speed.error);
  return t.speed.idle||'';
}

function formatPermissionEntries(entries,t){
  return entries.map(([key,value])=>{
    const name=t.permNames?.[key]||key;
    const state=t.permStates?.[value]||t.permStates?.unknown||value;
    return `${name}: ${state}`;
  });
}

function formatMonitorText(info,t){
  if(!info||!info.mode) return t.monitorText?.unknown||'';
  if(info.mode==='multi'){
    const label=t.monitorText?.multi;
    const count=info.count||2;
    if(typeof label==='function') return label(count);
    return label||'';
  }
  if(info.mode==='single'){
    const label=t.monitorText?.single;
    if(typeof label==='function') return label(info.count||1);
    return label||'';
  }
  return t.monitorText?.unknown||'';
}

function updateSpeedSection(t){
  const el=getEl('speedResult');
  const summary=formatSpeedSummary(t);
  el.textContent=summary?`⚡ ${summary}`:'';
}

let currentLang='ru';
const cacheEls={};
const getEl=id=>cacheEls[id]||(cacheEls[id]=document.getElementById(id));
let renderToken=0;

async function render(lang){
  const token=++renderToken;
  currentLang=(lang in I18N)?lang:'ru';
  const t=I18N[currentLang];
  document.documentElement.lang=currentLang;
  const langSelect=getEl('lang');
  Array.from(langSelect.options).forEach(opt=>{if(I18N[opt.value]) opt.textContent=I18N[opt.value].langOption;});
  langSelect.value=currentLang;
  getEl('introTitle').textContent=t.introTitle;
  getEl('introText').textContent=t.introText;
  getEl('legend').innerHTML=`<span>${t.legendTitle}</span>
    <span class="chip"><span class="dot low"></span>${t.risk.low}</span>
    <span class="chip"><span class="dot med"></span>${t.risk.med}</span>
    <span class="chip"><span class="dot high"></span>${t.risk.high}</span>`;
  getEl('detailTitle').textContent=t.detailTitle;
  getEl('shockTitle').textContent=t.shockTitle;
  getEl('methodSummary').innerHTML=t.methodSummary;
  getEl('methodText').innerHTML=t.methodText;
  getEl('policySummary').innerHTML=t.policySummary;
  getEl('policyText').innerHTML=t.policyText;
  getEl('footerText').textContent=typeof t.footer==='function'?t.footer(VERSION,VERSION_SCHEME):t.footer;
  getEl('printBtn').textContent=t.saveButton;
  const ipBtn=getEl('ipBtn');
  ipBtn.textContent=state.fetchingIp?t.ip.buttonLoading:t.ip.button;
  ipBtn.disabled=state.fetchingIp;
  updateIpSection(t);
  updateSpeedSection(t);

  try{
    const {basic,fp,H,pct}=await getSnapshot();
    if(token!==renderToken) return;

    const cls=uniqClass(pct);
    const uniqCopy=t.uniqMeaning(pct);
    const uniqNote=`${uniqCopy.note} · H=${H.toFixed(1)} ${t.entropyUnit}`;
    getEl('uniqLine').innerHTML=`<span class="dot ${cls}"></span><span>${uniqCopy.headline}</span><span class="uniq-note">${uniqNote}</span>`;

    const s=basic.screen;
    const screenStr=`${s.w}×${s.h}@${s.pixelRatio}`;
    const osVer=guessOSVersion(basic);
    const device=guessDevice(basic);
    const chip=basic.gl&&basic.gl.renderer?guessAppleChip(basic.gl.renderer):null;
    const geo=extractGeo(basic.server?.headers||{});
    const city=geo.city?(geo.country?`${geo.city}, ${geo.country}`:geo.city):null;
    const tzCity=tzCityName(basic.timezone||LOCAL_TZ||'');
    const browserGuess=probableBrowsers(basic);
    const permEntries=Object.entries(basic.perms||{});
    const formattedPerms=formatPermissionEntries(permEntries,t);
    const permSample=formattedPerms.length?formattedPerms.slice(0,3).join(', '):(t.permStates?.unknown||'—');
    const monitorLabel=formatMonitorText(basic.screen?.monitors,t);

    const bullets=[
      city?t.shock.region(city):t.shock.tzFallback(tzCity),
      t.shock.device(device,osVer),
      chip?t.shock.gpuKnown(chip):t.shock.gpuUnknown,
      (basic.hashes.canvas&&basic.hashes.audio)?t.shock.canvasActive:t.shock.canvasPassive,
      t.shock.browser(browserGuess),
      t.shock.screen(screenStr,basic.screen.colorDepth,monitorLabel),
      t.shock.perms(permSample)
    ];
    const vpnState=state.vpn||{status:'uncertain',reasons:[]};
    const vpnStatusLabel=(t.vpn?.statuses?.[vpnState.status])||(t.vpn?.statuses?.uncertain)||'';
    const vpnReasons=(vpnState.reasons||[]).map(reason=>t.vpn?.reasons?.[reason]).filter(Boolean).join('; ');
    bullets.push(t.shock.vpn(vpnStatusLabel,vpnReasons));
    const speedSummary=formatSpeedSummary(t);
    if(speedSummary && state.speed.status!=='idle'){
      bullets.push(t.shock.speed(speedSummary));
    }
    const shock=getEl('shock');
    const ul=getEl('shockList');
    ul.innerHTML='';
    bullets.forEach(text=>{const li=document.createElement('li');li.innerHTML=text;ul.appendChild(li);});
    shock.style.display=bullets.length?'block':'none';

    const cards=getEl('cards');
    cards.textContent='';
    const frag=document.createDocumentFragment();
    const tzForClock=basic.timezone||LOCAL_TZ||'UTC';
    const locale=currentLang==='en'?'en-US':(currentLang==='uz'?'uz-UZ':'ru-RU');
    const tzStr=`${basic.timezone||'—'} (${utcOffsetStr(-basic.tzOffsetMinutes)}) • ${timeInTZ(tzForClock,locale)}`;
    const yesNo=value=>value?t.units.yes:t.units.no;
    const storeLabels=t.labels.storage;
    const memParts=[];
    if(basic.hw.deviceMemory){memParts.push(`≈${basic.hw.deviceMemory} ${t.units.gb}`);}
    if(basic.hw.memoryLimitGb && (!basic.hw.deviceMemory || Math.abs(basic.hw.memoryLimitGb-basic.hw.deviceMemory)>1)){memParts.push(`heap ≤${basic.hw.memoryLimitGb} ${t.units.gb}`);}
    const memText=memParts.length?memParts.join(' / '):'—';
    const hwVal=`${basic.hw.hardwareConcurrency||'?'} ${t.units.cores} • ${memText}${memParts.length?` (${t.memoryNote||''})`:''}`.trim();
    const touchVal=`${basic.touch.maxTouchPoints} ${t.labels.touchPoints} • ${t.labels.pointer}: ${basic.pointer}`;
    const netVal=basic.net&&Object.keys(basic.net).length?`${basic.net.effectiveType||'—'} • ${basic.net.downlink??'?'} ${t.units.mbps} • ${t.labels.latency} ${basic.net.rtt??'?'} ${t.units.ms}`:'—';
    const storeVal=`${storeLabels.local}:${yesNo(basic.storage.local)} • ${storeLabels.session}:${yesNo(basic.storage.session)} • ${storeLabels.idb}:${yesNo(basic.storage.indexedDB)} • ${storeLabels.cookies}:${yesNo(!!basic.cookiesEnabled)}`;
    const permVal=formattedPerms.length?formattedPerms.join(' • '):(t.permStates?.unknown||'—');
    const pluginsVal=basic.plugins?.length?String(basic.plugins.length):'0';
    const mediaVal=basic.media?.length?basic.media.map(m=>`${m.kind}:${m.label?t.units.yes:t.units.no}`).join(' • '):'—';
    const batteryVal=basic.battery&&basic.battery.level!=null?`${Math.round(basic.battery.level*100)}% ${basic.battery.charging?'⚡':''}`:'—';

    addCard(frag,'tz',tzStr,t);
    addCard(frag,'ua',basic.userAgent,t);
    addCard(frag,'plat',`${basic.uaPlatform||basic.platform||'—'} ${basic.uaMobile?'(mobile)':''}`.trim(),t);
    const screenDetails=[`${screenStr}`,`${basic.screen.colorDepth}-bit`,monitorLabel].filter(Boolean).join(' • ');
    addCard(frag,'screen',screenDetails,t);
    addCard(frag,'langs',(basic.languages||[]).join(', ')||'—',t);
    addCard(frag,'hw',hwVal,t);
    addCard(frag,'store',storeVal,t);
    addCard(frag,'dnt', basic.dnt!=null?String(basic.dnt):'—',t);
    addCard(frag,'touch',touchVal,t);
    addCard(frag,'net',netVal,t);
    addCard(frag,'gl',basic.gl&&(basic.gl.vendor||basic.gl.renderer)?`${basic.gl.vendor} / ${basic.gl.renderer}`:'—',t);
    addHashCard(frag,'canvas',basic.hashes.canvas,t);
    addHashCard(frag,'audio',basic.hashes.audio,t);
    addCard(frag,'perm',permVal,t);
    addCard(frag,'plugins',pluginsVal,t);
    addCard(frag,'media',mediaVal,t);
    addCard(frag,'bat',batteryVal,t);

    let filled=0,total=0;
    (function walk(o){
      for(const k in o){
        total++;
        const v=o[k];
        if(v==null) continue;
        if(typeof v==='string'){if(v.length)filled++;}
        else if(typeof v==='number'&&!Number.isNaN(v))filled++;
        else if(typeof v==='boolean')filled++;
        else if(typeof v==='object'){
          if(Array.isArray(v)){if(v.length)filled++;}
          else walk(v);
        }
      }
    })(basic);
    addCard(frag,'fullness',t.formatFullness(filled,total),t);
    addHashCard(frag,'fp',fp,t);
    cards.appendChild(frag);
  }catch(e){
    if(token!==renderToken)return;
    console.error(e);
    alert(t.errorMessage(e.message||String(e)));
  }
}

function detectLang(){
  try{
    const saved=localStorage.getItem('fp_lang');
    if(saved&&I18N[saved])return saved;
    const n=navigator.language||'ru';
    if(n.startsWith('ru'))return'ru';
    if(n.startsWith('en'))return'en';
    if(n.startsWith('uz'))return'uz';
    return'ru';
  }catch(_){return'ru';}
}

async function handleSaveClick(){
  const filename=`fingerprint-${new Date().toISOString().slice(0,10)}.html`;
  const html=document.documentElement.outerHTML;
  const blob=new Blob([html],{type:'text/html'});
  if(IS_IOS && typeof navigator.share==='function'){
    try{
      const fileType={type:'text/html'};
      const file=typeof File==='function'?new File([blob],filename,fileType):null;
      const payload=file?{files:[file],title:'Fingerprint snapshot'}:{title:'Fingerprint snapshot',text:html};
      let canShare=true;
      if(typeof navigator.canShare==='function'){
        try{
          canShare=navigator.canShare(payload);
        }catch(_){
          canShare=false;
        }
      }
      if(canShare){
        await navigator.share(payload);
        return;
      }
    }catch(_){/* fallback to download */}
  }else if(typeof window.print==='function'){
    try{
      window.print();
      return;
    }catch(_){/* fallback */}
  }
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.download=filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

document.addEventListener('DOMContentLoaded',()=>{
  const sel=getEl('lang');
  const lang=detectLang();
  sel.value=lang;
  getEl('printBtn').addEventListener('click',()=>{handleSaveClick().catch(()=>{});});
  getEl('ipBtn').addEventListener('click',detectIpAndSpeed);
  sel.addEventListener('change',()=>{
    const l=sel.value;
    try{localStorage.setItem('fp_lang',l);}catch(_){/* ignore */}
    render(l);
  });
  render(lang);
});
