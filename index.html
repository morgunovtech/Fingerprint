  <style>
    :root{
      color-scheme: light dark;
      --bg:#FAFAFA; --card:#FFFFFF; --text:#111827; --muted:#6B7280; --border:#E5E7EB;
      --r:14px; --shadow:0 4px 6px rgba(0,0,0,0.07);
      --accent:#EF4444;
      --text-secondary:#6B7280; --text-muted:#9CA3AF;
      --bg-raised:#F3F4F6; --code-bg:#F3F4F6;
      --success:#22C55E; --success-bg:#F0FDF4;
      --warning:#F59E0B; --warning-bg:#FFFBEB;
      --danger:#EF4444; --danger-bg:#FEF2F2;
      --border-subtle:#F3F4F6;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.05);
      --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
      --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    }
    :root.force-dark{
      --bg:#0F172A; --card:#1E293B; --text:#F1F5F9; --muted:#94A3B8; --border:#334155;
      --shadow:0 4px 6px rgba(0,0,0,0.3); --accent:#F87171;
      --text-secondary:#94A3B8; --text-muted:#64748B;
      --bg-raised:#334155; --code-bg:#334155;
      --success:#4ADE80; --success-bg:rgba(34,197,94,.1);
      --warning:#FBBF24; --warning-bg:rgba(245,158,11,.1);
      --danger:#F87171; --danger-bg:rgba(239,68,68,.1);
      --border-subtle:#1E293B;
    }
    :root.force-light{ --bg:#FAFAFA; --card:#FFFFFF; --text:#111827; --muted:#6B7280; --border:#E5E7EB; --shadow:0 4px 6px rgba(0,0,0,0.07); --accent:#EF4444;
      --text-secondary:#6B7280; --text-muted:#9CA3AF; --bg-raised:#F3F4F6; --code-bg:#F3F4F6;
      --success:#22C55E; --success-bg:#F0FDF4; --warning:#F59E0B; --warning-bg:#FFFBEB; --danger:#EF4444; --danger-bg:#FEF2F2; --border-subtle:#F3F4F6;
    }
    :root.force-contrast{
      --bg:#000; --card:#0d0d0d; --text:#fff; --muted:#ccc; --border:#fff;
      --shadow:0 0 0 2px #fff; --accent:#ffff00;
      --text-secondary:#ccc; --text-muted:#999;
      --bg-raised:#1a1a1a; --code-bg:#1a1a1a;
      --success:#00ff00; --warning:#ffff00; --danger:#ff0000;
      --border-subtle:#333;
    }
    @media (prefers-color-scheme: dark){
      :root:not(.force-dark):not(.force-light):not(.force-contrast){
        --bg:#0F172A; --card:#1E293B; --text:#F1F5F9; --muted:#94A3B8; --border:#334155;
        --shadow:0 4px 6px rgba(0,0,0,0.3); --accent:#F87171;
        --text-secondary:#94A3B8; --text-muted:#64748B;
        --bg-raised:#334155; --code-bg:#334155;
        --success:#4ADE80; --success-bg:rgba(34,197,94,.1);
        --warning:#FBBF24; --warning-bg:rgba(245,158,11,.1);
        --danger:#F87171; --danger-bg:rgba(239,68,68,.1);
        --border-subtle:#1E293B;
      }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);
         font:15px/1.65 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Helvetica,Arial;
         -webkit-font-smoothing:antialiased}
    .wrap{max-width:760px;margin:24px auto 72px;padding:0 24px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    header{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
    h1{font-size:22px;margin:0}
    .sub{color:var(--muted);font-size:14px}
    .toolbar{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
    .menu{position:relative}
    .menu button{white-space:nowrap}
    .menu-panel{position:absolute;right:0;top:calc(100% + 6px);display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--card);box-shadow:var(--shadow);min-width:120px;z-index:10}
    .menu-panel[hidden]{display:none!important}
    .menu-panel button{border:1px solid var(--border);background:transparent;color:var(--text);padding:6px 10px;border-radius:8px;font:inherit;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px}
    .menu-panel button:hover{background-color:rgba(96,165,250,0.12);border-color:var(--accent);color:var(--accent)}
    .menu-panel button.active{border-color:var(--accent);color:var(--accent);background-color:rgba(96,165,250,0.12)}
    .menu-panel button .menu-icon{font-size:16px}
    .block{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:16px 0}
    .section-title{font-weight:700;font-size:18px;margin:0 0 8px}
    .intro-content--rich{display:block}
    .intro-content--rich .fp-section{margin:0;padding:0;color:var(--text)}
    .intro-content--rich .fp-section h2{margin:0 0 8px;font-size:18px;font-weight:700;color:var(--text)}
    .intro-content--rich .fp-section h3{margin:14px 0 6px;font-size:15px;font-weight:600;color:var(--muted)}
    .intro-content--rich .fp-section p{margin:6px 0;line-height:1.65;color:var(--text)}
    .intro-content--rich .fp-section ul{margin:6px 0 0 18px;padding:0;color:var(--text)}
    .intro-content--rich .fp-section li{margin:4px 0;line-height:1.55}
    .intro-content--rich .fp-section abbr[title]{text-decoration:underline dotted;cursor:help}
    .section-subtitle{font-weight:600;margin:12px 0 6px}
    .big{font-weight:700;font-size:21px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
    .big[data-level="high"]{color:var(--danger)}
    .big[data-level="med"]{color:var(--warning)}
    .big[data-level="low"]{color:var(--text)}
    .big .code-pill{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(148,163,184,.15);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:1.05em;line-height:1.35;color:var(--text);text-align:center;text-wrap:balance;white-space:normal;box-shadow:inset 0 0 0 1px rgba(148,163,184,.16)}
    .big[data-level="high"] .code-pill{border-color:#ef4444;background:rgba(239,68,68,.18);box-shadow:inset 0 0 0 1px rgba(239,68,68,.28);color:var(--text)}
    .big[data-level="med"] .code-pill{border-color:#f59e0b;background:rgba(245,158,11,.2);box-shadow:inset 0 0 0 1px rgba(245,158,11,.28);color:var(--text)}
    .big[data-level="low"] .code-pill{border-color:var(--border);background:rgba(148,163,184,.16);box-shadow:inset 0 0 0 1px rgba(148,163,184,.2)}
    .uniq-note{font-size:14px;color:var(--muted);line-height:1.5;display:block;margin:0;grid-column:1/-1;max-width:720px}
    #introText p{margin:6px 0}
    #introText p:first-child{margin-top:0}
    #introText p:last-child{margin-bottom:0}
    #uniqAdviceTitle{margin-top:10px;font-weight:600}
    .advice-list{list-style:disc;margin:6px 0 0 18px;padding:0}
    .advice-list li{margin:4px 0;padding-left:4px}
    .advice-list.emoji-list{list-style:none;margin-left:0;padding-left:0}
    .shock-insights{list-style:none;margin:0;padding:0}
    .shock-insights li{padding:10px 0;font-size:15px;line-height:1.55;border-bottom:1px solid rgba(148,163,184,.1);display:flex;align-items:baseline;gap:8px}
    .shock-insights li:last-child{border-bottom:none}
    .shock-insights code{display:inline;padding:2px 8px;border-radius:6px;background:rgba(148,163,184,.12);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px;letter-spacing:.3px}
    .section-heading{font-size:22px;font-weight:700;margin:0 0 16px;color:var(--text)}
    .pill{display:inline-flex;align-items:center;padding:0 6px;border-radius:6px;border:1px solid var(--border);background:rgba(12,18,28,.08);font-weight:600;font-size:.95em;margin:0 2px}
    .danger{margin:8px 0 0; padding:10px 12px; border:1px solid #ef4444; border-radius:10px; background:rgba(239,68,68,.08);}
    .danger ul{margin:6px 0 0 18px; padding:0}
    .shock-footer{display:flex;justify-content:center;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(148,163,184,.1)}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
    .card{border:1px solid var(--border);border-radius:12px;padding:12px}
    .title{font-weight:700;margin-bottom:6px}
    .val{white-space:normal;word-break:break-word}
    .line{display:block;margin-top:4px}
    .hint{color:var(--text)}
    .adv{color:var(--muted)}
    .small{color:var(--muted);font-size:14px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:13px}
    .copyable{cursor:pointer}
    @media (max-width:920px){ .cards{grid-template-columns:1fr} }
    a{color:var(--accent);text-decoration:none}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{display:inline-flex;justify-content:center;align-items:center;border:1px solid var(--border);background:transparent;color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;transition:background-color .2s,border-color .2s,color .2s,text-decoration-color .2s;text-align:center;gap:6px}
    .btn-inline{padding:6px 12px;font-size:13px;border-radius:8px;margin-left:8px}
    .btn .btn-text{display:inline-flex;align-items:center}
    .btn:hover{background-color:rgba(96,165,250,0.12);border-color:var(--accent);color:var(--accent)}
    .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
    .btn-primary{background:var(--accent);color:#fff;border:none;font-weight:600;padding:12px 24px;border-radius:var(--radius-md);font-size:15px;box-shadow:0 8px 24px rgba(239,68,68,.2);min-height:44px}
    .btn-primary:hover{background:var(--accent);filter:brightness(.9);color:#fff;box-shadow:0 12px 32px rgba(239,68,68,.3)}
    .btn-primary:disabled{box-shadow:none;filter:none}
    .btn-primary[aria-disabled="true"]{box-shadow:none;filter:none}
    #uniqLine{text-align:left;margin:24px 0 8px;font-size:24px;font-weight:800;letter-spacing:-.5px}
    #uniqLine .code-pill{display:block;padding:16px 24px;border-radius:14px;font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.3;text-wrap:balance}
    #shockList{margin:6px 0 0;padding:0}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .skeleton{background:linear-gradient(90deg,var(--bg-raised) 25%,var(--border-subtle) 50%,var(--bg-raised) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:1em;margin:6px 0}
    .skeleton-hero{height:56px;width:120px;margin-bottom:8px}
    .skeleton-line{height:14px;width:80%;margin:8px 0}
    @keyframes shockFadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .shock-animate{animation:shockFadeIn .4s ease-out}
    details{margin-top:8px}
    @media (max-width:720px){
      h1{font-size:20px}
      .wrap{padding:0 16px}
      .block{padding:16px}
      .big{font-size:19px;grid-template-columns:min-content 1fr}
      header{align-items:flex-start}
      .toolbar{margin-left:0}
    }
    @media (max-width:520px){
      body{font-size:14px}
      .big{gap:6px}
      .btn{width:100%;justify-content:center}
      .shock-footer{flex-direction:column}
    }
    .implications-block .section{margin-bottom:24px}
    .implications-block .section-title{font-size:18px;font-weight:700;margin-bottom:12px}
    .implications-block .body-text{line-height:1.7;color:var(--text)}
    .implications-block .body-text p{margin:0 0 12px}
    .risk-cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:640px){.risk-cards-grid{grid-template-columns:1fr}}
    .risk-card{padding:16px;border-radius:10px;border:1px solid var(--border);background:var(--card)}
    .risk-card .risk-icon{font-size:24px;margin-bottom:6px}
    .risk-card .risk-title{font-weight:700;margin-bottom:6px}
    .risk-card .risk-body{font-size:14px;line-height:1.6;color:var(--muted)}
    .rec-section-title{font-size:16px;font-weight:600;margin:16px 0 10px}
    .rec-card{padding:0;border-radius:var(--radius-md,10px);border:1px solid var(--border);background:var(--card);margin-bottom:12px;border-left:3px solid var(--border);overflow:hidden}
    .rec-overflow-wrap{margin-top:4px}
    .rec-card--green{border-left-color:#22c55e}
    .rec-card--yellow{border-left-color:#eab308}
    .rec-card--red{border-left-color:#ef4444}
    .rec-card--personal{border-left-color:var(--accent,#ef4444)}
    .rec-zone-top{padding:16px 16px 0}
    .rec-zone-why{padding:4px 16px 12px;font-size:14px;color:var(--text-secondary,var(--muted));line-height:1.5}
    .rec-zone-action{padding:12px 16px;background:var(--bg-raised,#F3F4F6);border-top:1px solid var(--border-subtle,var(--border))}
    .rec-zone-action .rec-action{font-size:14px;line-height:1.5}
    .rec-zone-action .rec-action a{color:var(--accent)}
    .rec-zone-action .rec-detail{font-size:13px;color:var(--text-muted,var(--muted));font-family:var(--font-mono,monospace);margin-top:2px}
    .rec-zone-action .rec-note{font-size:13px;color:var(--success,#22c55e);margin-top:4px}
    .rec-zone-action .rec-alt{font-size:13px;color:var(--text-muted,var(--muted));margin-top:8px;font-style:italic}
    .rec-header{display:flex;align-items:center;gap:8px}
    .rec-title{font-weight:700;font-size:16px}
    .rec-level{font-size:11px;padding:2px 6px;border-radius:4px;margin-left:auto;white-space:nowrap}
    .hero-verdict{text-align:left;padding:16px 8px 8px;margin-bottom:16px}
    .hero-top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
    .hero-top-row .btn-link{font-size:14px;white-space:nowrap}
    .hero-number{font-size:56px;font-weight:800;line-height:1;letter-spacing:-2px}
    .hero-number[data-level="high"]{color:var(--danger)}
    .hero-number[data-level="med"]{color:var(--warning)}
    .hero-number[data-level="low"]{color:var(--success)}
    .hero-subtitle{font-size:18px;font-weight:600;margin-bottom:4px;color:var(--text)}
    .hero-conclusion{background:var(--bg-raised,#F3F4F6);border-radius:var(--radius-md,10px);padding:16px 20px;font-size:15px;line-height:1.6;color:var(--text);margin:12px 0 16px}
    .hero-actions{display:flex;gap:12px;justify-content:flex-start}
    @media(max-width:640px){
      .hero-number{font-size:40px}
      .hero-subtitle{font-size:16px}
      .hero-actions{flex-direction:column;align-items:stretch}
    }
    /* === Global: prevent overflow in flex/grid children === */
    .data-group,.data-row,.tracker-row,.rec-card,.risk-card,.card{min-width:0;overflow:hidden}
    .status-badge,.tracker-badge{white-space:nowrap;max-width:100%;text-overflow:ellipsis}

    /* === Data cards grid (IDENTIFICATION / DEVICE / NETWORK) === */
    .data-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
    @media(max-width:920px){.data-groups{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:640px){.data-groups{grid-template-columns:1fr}}
    .data-group{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;min-width:0;overflow:hidden}
    .data-group h3{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--border-subtle,var(--border));display:flex;align-items:center;gap:8px}
    .data-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;font-size:14px;border-bottom:1px solid var(--border-subtle)}
    .data-row:last-child{border-bottom:none}
    .data-row .data-icon{flex-shrink:0;color:var(--muted);width:18px;height:18px}
    .data-row .data-label{flex-shrink:0;color:var(--text-secondary);font-size:13px}
    .data-row .data-value{font-weight:500;color:var(--text);text-align:right;min-width:0;overflow-wrap:anywhere}
    .data-row code{font-family:var(--font-mono);font-size:12px;background:var(--code-bg);padding:1px 6px;border-radius:4px;word-break:break-all;display:inline-block;max-width:100%}
    .data-row--status{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0;font-size:14px;border-bottom:1px solid var(--border-subtle)}
    .data-row--status:last-child{border-bottom:none}
    @media(max-width:640px){
      .data-row{flex-direction:column;gap:2px}
      .data-row .data-value{text-align:left}
    }

    /* === Status badges === */
    .status-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
    .status-badge--safe{background:var(--success-bg);color:var(--success)}
    .status-badge--danger{background:var(--danger-bg);color:var(--danger)}
    .status-badge--warning{background:var(--warning-bg);color:var(--warning)}
    .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap}
    .tag--ok{background:var(--success-bg);color:var(--success)}
    .tag--warn{background:var(--warning-bg);color:var(--warning)}
    .tag--danger{background:var(--danger-bg);color:var(--danger)}
    #detailsAccordion[open] summary svg{transform:rotate(180deg)}
    #detailsAccordion summary{display:flex;align-items:center;padding:8px 0;font-size:18px;font-weight:700}
    #detailsAccordion summary::-webkit-details-marker{display:none}
    #detailsAccordion summary::marker{display:none;content:''}
    @media print{
      body{background:#fff!important;color:#111!important;font-size:13px}
      .wrap{max-width:100%;padding:0;margin:0}
      .block{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}
      .btn,.menu,.hero-actions,.shock-footer,.toolbar,.implications-block .rec-zone-action a,.skeleton{display:none!important}
      .hero-verdict{padding:8px 0}
      .hero-number{font-size:36px}
      .data-groups{grid-template-columns:1fr 1fr}
      details[open]>summary~*{display:block}
      details>summary{list-style:none;font-weight:700}
      .rec-card{break-inside:avoid;margin-bottom:8px}
      .rec-overflow-wrap{display:block}
      .rec-overflow-wrap>summary{display:none}
      .rec-overflow-wrap .rec-card{display:block}
      .risk-cards-grid{grid-template-columns:1fr 1fr}
      .tracker-row{padding:4px 0}
      .tracker-badge{width:auto}
      .data-row{flex-direction:row!important}
      .data-row .data-value{text-align:right!important}
      .methodology-modal{display:none!important}
      #changelogModal{display:none!important}
    }
    /* === Tracker protection rows === */
    .tracker-row{display:flex;align-items:flex-start;gap:16px;padding:12px 0;border-bottom:1px solid var(--border-subtle,var(--border));font-size:14px}

          const raw=String(finding.value||'');
          if(!raw) return raw;

          const raw=String(finding.value||'');

            const total=match[2].replace(/MB/g,'МБ');

          }
          return raw.replace(/Using/i,'Используется').replace(/MB/g,'МБ').replace(' of ',' из ');
        },

    introTitle:'”Digital fingerprint”: what websites know about you',
    introRichHtml:/* html */`
      <section class=”fp-section” lang=”en” aria-labelledby=”fp-title”>
        <p>
          Every browser leaves a unique trail — a set of technical characteristics
          that websites read silently, without asking and without your permission.
          This is called a digital fingerprint. This service shows what is visible about you
          right now and explains how to reduce the risks.
        </p>
        <details>
          <summary style=”cursor:pointer;color:var(--accent);font-weight:600;margin:8px 0”>More about tracking and risks ▾</summary>
          <h3>How tracking works without cookies</h3>
          <p>
            You visited dozens of websites without signing up — leaving the same fingerprint everywhere.
            Then you created an account on one of them. Now ad networks can link
            all your past visits to your name and sell that profile.
          </p>
          <h3>Why this is dangerous</h3>
          <ul class=”fp-list”>
            <li>Stores raise prices based on your device and perceived spending power.</li>
            <li>Scammers know your city, ISP, and device — phishing becomes more precise.</li>
            <li>Insurance companies and employers buy profiles from data brokers.</li>
            <li>Once a database leaks, the profile cannot be “deleted” — it is tied to you forever.</li>
          </ul>
          <h3>How we process data</h3>
          <p>
            All calculations happen only in your browser. We do not store or transmit anything.
            The service is completely free, ad-free, and requires no registration.
          </p>
        </details>
      </section>
    `,

      'All calculations happen only in your browser. We do not store or transmit anything. The service is completely free, ad-free, and requires no registration. On page load, the browser queries your IP data via ipapi.co (with fallbacks to freeipapi.com, ipify.org, or myip.com if unavailable). We display the full response in the interface. There are no other external requests — no third-party fonts, trackers, or hidden scripts.'

    uniqMeaning(pct,{level}={}){
      const lvl=level||(pct>=70?'high':pct>=40?'med':'low');
      const headline=lvl==='high'?'Your fingerprint stands out more than most users':lvl==='med'?'Your fingerprint is moderately distinctive':'Your fingerprint blends in with the crowd';
      const risks=this.uniqRisks?.[lvl]||[];
      const practicePoints=this.uniqPracticePoints||[];
      const levelLabel=this.uniqLevelLabels?.[lvl]||lvl;
      const effort=this.uniqEffort?.[lvl]||'';
      const detail=`Your current result is a ${levelLabel} uniqueness level: ${effort} ${this.uniqOutcomeTail}`.replace(/\s+/g,' ').trim();
      return {
        headline,
        warning:this.uniqWarning,
        practice:{title:this.uniqPracticeTitle,points:practicePoints},
        risks:{title:this.uniqRisksTitle,points:risks},
        outcome:{title:this.uniqOutcomeTitle,detail:detail}

          const map={'VPN/proxy likely':'VPN or proxy likely','VPN/proxy unlikely':'VPN or proxy unlikely','VPN status unclear':'Needs more data'};
          return map[finding.value]||finding.value;
        },
        'workspace.context':finding=>{
          const lower=String(finding.value||'').toLowerCase();
          if(lower.includes('office')) return 'Looks like a home or office setup (hypothesis)';
          if(lower.includes('portable')) return 'Looks like a portable device or public network (hypothesis)';
          return 'Environment unclear (hypothesis)';
        },
        'fingerprint.trackability':finding=>{
          if(String(finding.value||'').toLowerCase().includes('high')) return 'High trackability without cookies';
          if(String(finding.value||'').toLowerCase().includes('medium')) return 'Medium trackability without cookies';
          return 'Low trackability without cookies';
        },
        'privacy.local':()=> 'All computations stay inside your browser.',
        'privacy.permissions':()=> 'Advanced insights run only after you explicitly grant permission.',
        'browser.uaCh':finding=>finding.value,
        'network.profile':finding=>String(finding.value||'')
          .replace('wifi-like','Wi‑Fi-like')
          .replace('cellular-like','Cellular-like')
          .replace('unknown','network type unknown'),
        'fingerprint.fonts':finding=>{
          const raw=String(finding.value||'');
          if(raw.startsWith('Detected fonts:')) return raw;
          if(raw==='System fonts not observable') return 'System fonts could not be detected';
          return raw;
        },
        'privacy.cookies':finding=>{
          const raw=String(finding.value||'');
          if(raw==='Cookies enabled') return 'Cookies appear to be enabled';
          if(raw==='Cookies blocked or disabled') return 'Cookies seem blocked or disabled';
          return raw;
        },
        'privacy.supercookie':finding=>{
          const raw=String(finding.value||'');
          return raw
            .replace('Multiple supercookie surfaces available','Multiple storage surfaces available for supercookies')
            .replace('Single supercookie surface available','One storage surface available for supercookies')
            .replace('Supercookie surfaces blocked or unavailable','Supercookie storage appears blocked or unavailable');
        },
        'privacy.adblock':finding=>{
          const raw=String(finding.value||'');
          if(raw==='Ad blocker likely enabled') return 'Ad blocker likely detected';
          if(raw==='Ad blocker unlikely') return 'Ad blocker not detected';
          if(raw==='Ad blocker status unknown') return 'Ad blocker status could not be confirmed';
          return raw;
        },
        'network.webrtcLeak':finding=>{
          const raw=String(finding.value||'');
          return raw
            .replace('No local WebRTC addresses observed','No local WebRTC addresses were exposed')
            .replace('Local/WebRTC IP exposure detected (hypothesis)','Possible WebRTC IP exposure (hypothesis)');
        }

      const lvl=level||(pct>=70?'high':pct>=40?'med':'low');

      const risks=this.uniqRisks?.[lvl]||[];
      const practicePoints=this.uniqPracticePoints||[];
      const levelLabel=this.uniqLevelLabels?.[lvl]||lvl;
      const effort=this.uniqEffort?.[lvl]||'';
      const detail=`Hozirgi natija — ${levelLabel} noyoblik darajasi: ${effort} ${this.uniqOutcomeTail}`.replace(/\s+/g,' ').trim();
      return {
        headline,
        warning:this.uniqWarning,
        practice:{title:this.uniqPracticeTitle,points:practicePoints},
        risks:{title:this.uniqRisksTitle,points:risks},
        outcome:{title:this.uniqOutcomeTitle,detail:detail}
      };

      problemText:'<p>Har safar saytni ochganingizda, brauzer avtomatik ravishda o\u02BBnlab xususiyatlarni uzatadi \u2014 sizning ruxsatingizsiz va hech qanday oynalarsiz. Saytlar bu barmoq izini o\u02BBzlarida saqlamaydi \u2014 ular uni reklama tarmoqlariga uzatadi.</p><p>Reklama tarmog\u02BBi bir vaqtning o\u02BBzida millionlab saytlarda bo\u02BBlishi mumkin. Bu shuni anglatadiki, bitta ko\u02BBrinmas treker siz internetda qayerda bo\u02BBlsangiz, jimgina kuzatadi \u2014 va qiziqishlaringiz, xaridlaringiz, yo\u02BBllaringiz va odatlaringiz to\u02BBliq tarixini yig\u02BBadi.</p><p>Bu profil cookie fayllarini tozalaganingizda o\u02BBchirilmaydi. Inkognito rejimida yo\u02BBqolmaydi. Brauzeringiz va qurilmangiz mavjud ekan, u ham mavjud.</p>',

        {icon:'\uD83C\uDFAF',title:'Reklama siz haqingizda do\u02BBstlaringizdan ko\u02BBproq biladi',body:'Barmoq izingiz asosida reklama tizimlari qaysi saytlarga kirgansiz, nimani qidirganingiz, kechasi qachon uxlamaganingiz va qaysi mavzular sizni tashvishlantirishini biladi. Bu ma\u02BBlumotlar faqat reklama uchun emas \u2014 sug\u02BBurta kompaniyalari va ish beruvchilar ma\u02BBlumot brokerlaridan profillar sotib oladi.'},

        {icon:'\uD83D\uDD13',title:'Inkognito rejimi sizni himoya qilmaydi',body:'Ko\u02BBpchilik foydalanuvchilar inkognito = anonimlik deb hisoblaydi. Bu noto\u02BBg\u02BBri. Inkognito rejimi tarixni faqat qurilmangizdagi boshqa odamlardan yashiradi. Barmoq izingiz, IP va barcha signallar avvalgidek qoladi \u2014 saytlar sizni xuddi shunday ko\u02BBradi. Inkognito sessiya tugaganda tarix, cookie va keshni tozalaydi. Lekin raqamli barmoq izingizni yashirmaydi, trafikni shifrlamaydi, IP manzilni berkitmaydi.'},
        {icon:'\uD83D\uDDC2\uFE0F',title:'Profilingiz sizning xabaringizsiz mavjud',body:'Hozir ma\u02BBlumot brokerlari (Acxiom, Oracle Data Cloud, Nielsen va boshqalar) ma\u02BBlumotlar bazasida sizning qiziqishlaringiz, yo\u02BBllaringiz, xaridlaringiz va taxminiy daromadingiz bilan fayl mavjud. Siz bunga rozilik bermadingiz. Uni o\u02BBchira olmaysiz.'},

        },
        'vpn.probability':finding=>{
          const map={'VPN/proxy likely':'VPN yoki proksi ehtimoli yuqori','VPN/proxy unlikely':'VPN yoki proksi ehtimoli past','VPN status unclear':'Maʼlumot yetarli emas'};
          return map[finding.value]||finding.value;
        },
        'workspace.context':finding=>{
          const lower=String(finding.value||'').toLowerCase();
          if(lower.includes('office')) return 'Uy yoki ofisga o‘xshaydi (gipoteza)';
          if(lower.includes('portable')) return 'Ko‘chma qurilma yoki jamoat tarmog‘i (gipoteza)';
          return 'Muhit aniqlanmadi (gipoteza)';
        },
        'fingerprint.trackability':finding=>{
          if(String(finding.value||'').toLowerCase().includes('high')) return 'Kukisiz kuzatish oson';
          if(String(finding.value||'').toLowerCase().includes('medium')) return 'Kukisiz kuzatish o‘rtacha';
          return 'Kukisiz kuzatish qiyin';
        },
        'privacy.local':()=> 'Barcha hisob-kitoblar brauzeringizda bajariladi.',
        'privacy.permissions':()=> 'Qo‘shimcha signallar faqat siz ruxsat berganingizdan keyin olinadi.',
        'browser.uaCh':finding=>finding.value,
        'network.profile':finding=>String(finding.value||'')
          .replace('wifi-like','Wi‑Fi ga o‘xshaydi')
          .replace('cellular-like','Uyali tarmoqqa o‘xshaydi')
          .replace('unknown','tarmoq turi nomaʼlum'),
        'location.region':finding=>{
          const raw=String(finding.value||'');
          return raw
            .replace('Local time zone','Mahalliy vaqt mintaqasi')
            .replace('IP says','IP ko‘rsatmoqda')
            .replace('IP country','IP bo‘yicha davlat')
            .replace('Region unclear','Mintaqa nomaʼlum')
            .replace(' (local & IP agree)',' (mahalliy va IP mos keladi)');
        },
        'device.peripherals':finding=>{
          const raw=String(finding.value||'');
          if(!raw) return raw;
          if(raw.startsWith('Capabilities:')) return raw.replace('Capabilities:','Mavjud API:');
          if(raw==='No special peripheral APIs exposed') return 'Qo‘shimcha periferik API ko‘rinmayapti';
          return raw;
        },
        'storage.quota':finding=>{
          const raw=String(finding.value||'');
          if(!raw) return raw;
          const match=raw.match(/Using ([^ ]+ MB) of ([^ ]+ MB) \(([^)]+)\)/);
          if(match){
            return `${match[1]} dan ${match[2]} foydalanilmoqda (${match[3]})`;
          }
          return raw.replace(/Using/i,'Foydalanilmoqda').replace(' of ',' dan ');
        },
        'fingerprint.fonts':finding=>{
          const raw=String(finding.value||'');
          if(raw.startsWith('Detected fonts:')) return raw.replace('Detected fonts:','Aniqlangan shriftlar:');
          if(raw==='System fonts not observable') return 'Tizim shriftlari aniqlanmadi';
          return raw;
        },
        'privacy.cookies':finding=>{
          const raw=String(finding.value||'');
          if(raw==='Cookies enabled') return 'Cookie yoqilgan';
          if(raw==='Cookies blocked or disabled') return 'Cookie bloklangan yoki o‘chirilgan';
          return raw;
        },
        'privacy.supercookie':finding=>{
          const raw=String(finding.value||'');
          return raw
            .replace('Multiple supercookie surfaces available','Bir nechta supercookie xotiralari mavjud')
            .replace('Single supercookie surface available','Bitta supercookie xotirasi mavjud')
            .replace('Supercookie surfaces blocked or unavailable','Supercookie xotirasi yopilgan yoki mavjud emas');
        },
        'privacy.adblock':finding=>{
          const raw=String(finding.value||'');
          if(raw==='Ad blocker likely enabled') return 'Reklama bloklagichi ehtimol yoqilgan';
          if(raw==='Ad blocker unlikely') return 'Reklama bloklagichi aniqlanmadi';
          if(raw==='Ad blocker status unknown') return 'Reklama bloklagichi holati nomaʼlum';
          return raw;
        },
        'network.webrtcLeak':finding=>{
          const raw=String(finding.value||'');
          return raw
            .replace('No local WebRTC addresses observed','WebRTC mahalliy manzillari topilmadi')
            .replace('Local/WebRTC IP exposure detected (hypothesis)','WebRTC orqali IP sizishi mumkin (gipoteza)');
        }

function resolveCountryCode(details,raw,geo){
  const candidates=[
    details?.country_code, raw?.country_code, raw?.countryCode, raw?.country_code2,
    raw?.country_code_iso3166, raw?.country_code_iso3166_1_alpha_2, raw?.cc,
    geo?.country_code, geo?.countryCode
  ];
  for(const cand of candidates){
    const norm=normalizeCountryCodeValue(cand);
    if(norm) return norm;
  }
  const names=[details?.country_name, raw?.country_name, raw?.country, raw?.country_long, geo?.country];
  for(const name of names){
    if(!name) continue;
    const key=COUNTRY_NAME_TO_CODE[String(name).trim().toLowerCase()];
    if(key) return key;
  }
  return null;
}

}

function bucketFontsCount(n){if(n<=0)return'0';if(n<=5)return'1-5';if(n<=10)return'6-10';if(n<=15)return'11-15';if(n<=20)return'16-20';if(n<=25)return'21-25';if(n<=30)return'26-30';return'31+';}
function brandFromRenderer(r){
  r=(r||'').toLowerCase();
  if(r.includes('nvidia'))return'NVIDIA';
  if(r.includes('intel'))return'Intel';
  if(r.includes('amd')||r.includes('ati'))return'AMD';
  if(r.includes('apple'))return'Apple';
  return'__other';
}
function browserFamily(ua){
  if(/Edg\//.test(ua))return'Edge';
  if(/Firefox\//.test(ua))return'Firefox';
  if(/Safari\//.test(ua)&&!/Chrome\//.test(ua))return'Safari';
  if(/Chrome\//.test(ua))return'Chrome';
  return'__other';
}
function pFrom(table,key){
  const meta=FREQ_META[table];
  if(!meta)return 1;
  const {table:freq,total,size}=meta;
  const fallback=freq.__other??0;
  const value=Object.prototype.hasOwnProperty.call(freq,key)?freq[key]:fallback;
  return (value+ALPHA)/(total+ALPHA*size);
}
function entropyFromFeatures(f){
  // 17 stable browser-side signals only. No IP/speed/latency — those
  // arrive asynchronously and would cause the score to jump mid-session.
  let H=0;
  H += -Math.log2(pFrom('browser.family', f.browser));
  H += -Math.log2(pFrom('os.family', f.osFamily));
  H += -Math.log2(pFrom('screen', f.screen));
  H += -Math.log2(pFrom('dpr', f.dpr));
  H += -Math.log2(pFrom('langs.count', f.langsCount));
  H += -Math.log2(pFrom('gpu.brand', f.gpuBrand));
  H += -Math.log2(pFrom('memory.bucket', f.memoryBucket));
  H += -Math.log2(pFrom('cores.bucket', f.coresBucket));
  H += -Math.log2(pFrom('has.canvas', f.hasCanvas));
  H += -Math.log2(pFrom('has.audio', f.hasAudio));
  H += -Math.log2(pFrom('plugins.bucket', f.pluginsBucket));
  H += -Math.log2(pFrom('perm.bucket', f.permBucket));
  H += -Math.log2(pFrom('storage.bucket', f.storageBucket));
  H += -Math.log2(pFrom('touch.bucket', f.touchBucket));
  H += -Math.log2(pFrom('webgl.renderer', f.webglRenderer));
  H += -Math.log2(pFrom('audio.hash', f.audioHash));
  H += -Math.log2(pFrom('fonts.bucket', f.fontsBucket));
  // Correlation corrections
  if(f.browser==='Safari' && f.gpuBrand==='Apple') H -= 1.0;
  if(f.browser==='Safari' && f.osFamily!=='macOS' && f.osFamily!=='iOS') H -= 0.5;
  if((f.dpr==='2'||f.dpr==='3') && f.screen.endsWith('@'+f.dpr)) H -= 0.5;
  if(f.osFamily==='Android' && f.touchBucket==='none') H -= 0.5;
  if(f.gpuBrand && f.webglRenderer && f.webglRenderer!=='__other' && f.gpuBrand===((f.webglRenderer||'').split('/')[0]||'').trim()) H -= 0.5;
  return Math.max(0,H);
}
// Deterministic PRNG (mulberry32) — fixed seed ensures identical distribution every run
function mulberry32(seed){let t=seed|0;return function(){t=t+0x6D2B79F5|0;let x=Math.imul(t^(t>>>15),1|t);x^=x+Math.imul(x^(x>>>7),61|x);return((x^(x>>>14))>>>0)/4294967296;};}
let _seededRandom=null;
function sampleFromTable(table){
  const sampler=FREQ_SAMPLERS[table];
  if(!sampler) return'__other';
  const rng=_seededRandom||Math.random;
  const target=rng()*sampler.total;
  for(const entry of sampler.cdf){
    if(target<=entry.threshold) return entry.key;
  }
  return sampler.cdf[sampler.cdf.length-1]?.key||'__other';
}
function buildEntropyDistribution(samples=25000){
  _seededRandom=mulberry32(42);
  const dist=[];
  for(let i=0;i<samples;i++){
    const f={
      browser:sampleFromTable('browser.family'),
      osFamily:sampleFromTable('os.family'),
      screen:sampleFromTable('screen'),
      dpr:sampleFromTable('dpr'),
      langsCount:sampleFromTable('langs.count'),
      gpuBrand:sampleFromTable('gpu.brand'),
      memoryBucket:sampleFromTable('memory.bucket'),
      coresBucket:sampleFromTable('cores.bucket'),
      hasCanvas:sampleFromTable('has.canvas'),
      hasAudio:sampleFromTable('has.audio'),
      pluginsBucket:sampleFromTable('plugins.bucket'),
      permBucket:sampleFromTable('perm.bucket'),
      storageBucket:sampleFromTable('storage.bucket'),
      touchBucket:sampleFromTable('touch.bucket'),
      webglRenderer:sampleFromTable('webgl.renderer'),
      audioHash:sampleFromTable('audio.hash'),
      fontsBucket:sampleFromTable('fonts.bucket')
    };
    dist.push(entropyFromFeatures(f));
  }
  dist.sort((a,b)=>a-b);
  _seededRandom=null;
  return dist;
}
let H_DISTRIBUTION = null;
function ensureDistribution(){
  if(!H_DISTRIBUTION) H_DISTRIBUTION=buildEntropyDistribution();
  return H_DISTRIBUTION;
}
function percentileFromH(H){
  const dist=ensureDistribution();
  if(!Array.isArray(dist)||!dist.length)return 100;
  let lo=0,hi=dist.length;
  while(lo<hi){
    const mid=(lo+hi)>>>1;
    if(dist[mid]<=H) lo=mid+1; else hi=mid;
  }
  const percentile=lo/dist.length;
  return Math.min(100,Math.max(0,Math.round(percentile*100)));
}

let _trackerTestResults=null;

async function runTrackerTests(){
  if(typeof Image==='undefined') return [];
  const results=[];

  // Test 1: Tracking pixel (ad-like bait element)
  results.push(await new Promise(resolve=>{
    const img=new Image();
    let done=false;
    img.onload=()=>{if(!done){done=true;resolve({id:'pixel',blocked:false});}};
    img.onerror=()=>{if(!done){done=true;resolve({id:'pixel',blocked:true});}};
    const bait=document.createElement('div');
    bait.className='ad_banner ad-banner adsbygoogle';
    bait.style.cssText='width:1px;height:1px;position:absolute;left:-9999px;top:-9999px';
    document.body.appendChild(bait);
    setTimeout(()=>{
      const blocked=bait.offsetHeight===0||bait.clientHeight===0||window.getComputedStyle(bait).display==='none'||window.getComputedStyle(bait).visibility==='hidden';
      document.body.removeChild(bait);
      if(!done){done=true;resolve({id:'pixel',blocked:blocked});}
    },500);
  }));

  // Test 2: Analytics-like script element
  results.push(await new Promise(resolve=>{
    let done=false;
    const el=document.createElement('div');
    el.id='google_ads_frame';
    el.className='adsbox';
    el.style.cssText='width:1px;height:1px;position:absolute;left:-9999px;top:-9999px';
    el.innerHTML='&nbsp;';
    document.body.appendChild(el);
    setTimeout(()=>{
      const blocked=el.offsetHeight===0||el.clientHeight===0||window.getComputedStyle(el).display==='none';
      document.body.removeChild(el);
      if(!done){done=true;resolve({id:'analytics',blocked:blocked});}
    },500);
  }));

  // Test 3: Third-party iframe bait
  results.push(await new Promise(resolve=>{
    const el=document.createElement('div');
    el.className='ad-placement sponsored-banner';
    el.style.cssText='width:1px;height:1px;position:absolute;left:-9999px;top:-9999px';
    el.innerHTML='<span>ad</span>';
    document.body.appendChild(el);
    setTimeout(()=>{
      const blocked=el.offsetHeight===0||window.getComputedStyle(el).display==='none';
      document.body.removeChild(el);
      resolve({id:'iframe',blocked:blocked});
    },500);
  }));

  // Test 4: Do Not Track header
  const dnt=navigator.doNotTrack==='1'||window.doNotTrack==='1';
  results.push({id:'dnt',blocked:dnt});

  // Test 5: Global Privacy Control
  const gpc=navigator.globalPrivacyControl===true;
  results.push({id:'gpc',blocked:gpc});

  return results;
}

function renderTrackerTests(results,t){
  const section=getEl('trackerSection');
  const titleEl=getEl('trackerTitle');
  const container=getEl('trackerResults');
  const verdictEl=getEl('trackerVerdict');
  if(!section||!container) return;

  const tt=t.trackers;
  if(!tt) return;

  titleEl.textContent=tt.title;
  container.innerHTML='';

  if(tt.description){
    const descP=document.createElement('p');
    descP.className='small';
    descP.style.marginBottom='12px';
    descP.textContent=tt.description;
    container.appendChild(descP);
  }

  let blockedCount=0;
  const testKeys=['pixel','analytics','iframe','dnt','gpc'];

  results.forEach(r=>{
    const meta=tt[r.id];
    if(!meta) return;
    if(r.blocked) blockedCount++;
    const row=document.createElement('div');
    row.className='tracker-row';
    const badge=document.createElement('span');
    badge.className='tracker-badge '+(r.blocked?'tracker-badge--blocked':'tracker-badge--open');
    badge.textContent=r.blocked?(meta.blocked):(meta.open);
    const textWrap=document.createElement('div');
    textWrap.className='tracker-text';
    const nameEl=document.createElement('div');
    nameEl.className='tracker-name';
    nameEl.textContent=meta.name;
    const explainKey=r.id+'Explain';
    const explain=tt[explainKey]||'';
    textWrap.appendChild(nameEl);
    if(explain){
      const explainEl=document.createElement('div');
      explainEl.className='tracker-explain';
      explainEl.textContent=explain;
      textWrap.appendChild(explainEl);
    }
    row.appendChild(badge);
    row.appendChild(textWrap);
    container.appendChild(row);
  });

  if(verdictEl&&typeof tt.verdict==='function'){
    verdictEl.textContent=tt.verdict(blockedCount,results.length);
  }

  section.style.display='';
}

// Cache stable fingerprint signals so invalidateSnapshot (IP/speed update)
// does not re-sample non-deterministic APIs (AudioContext, Canvas)
let _stableFpCache=null;
async function getStableFingerprints(){
  if(_stableFpCache) return _stableFpCache;
  const uaData=navigator.userAgentData;
  const memoryInfo=detectMemory();
  const hw={
    deviceMemory:memoryInfo.deviceMemory??null,
    hardwareConcurrency:navigator.hardwareConcurrency??null,
    memoryLimitGb:memoryInfo.heapLimit??null
  };
  const gl=webglInfo();
  const [cv,au,perms,media,bat,uaHints,webglFp,audioFp]=await Promise.all([
    canvasHash(),
    audioHash(),
    getPermissions(),
    getMediaDevices(),
    getBattery(),
    getUaHints(uaData),
    Promise.resolve(getWebGLFingerprint()),
    getAudioFingerprint()
  ]);
  const fontsFp=getFontFingerprint();
  const languages=getLanguages();
  const screenSetup=detectScreenSetup();
  const pointer=detectPointerType();
  _stableFpCache={uaData,hw,gl,cv,au,perms,media,bat,uaHints,webglFp,audioFp,fontsFp,languages,screenSetup,pointer};
  return _stableFpCache;
}
async function computeSnapshot(){
  const {uaData,hw,gl,cv,au,perms,media,bat,uaHints,webglFp,audioFp,fontsFp,languages,screenSetup,pointer}=await getStableFingerprints();
  const tz=LOCAL_TZ;
  const tzOffset=new Date().getTimezoneOffset();
  const net=netInfo();
  const pixelRatio=Number(window.devicePixelRatio||1)||1;
  const basic={
    userAgent:navigator.userAgent,
    uaBrands:uaData?.brands||null, uaMobile:uaData?.mobile??null, uaPlatform:uaData?.platform||null,
    uaHighEntropy:uaHints,
    platform:navigator.platform||null,
    languages,
    screen:{w:screen.width,h:screen.height,colorDepth:screen.colorDepth,pixelRatio,monitors:screenSetup},
    timezone:tz, tzOffsetMinutes:tzOffset,
    cookiesEnabled:navigator.cookieEnabled??null,
    dnt:navigator.doNotTrack||null,
    gpc:(typeof navigator.globalPrivacyControl!=='undefined')?Boolean(navigator.globalPrivacyControl):null,
    storage:{local:hasStorage('localStorage'),session:hasStorage('sessionStorage'),indexedDB:!!window.indexedDB},
    touch:{maxTouchPoints:navigator.maxTouchPoints||0,ontouchstart:('ontouchstart' in window)},
    pointer,
    hw, gl, net, perms, media, plugins:getPlugins(), battery:bat, hashes:{canvas:cv,audio:au}, webgl:webglFp, audioFp:audioFp, fontsFp:fontsFp, server:state.serverData, speed:state.speed
  };
  try{
    basic.exposure=await collectExposureData(basic);
  }catch(_){
    basic.exposure=null;
  }
  // basic data stays local — not exposed to globalThis
  const json=JSON.stringify(sortDeep(basic));
  const fp=await sha256(json);

  const browser=browserFamily(basic.userAgent);
  const osFamily=canonicalOsFamily(guessOSVersion(basic));
  const scr=`${basic.screen.w}x${basic.screen.h}@${basic.screen.pixelRatio}`;
  const langCount=languages.length;
  const langsCount = langCount>=4?'4+':String(langCount||0);
  const gpuBrand=brandFromRenderer(basic.gl?.renderer||'');
  const hasCanvas = basic.hashes.canvas? '1':'0';
  const hasAudio  = basic.hashes.audio?  '1':'0';
  const pluginsBucket = bucketPlugins((basic.plugins||[]).length);
  const permEntries=Object.entries(basic.perms||{});
  const permBucket = bucketPerms(permEntries.length);
  const memoryBucket = bucketDeviceMemory(hw.deviceMemory);
  const coresBucket = bucketCoreCount(hw.hardwareConcurrency);
  const storageBucket = storageBucketKey(basic.storage,basic.cookiesEnabled);
  const touchBucket = touchBucketKey(basic.touch,basic.pointer);
  const webglRenderer = (basic.webgl&&basic.webgl.supported)?basic.webgl.renderer:'__other';
  const audioHashBucket = (()=>{
    if(!basic.audioFp) return 'silent';
    if(!basic.audioFp.supported) return 'blocked';
    const h=basic.audioFp.hash||'';
    if(!h) return 'silent';
    const code=h.charCodeAt(0)||0;
    if(code%7===0) return 'common-a';
    if(code%7===1) return 'common-b';
    if(code%7===2) return 'common-c';
    if(code%7===3) return 'rare';
    if(code%7===4) return 'unique-a';
    if(code%7===5) return 'unique-b';
    return 'blocked';
  })();
  const fontsBucket = bucketFontsCount((basic.fontsFp&&basic.fontsFp.count)||0);

  // H is computed ONLY from stable browser-side signals.
  // IP, speed, latency are excluded — they are volatile (arrive async)
  // and are NOT part of browser fingerprinting methodology.
  const H = entropyFromFeatures({browser,osFamily,screen:scr,dpr:String(basic.screen.pixelRatio),langsCount,gpuBrand,memoryBucket,coresBucket,hasCanvas,hasAudio,pluginsBucket,permBucket,storageBucket,touchBucket,webglRenderer,audioHash:audioHashBucket,fontsBucket});
  const pct = percentileFromH(H);

  return {basic, fp, H, pct};
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, ch=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[ch]);
}

function pillValue(value){
  if(value==null) return '';
  const str=String(value).trim();
  if(!str) return '';
  if(str.includes('<span class="pill">')) return str;
  return `<span class="pill">${escapeHtml(str)}</span>`;
}

function pillList(values){
  return values.map(pillValue).filter(Boolean).join(' ');
}

function pillOr(value,fallback='—'){
  return pillValue(value)||pillValue(fallback);
}

function loadThemePreference(){
  try{
    const stored=localStorage.getItem(THEME_KEY);
    if(stored==='light'||stored==='dark'||stored==='auto'||stored==='contrast') return stored;
  }catch(_){/* ignore */}
  return'auto';
}

function applyThemePreference(mode){
  themePreference=mode;
  document.documentElement.classList.remove('force-light','force-dark','force-contrast');
  if(mode==='light') document.documentElement.classList.add('force-light');
  else if(mode==='dark') document.documentElement.classList.add('force-dark');
  else if(mode==='contrast'){
    document.documentElement.classList.remove('force-dark','force-light');
    document.documentElement.classList.add('force-contrast');
  }
  try{
    if(mode==='auto') localStorage.setItem(THEME_KEY,'auto');
    else localStorage.setItem(THEME_KEY,mode);
  }catch(_){/* ignore */}
}

function updateThemeButton(t){
  const btn=getEl('themeBtn');
  if(!btn) return;
  const map=t.theme?.modes||{};
  const fallback={auto:'Auto',light:'Light',dark:'Dark'};
  const label=map[themePreference]||fallback[themePreference]||'Auto';
  const prefix=t.theme?.label||'Theme';
  const icon=THEME_ICONS[themePreference]||THEME_ICONS.auto;
  btn.innerHTML=`<span class="menu-icon" aria-hidden="true">${icon}</span><span class="btn-text">${prefix}</span>`;
  btn.setAttribute('aria-label',`${prefix}: ${label}`);
  const menu=getEl('themeMenu');
  if(menu){
    menu.querySelectorAll('button[data-theme]').forEach(item=>{
      const value=item.dataset.theme||'';
      const itemLabel=map[value]||fallback[value]||value;
      item.setAttribute('aria-label',itemLabel);
      item.classList.toggle('active',value===themePreference);
    });
  }
}

async function fetchWithTimeout(url,{timeout=6000,...options}={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const resp=await fetch(url,{...options,signal:controller.signal});
    if(!resp.ok) throw new Error(resp.statusText||`HTTP ${resp.status}`);
    return resp;
  }catch(e){
    if(e.name==='AbortError') throw new Error('timeout');
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

function normalizeCallingCode(code){
  if(code==null) return null;
  let str=String(code).trim();
  if(!str) return null;
  str=str.replace(/[^0-9+]/g,'');
  while(str.startsWith('+')){
    str=str.slice(1);
  }
  if(!str) return null;
  return `+${str}`;
}

function normalizeTimeZoneValue(tz){
  return String(tz||'').trim().toLowerCase();
}

function providerLooksLikeVpn(details,raw){
  const lower=str=>String(str||'').toLowerCase();
  const candidates=[
    details?.org,
    raw?.org,
    raw?.isp,
    raw?.as,
    raw?.company,
    raw?.connection?.isp,
    raw?.connection?.org,
    raw?.asn?.org,
    raw?.asn?.name
  ].map(lower).filter(Boolean);
  if(candidates.some(org=>VPN_KEYWORDS.some(key=>org.includes(key)))) return true;
  const security=raw?.security||raw?.threat||{};
  if([security.vpn,security.proxy,security.relay,security.tor,raw?.proxy,raw?.vpn,raw?.tor].some(val=>val===true)) return true;
  const type=lower(raw?.connection?.type||raw?.type);
  if(type&&(type.includes('hosting')||type.includes('datacenter')||type.includes('data center'))) return true;
  return false;
}

function primaryLanguageCode(){
  const langs=navigator.languages;
  if(langs&&langs.length){
    return String(langs[0]).split('-')[0].toLowerCase();
  }
  return String(navigator.language||'').split('-')[0].toLowerCase();
}

function languageMismatch(langCode,countryCode){
  if(!langCode||!countryCode) return false;
  const lang=langCode.toLowerCase();
  if(!lang) return false;
  if(lang==='en') return false;
  const allowed=COUNTRY_LANG_MAP[countryCode.toLowerCase()];
  if(!allowed) return false;
  return !allowed.includes(lang);
}

function extractCanonicalDetailsFromPayload(payload){

  const details={};
  const region=payload.region_name||payload.region||payload.state_prov||payload.state||payload.province||payload.regionName||null;
  if(region) details.region=String(region);
  const countryName=payload.country_name||payload.country||payload.countryName||payload.country_long||payload.country_full||null;
  if(countryName) details.country_name=String(countryName);
  const countryCode=payload.country_code||payload.countryCode||payload.country_code2||payload.country_code_iso3166||payload.country_code_iso3166_1_alpha_2||payload.cc||payload.country_code_iso||null;
  if(countryCode) details.country_code=String(countryCode).toUpperCase();
  let timezone=null;
  if(typeof payload.timezone==='string'){
    timezone=payload.timezone;
  }else if(payload.timezone&&typeof payload.timezone==='object'){
    timezone=payload.timezone.id||payload.timezone.name||payload.timezone.timezone||payload.timezone.current_time_zone||payload.timezone.current_time||payload.timezone.abbreviation||null;
  }else if(typeof payload.time_zone==='string'){
    timezone=payload.time_zone;
  }else if(payload.time_zone&&typeof payload.time_zone==='object'){
    timezone=payload.time_zone.name||payload.time_zone.id||null;
  }
  if(timezone) details.timezone=String(timezone);
  const calling=payload.country_calling_code||payload.calling_code||payload.country_call_code||payload.country_phone_code||payload.telephone_code||payload.phone_prefix||null;
  const normalizedCalling=normalizeCallingCode(calling);
  if(normalizedCalling) details.country_calling_code=normalizedCalling;
  const org=payload.org||payload.organization||payload.connection && (payload.connection.org||payload.connection.isp||payload.connection.asn)||payload.isp||payload.as||payload.company||payload.provider||payload.org_name||null;
  if(org) details.org=String(org);
  return Object.keys(details).length?details:null;
}

function normalizeHeaders(headers){
  if(!headers || typeof headers!=='object') return {};
  const out={};
  Object.entries(headers).forEach(([key,value])=>{
    if(value==null) return;
    if(Array.isArray(value)){
      out[key]=value.map(v=>String(v)).join(', ');
      out[key.toLowerCase()]=out[key];
    }else if(typeof value==='object'){
      const str=String(value.value||JSON.stringify(value));
      out[key]=str;
      out[key.toLowerCase()]=str;
    }else{
      const str=String(value);
      out[key]=str;
      out[key.toLowerCase()]=str;
    }
  });
  return out;
}

function ipFromHeaders(headers){
  const get=h=>headers[h]||headers[h.toLowerCase()]||headers[h.toUpperCase()];
  const forwarded=get('x-forwarded-for');
  if(forwarded){
    const first=forwarded.split(',')[0].trim();
    if(first) return first;
  }
  return get('cf-connecting-ip')||get('x-real-ip')||get('client-ip')||get('remote-addr')||null;
}

async function fetchIpData(){
  // Race the two fastest public APIs in parallel, then fall back sequentially
  let raceResult=null;
  try{
    raceResult=await Promise.any([fetchIpFromIpapi(),fetchIpFromIpwho()]);
  }catch(_){/* both failed, continue to sequential fallback */}
  const attempts=raceResult
    ?[fetchIpFromHeaders,fetchIpFromIpify,fetchIpFromMyip]
    :[fetchIpFromHeaders,fetchIpFromIpapi,fetchIpFromIpwho,fetchIpFromIpify,fetchIpFromMyip];
  const errors=[];
  let aggregated=null;
  let details=null;
  let detailSource=null;
  // Merge race result if available
  if(raceResult&&(raceResult.ip||raceResult.raw)){
    aggregated={...raceResult};
    const candidate=extractCanonicalDetailsFromPayload(raceResult.raw);
    if(candidate){details={...candidate};detailSource=raceResult.source||null;}
    if(details && DETAIL_FIELDS.every(key=>details[key])){
      aggregated.details={...details};
      aggregated.detailSource=detailSource;
      return aggregated;
    }
  }
  for(const attempt of attempts){
    try{
      const result=await attempt();
      if(!result || (!result.ip && !result.raw)) throw new Error('empty');
      if(!aggregated){
        aggregated={...result};
      }else{
        if(result.ip && !aggregated.ip) aggregated.ip=result.ip;
        if(result.geo && (!aggregated.geo || (!aggregated.geo.city && !aggregated.geo.country))) aggregated.geo=result.geo;
        if(result.raw && !aggregated.raw) aggregated.raw=result.raw;
        if(result.headers && !aggregated.headers) aggregated.headers=result.headers;
        if(result.source && !aggregated.source) aggregated.source=result.source;
      }
      const candidate=extractCanonicalDetailsFromPayload(result.raw);
      if(candidate){
        if(!details) details={};
        Object.keys(candidate).forEach(key=>{
          if(candidate[key] && !details[key]){
            details[key]=candidate[key];
          }
        });
        if(!detailSource && result.source){
          detailSource=result.source;
        }
      }
      if(details && DETAIL_FIELDS.every(key=>details[key])){
        const completed={...aggregated};
        completed.details={...details};
        completed.detailSource=detailSource||result.source||aggregated.source||null;
        return completed;
      }
    }catch(err){
      errors.push(err.message||String(err));
    }
  }
  if(aggregated){
    const completed={...aggregated};
    if(details){
      completed.details={...details};
      completed.detailSource=detailSource||aggregated.source||null;
    }
    return completed;
  }
  const e=new Error(errors.join('; '));
  e.attempts=errors;
  throw e;
}

function evaluateVpnState(serverData){
  if(!serverData) return {status:'uncertain',reasons:[],checked:false};
  const details=serverData.details||extractCanonicalDetailsFromPayload(serverData.raw);
  if(!details) return {status:'uncertain',reasons:[],checked:false};
  const raw=serverData.raw||{};
  const headers=serverData.headers||{};
  const reasons=[];
  const ipTz=details.timezone||null;
  const localTz=LOCAL_TZ||null;
  if(ipTz && localTz && normalizeTimeZoneValue(ipTz)!==normalizeTimeZoneValue(localTz)){
    reasons.push('timezone');
  }
  const langCode=primaryLanguageCode();
  const countryCandidate=normalizeCountryCodeValue(details.country_code||raw.country_code||raw.countryCode||raw.cc);
  if(langCode && countryCandidate && languageMismatch(langCode,countryCandidate)){
    reasons.push('language');
  }
  if(providerLooksLikeVpn(details,raw)){
    reasons.push('asn');
  }
  const forwardedHeaders=['via','forwarded','x-forwarded-for','x-forwarded-host','x-forwarded-proto'];
  for(const name of forwardedHeaders){
    const value=headers?.[name]||headers?.[name?.toLowerCase?.()||name]||headers?.[name?.toUpperCase?.()||name];
    if(value){
      reasons.push('forwarded');
      break;
    }
  }
  if(raw.proxy===true||raw.vpn===true||raw.tor===true){
    reasons.push('forwarded');
  }
  const uniqueReasons=Array.from(new Set(reasons));
  let score=0;
  uniqueReasons.forEach(reason=>{
    if(reason==='asn'||reason==='forwarded') score+=3;
    else if(reason==='timezone') score+=1.5;
    else if(reason==='language') score+=1;
  });
  const connectionType=String(raw?.connection?.type||'').toLowerCase();
  const asType=String(raw?.asn?.type||'').toLowerCase();
  const looksResidential=[connectionType,asType].some(val=>val.includes('residential')||val.includes('consumer')||val.includes('isp')||val.includes('mobile')||val.includes('cellular'));
  let status='uncertain';
  if(score>=3){
    status='likely';
  }else if(score>=2.5){
    status='likely';
  }else if(score===0 && (details.timezone||details.country_name)){
    status='unlikely';
  }else if(looksResidential && score<2){
    status='unlikely';
  }
  return {status,reasons:uniqueReasons,checked:true};
}
async function runSpeedTest(){
  const BYTES=2000000;
  async function measure(url,timeout=10000){
    const cacheBust=Date.now();
    const target=url.includes('?')?`${url}&cacheBust=${cacheBust}`:`${url}?cacheBust=${cacheBust}`;
    const start=performance.now();
    const resp=await fetchWithTimeout(target,{timeout,mode:'cors',cache:'no-store',credentials:'omit'});
    let bytes=0;
    if(resp.body?.getReader){
      const reader=resp.body.getReader();
      while(true){
        const {done,value}=await reader.read();
        if(done) break;
        if(value) bytes+=value.byteLength;
      }
    }else{
      const buf=await resp.arrayBuffer();
      bytes=buf.byteLength;
    }
    if(bytes===0){
      const hint=parseInt(resp.headers.get('content-length')||'0',10);
      if(hint>0) bytes=hint;
    }
    if(bytes===0) bytes=BYTES;
    const duration=Math.max((performance.now()-start)/1000,0.001);
    const mbps=Number(((bytes*8)/(duration*1e6)).toFixed(2));
    const latency=Math.max(1,Math.round(duration*1000));
    return {mbps,latency,note:null};
  }

  const attempts=[
    {url:`https://speed.cloudflare.com/__down?bytes=${BYTES}`,timeout:12000},
    {url:`https://httpbin.org/bytes/${BYTES}`,timeout:12000}
  ];
  const errors=[];
  for(const attempt of attempts){
    try{
      return await measure(attempt.url,attempt.timeout);
    }catch(err){
      errors.push(err.message||String(err));
    }
  }
  const conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  if(conn?.downlink){
    const downlink=Number(conn.downlink||0);
    if(downlink>0){
      const latency=Math.max(1,Math.round(conn.rtt||100));
      return {mbps:Number(downlink.toFixed(2)),latency,note:'approx'};
    }
  }
  const e=new Error(errors.join('; '));
  e.attempts=errors;
  throw e;
}

function resolveLocaleText(map,lang,fallback=''){
  if(!map) return fallback;
  const order=[];
  if(lang) order.push(lang);
  order.push('en','ru','uz');
  const seen=new Set();
  for(const code of order){
    if(!code || seen.has(code)) continue;
    seen.add(code);
    const candidate=map?.[code];
    if(typeof candidate==='string' && candidate.trim()){
      return candidate;
    }
  }
  const first=Object.values(map).find(val=>typeof val==='string' && val.trim());
  return first||fallback;
}

  if(lower==='slow-2g') return '2G (slow)';
  if(lower==='2g'||lower==='3g'||lower==='4g'||lower==='5g') return lower.toUpperCase();

function initClockIntervals(root){
  if(typeof window==='undefined'||!root) return;
  root.querySelectorAll('[data-clock-tz]').forEach(node=>{
    const tz=node.getAttribute('data-clock-tz');
    if(!tz) return;
    const locale=node.getAttribute('data-clock-locale')||'ru-RU';
    const includeSeconds=node.getAttribute('data-clock-seconds')==='1';
    const update=()=>{
      try{
        const text=timeInTZ(tz,locale,includeSeconds);
        if(text) node.textContent=text;
      }catch(_){/* ignore */}
    };
    update();
    const id=window.setInterval(update,1000);
    clockIntervals.set(node,id);
  });
}

function describeTimeZoneLabel(timezone,locale){
  const result={country:null,raw:null};
  if(!timezone) return result;
  try{
    const fmt=new Intl.DateTimeFormat(locale,{timeZone:timezone,timeZoneName:'longGeneric'});
    const parts=fmt.formatToParts(new Date());
    const tzName=parts.find(part=>part.type==='timeZoneName')?.value||'';
    if(tzName){
      result.raw=tzName;
      result.country=extractCountryFromTimeZoneName(tzName);
    }
  }catch(_){/* ignore */}
  return result;
}

function extractCountryFromTimeZoneName(name){
  if(!name) return '';
  const comma=name.indexOf(',');
  if(comma!==-1) return name.slice(0,comma).trim();
  const patterns=[' standard time',' daylight time',' time',' vaqti',' vaqt',' waktu',' tijd',' zeit',' hora',' tiempo','時間','時刻','시간','saati','čas'];
  const lower=name.toLowerCase();
  for(const pattern of patterns){
    const idx=lower.indexOf(pattern);
    if(idx>0) return name.slice(0,idx).trim();
  }
  return name.trim();
}

function checkSpoofing(basic){
  var issues=[];
  var ua=(typeof navigator!=='undefined'&&navigator.userAgent)||'';
  var platform=(typeof navigator!=='undefined'&&navigator.platform)||'';

  // 1. UA vs platform consistency
  var uaWin=/Windows/i.test(ua);
  var uaMac=/Macintosh|Mac OS/i.test(ua);
  var uaLinux=/Linux/i.test(ua)&&!/Android/i.test(ua);
  var uaAndroid=/Android/i.test(ua);
  var platWin=/Win/i.test(platform);
  var platMac=/Mac/i.test(platform);
  var platLinux=/Linux/i.test(platform);

  if(uaWin&&!platWin) issues.push('ua_platform');
  if(uaMac&&!platMac) issues.push('ua_platform');
  if(uaLinux&&!platLinux&&!uaAndroid) issues.push('ua_platform');

  // 2. Canvas randomization (run canvas twice, compare)
  if(typeof document!=='undefined'){
    try{
      var c1=document.createElement('canvas');c1.width=200;c1.height=50;
      var ctx1=c1.getContext('2d');
      ctx1.fillStyle='#f60';ctx1.fillRect(10,10,100,30);
      ctx1.fillStyle='#069';ctx1.font='14px Arial';
      ctx1.fillText('Fingerprint test',2,15);
      var d1=c1.toDataURL();

      var c2=document.createElement('canvas');c2.width=200;c2.height=50;
      var ctx2=c2.getContext('2d');
      ctx2.fillStyle='#f60';ctx2.fillRect(10,10,100,30);
      ctx2.fillStyle='#069';ctx2.font='14px Arial';
      ctx2.fillText('Fingerprint test',2,15);
      var d2=c2.toDataURL();

      if(d1!==d2) issues.push('canvas_randomized');
    }catch(_){}
  }

  // 3. Timezone vs IP geolocation
  if(basic&&state.serverData){
    var ipTz=state.serverData?.details?.timezone||'';
    var browserTz=(typeof Intl!=='undefined'&&Intl.DateTimeFormat().resolvedOptions().timeZone)||'';
    if(ipTz&&browserTz){
      var ipRegion=ipTz.split('/')[0]||'';
      var brRegion=browserTz.split('/')[0]||'';
      if(ipRegion&&brRegion&&ipRegion!==brRegion) issues.push('tz_mismatch');
    }
  }

  // 4. Screen resolution vs DPR anomaly
  if(typeof screen!=='undefined'){
    var dpr=(typeof window!=='undefined'&&window.devicePixelRatio)||1;
    var sw=screen.width||0;
    var sh=screen.height||0;
    if(dpr>=2&&sw<1000&&sh<700) issues.push('screen_dpr');
  }

  // 5. navigator.webdriver
  if(typeof navigator!=='undefined'&&navigator.webdriver===true) issues.push('webdriver');

  return{consistent:issues.length===0,issues:issues};
}
