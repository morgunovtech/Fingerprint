    if(ul) ul.innerHTML='';
    Object.values(groups).forEach(g=>{if(g) g.innerHTML='';});
    shockBulletCount=0;
    syncShockVisibility();
    return;
  }
  clearClockIntervals();

  // Also keep old shockList populated for selftest backward compat
  const lines=[];

  const groupTitles={
    identity:{ru:'\u041e \u0432\u0430\u0441',en:'About you',uz:'Siz haqingizda'},
    network:{ru:'\u0421\u0435\u0442\u044c',en:'Network',uz:'Tarmoq'},
    fingerprint:{ru:'\u0426\u0438\u0444\u0440\u043e\u0432\u043e\u0439 \u043e\u0442\u043f\u0435\u0447\u0430\u0442\u043e\u043a',en:'Digital fingerprint',uz:'Raqamli barmoq izi'}
  };

  // Brand icons for device and browser
  const deviceIcons={'apple':'\uD83C\uDF4E','mac':'\uD83C\uDF4E','iphone':'\uD83D\uDCF1','ipad':'\uD83D\uDCF1','samsung':'\uD83D\uDCF1','windows':'\uD83D\uDDA5\uFE0F','linux':'\uD83D\uDC27'};
  const browserIcons={'chrome':'\uD83C\uDF10','firefox':'\uD83E\uDD8A','safari':'\uD83E\uDDED','edge':'\uD83C\uDF10','arc':'\uD83C\uDF10','opera':'\uD83C\uDF10','brave':'\uD83E\uDD81'};
  function getDeviceIcon(name){
    const lower=(name||'').toLowerCase();
    for(const k of Object.keys(deviceIcons)){if(lower.includes(k))return deviceIcons[k]+' ';}
    return '';
  }
  function getBrowserIcon(name){
    const lower=(name||'').toLowerCase();
    for(const k of Object.keys(browserIcons)){if(lower.includes(k))return browserIcons[k]+' ';}
    return '';
  }

  function mkRow(label,value,opts){
    opts=opts||{};
    const div=document.createElement('div');
    div.className=opts.badge?'data-row data-row--status':'data-row';
    let valueHtml=value;
    if(opts.code) valueHtml='<code>'+value+'</code>';
    if(opts.badge){
      const cls=opts.badge==='safe'?'status-badge--safe':opts.badge==='danger'?'status-badge--danger':'status-badge--warning';
      valueHtml='<span class="status-badge '+cls+'">'+value+'</span>';
    }
    div.innerHTML='<span class="data-label">'+esc(label)+'</span><span class="data-value">'+valueHtml+'</span>';
    return div;
  }

  // Clear groups and add titles
  Object.entries(groups).forEach(function(entry){
    var key=entry[0],el=entry[1];
    if(!el) return;
    el.innerHTML='<h3>'+(groupTitles[key][currentLang]||groupTitles[key].en)+'</h3>';
  });

  const details=state.serverData?.details||{};
  const hasIp=!!state.serverData;
  let totalRows=0;

  // Collect IP for network section display
  const ipForNetwork=state.serverData?.ip||'';

  // === IDENTITY GROUP (merged: identity + device) ===
  if(groups.identity){
    if(hasIp){
      const rawCity=details.city||state.serverData?.geo?.city||'';
      const rawCountry=details.country_name||state.serverData?.geo?.country||'';
      const countryCode=resolveCountryCode(details,state.serverData?.raw,state.serverData?.geo)||'';
      const localCity=CITY_NAMES[rawCity]?.[currentLang]||rawCity;
      const localCountry=COUNTRY_NAMES[countryCode.toUpperCase()]?.[currentLang]||rawCountry;
      const flag=countryCode?countryCodeToFlag(countryCode):'';
      const locLabel={ru:'\u0413\u0435\u043e\u043b\u043e\u043a\u0430\u0446\u0438\u044f',en:'Location',uz:'Joylashuv'}[currentLang];
      if(localCity||localCountry){
        const locValue=flag+' '+esc(localCity)+(localCity&&localCountry?', ':'')+esc(localCountry);
        groups.identity.appendChild(mkRow(locLabel,locValue));
        totalRows++;
        // Also push to old lines for selftest
        lines.push(t.shock.location(flag,esc(localCity||localCountry),esc(localCity?localCountry:''),esc(ipForNetwork)));
      }
    }else if(!state.ipFetchDone){
      lines.push(t.shock.locationLoading);
    }

    // Date row (static)
    const now=new Date();
    const dtLocale=currentLang==='uz'?'uz-UZ':currentLang==='en'?'en-US':'ru-RU';
    const dateStr=now.toLocaleDateString(dtLocale,{day:'numeric',month:'long',year:'numeric'});
    const dateLabel={ru:'\u0414\u0430\u0442\u0430',en:'Date',uz:'Sana'}[currentLang];
    groups.identity.appendChild(mkRow(dateLabel,esc(dateStr)));
    totalRows++;

    // Time row (live, updates every second)
    const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
    const timeLabel={ru:'\u0412\u0440\u0435\u043c\u044f',en:'Time',uz:'Vaqt'}[currentLang];
    const timeRowDiv=document.createElement('div');
    timeRowDiv.className='data-row';
    const timeLabelSpan=document.createElement('span');
    timeLabelSpan.className='data-label';
    timeLabelSpan.textContent=timeLabel;
    const timeValueSpan=document.createElement('span');
    timeValueSpan.className='data-value live-clock';
    timeValueSpan.id='liveClockValue';
    const updateClock=()=>{
      const n=new Date();
      timeValueSpan.textContent=n.toLocaleTimeString(dtLocale,{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    };
    updateClock();
    const clockId=window.setInterval(updateClock,1000);
    clockIntervals.set(timeValueSpan,clockId);
    timeRowDiv.appendChild(timeLabelSpan);
    timeRowDiv.appendChild(timeValueSpan);
    groups.identity.appendChild(timeRowDiv);
    totalRows++;

    if(tz){
      const tzLabel={ru:'\u0427\u0430\u0441\u043e\u0432\u043e\u0439 \u043f\u043e\u044f\u0441',en:'Timezone',uz:'Vaqt zonasi'}[currentLang];
      groups.identity.appendChild(mkRow(tzLabel,esc(tz),{code:true}));
    }
    const timeStr=now.toLocaleTimeString(dtLocale,{hour:'2-digit',minute:'2-digit'});
    lines.push(t.shock.datetime(esc(timeStr),esc(dateStr),esc(tz)));

    if(basic.languages&&basic.languages.length>0){
      const flags=basic.languages.slice(0,5).map(function(l){return langToFlag(l)+' '+l;}).join(', ');
      const langLabel={ru:'\u042f\u0437\u044b\u043a\u0438',en:'Languages',uz:'Tillar'}[currentLang];
      groups.identity.appendChild(mkRow(langLabel,flags));
      totalRows++;

      const sysLangs=basic.languages.map(function(l){return l.split('-')[0].toLowerCase();});
      let inference='';
      const evidence=[];
      const hasRu=sysLangs.includes('ru');
      const hasUz=sysLangs.includes('uz');
      if(hasRu){
        if(currentLang==='ru'){
          evidence.push({ru:'ru \u0432 \u0441\u0438\u0441\u0442\u0435\u043c\u0435 + \u0441\u0430\u0439\u0442 \u043d\u0430 \u0440\u0443\u0441\u0441\u043a\u043e\u043c',en:'ru in system + site in Russian',uz:'tizimda ru + sayt ruscha'}[currentLang]);
          inference={ru:'\u0441\u043a\u043e\u0440\u0435\u0435 \u0432\u0441\u0435\u0433\u043e, \u0440\u0443\u0441\u0441\u043a\u043e\u0433\u043e\u0432\u043e\u0440\u044f\u0449\u0438\u0439',en:'likely Russian-speaking',uz:'ehtimol ruscha gaplashadi'}[currentLang]||'';
        }else{
          evidence.push({ru:'ru \u0441\u0440\u0435\u0434\u0438 \u0441\u0438\u0441\u0442\u0435\u043c\u043d\u044b\u0445 \u044f\u0437\u044b\u043a\u043e\u0432',en:'ru among system languages',uz:'tizim tillarida ru bor'}[currentLang]);
          inference={ru:'\u0432\u0435\u0440\u043e\u044f\u0442\u043d\u043e, \u0432\u043b\u0430\u0434\u0435\u0435\u0442 \u0440\u0443\u0441\u0441\u043a\u0438\u043c',en:'probably speaks Russian',uz:'ehtimol ruscha biladi'}[currentLang]||'';
        }
      }else if(currentLang==='ru'){
        evidence.push({ru:'\u0441\u0430\u0439\u0442 \u043e\u0442\u043a\u0440\u044b\u0442 \u043d\u0430 \u0440\u0443\u0441\u0441\u043a\u043e\u043c',en:'site opened in Russian',uz:'sayt ruscha ochilgan'}[currentLang]);
        inference={ru:'\u0432\u044b\u0431\u0440\u0430\u043b \u0440\u0443\u0441\u0441\u043a\u0438\u0439 \u0438\u043d\u0442\u0435\u0440\u0444\u0435\u0439\u0441',en:'chose Russian interface',uz:'rus interfeysini tanlagan'}[currentLang]||'';
      }
      if(hasUz){
        inference={ru:'\u0441\u043a\u043e\u0440\u0435\u0435 \u0432\u0441\u0435\u0433\u043e, \u0443\u0437\u0431\u0435\u043a\u043e\u044f\u0437\u044b\u0447\u043d\u044b\u0439',en:'likely Uzbek-speaking',uz:'ehtimol o\u02BBzbekcha gaplashadi'}[currentLang]||'';
      }
      const fullInference=inference+(evidence.length>0?' ('+evidence.join(', ')+')':'');
      if(inference){
        const inferLabel={ru:'\u0412\u044b\u0432\u043e\u0434',en:'Inference',uz:'Xulosa'}[currentLang];
        groups.identity.appendChild(mkRow(inferLabel,inference));
        totalRows++;
      }
      lines.push(t.shock.languages(flags,fullInference));
    }

    // === Device rows merged into identity group ===
    const deviceObj=guessDevice(basic);
    const localDevice=localizeDeviceName(deviceObj,currentLang);
    if(localDevice){
      const devLabel={ru:'\u0423\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u043e',en:'Device',uz:'Qurilma'}[currentLang];
      const devIcon=getDeviceIcon(localDevice.name);
      groups.identity.appendChild(mkRow(devLabel,devIcon+esc(localDevice.name)));
      totalRows++;
      lines.push(t.shock.device(esc(localDevice.name)));
    }

    const browserStr=browserDisplayName(basic);
    if(browserStr&&browserStr!=='\u2014'){
      const brLabel={ru:'\u0411\u0440\u0430\u0443\u0437\u0435\u0440',en:'Browser',uz:'Brauzer'}[currentLang];
      const brIcon=getBrowserIcon(browserStr);
      groups.identity.appendChild(mkRow(brLabel,brIcon+esc(browserStr),{code:true}));
      totalRows++;

      // Build old-style line for selftest compat (no extension count row)
      const perms=basic.perms||{};
      const permParts=[];
      if(perms.camera==='granted') permParts.push({ru:'\u043a\u0430\u043c\u0435\u0440\u0430',en:'camera',uz:'kamera'}[currentLang]);
      if(perms.microphone==='granted') permParts.push({ru:'\u043c\u0438\u043a\u0440\u043e\u0444\u043e\u043d',en:'mic',uz:'mikrofon'}[currentLang]);
      if(perms.geolocation==='granted') permParts.push({ru:'\u0433\u0435\u043e\u043b\u043e\u043a\u0430\u0446\u0438\u044f',en:'geolocation',uz:'geolokatsiya'}[currentLang]);
      if(perms.notifications==='granted') permParts.push({ru:'\u0443\u0432\u0435\u0434\u043e\u043c\u043b\u0435\u043d\u0438\u044f',en:'notifications',uz:'bildirishnomalar'}[currentLang]);
      let permStr='';
      if(permParts.length>0){
        const granted={ru:'\u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043d\u043e',en:'granted',uz:'ruxsat berilgan'}[currentLang];
        permStr=granted+': '+permParts.join(', ');
      }
      lines.push(t.shock.browser(esc(browserStr),permStr?esc(permStr):''));

      // Permissions row
      const grantedPerms=[];
      if(perms.camera==='granted') grantedPerms.push({ru:'\u043a\u0430\u043c\u0435\u0440\u0430',en:'camera',uz:'kamera'}[currentLang]);
      if(perms.microphone==='granted') grantedPerms.push({ru:'\u043c\u0438\u043a\u0440\u043e\u0444\u043e\u043d',en:'mic',uz:'mikrofon'}[currentLang]);
      if(perms.geolocation==='granted') grantedPerms.push({ru:'\u0433\u0435\u043e\u043b\u043e\u043a\u0430\u0446\u0438\u044f',en:'geolocation',uz:'geolokatsiya'}[currentLang]);
      if(grantedPerms.length>0){
        const permLabel={ru:'\u0420\u0430\u0437\u0440\u0435\u0448\u0435\u043d\u0438\u044f',en:'Permissions',uz:'Ruxsatlar'}[currentLang];
        groups.identity.appendChild(mkRow(permLabel,grantedPerms.join(', '),{badge:'warning'}));
        totalRows++;
      }
    }
  }

  // === NETWORK GROUP ===
  if(groups.network){
    // Show IP as first row in network group
    if(ipForNetwork){
      groups.network.appendChild(mkRow('IP',esc(ipForNetwork),{code:true}));
      totalRows++;
    }
    // Update ipRow element in networkResults
    const ipRowEl=getEl('ipRow');
    if(ipRowEl&&ipForNetwork){
      ipRowEl.innerHTML='<span class="data-label">IP</span> <code class="mono">'+esc(ipForNetwork)+'</code>';
      ipRowEl.style.display='';
    }

    const parts=[];
    if(hasIp&&details.org) parts.push(esc(details.org));
    const conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
    if(state.speedResult?.mbps){
      parts.push(state.speedResult.mbps+' Mbps');
    }else if(conn?.downlink){
      parts.push(conn.downlink+' Mbps');
    }
    if(parts.length>0){
      const ispLabel={ru:'\u041f\u0440\u043e\u0432\u0430\u0439\u0434\u0435\u0440',en:'ISP',uz:'Provayder'}[currentLang];
      groups.network.appendChild(mkRow(ispLabel,parts.join(' \u00B7 ')));
      totalRows++;
    }
    // old-style connection line
    {
      const connParts=[];
      if(hasIp&&details.org) connParts.push(esc(details.org));
      if(conn?.type&&conn.type!=='unknown'){
        const typeMap={wifi:{ru:'Wi-Fi',en:'Wi-Fi',uz:'Wi-Fi'},cellular:{ru:'\u043c\u043e\u0431\u0438\u043b\u044c\u043d\u0430\u044f \u0441\u0435\u0442\u044c',en:'cellular',uz:'mobil tarmoq'},ethernet:{ru:'\u043a\u0430\u0431\u0435\u043b\u044c',en:'ethernet',uz:'kabel'},bluetooth:{ru:'Bluetooth',en:'Bluetooth',uz:'Bluetooth'}};
        const typeName=typeMap[conn.type]?.[currentLang]||conn.type;
        connParts.push(typeName);
      }
      if(state.speedResult?.mbps) connParts.push(state.speedResult.mbps+' Mbps');
      else if(conn?.downlink) connParts.push(conn.downlink+' Mbps');
      if(connParts.length>0) lines.push(t.shock.connection(connParts.join(' \u00B7 ')));
    }

    if(conn?.type&&conn.type!=='unknown'){
      const typeMap={wifi:{ru:'Wi-Fi',en:'Wi-Fi',uz:'Wi-Fi'},cellular:{ru:'\u041c\u043e\u0431\u0438\u043b\u044c\u043d\u0430\u044f \u0441\u0435\u0442\u044c',en:'Cellular',uz:'Mobil tarmoq'},ethernet:{ru:'\u041a\u0430\u0431\u0435\u043b\u044c',en:'Ethernet',uz:'Kabel'}};
      const typeName=typeMap[conn.type]?.[currentLang]||conn.type;
      const typeLabel={ru:'\u0422\u0438\u043f',en:'Type',uz:'Turi'}[currentLang];
      groups.network.appendChild(mkRow(typeLabel,typeName));
      totalRows++;
    }

    // VPN status
    if(hasIp){
      const vpnState=state.vpn||{};
      const hasTzMismatch=details.timezone&&basic.timezone&&(details.timezone.split('/')[0]||'')!==(basic.timezone.split('/')[0]||'');
      const vpnLabel='VPN';
      if(hasTzMismatch||vpnState.status==='likely'){
        const vpnText={ru:'\u041e\u0431\u043d\u0430\u0440\u0443\u0436\u0435\u043d',en:'Detected',uz:'Aniqlangan'}[currentLang];
        groups.network.appendChild(mkRow(vpnLabel,vpnText,{badge:'danger'}));
        // old-style lines
        if(hasTzMismatch){
          const ipCountryCode=resolveCountryCode(details,state.serverData?.raw,state.serverData?.geo)||'';
          const ipLoc=COUNTRY_NAMES[ipCountryCode.toUpperCase()]?.[currentLang]||details.country_name||details.timezone.split('/')[0]||'';
          const browserTz=basic.timezone||'';
          const browserRegion=browserTz.split('/')[1]?.replace(/_/g,' ')||browserTz.split('/')[0]||'';
          lines.push(t.shock.vpnDetected(esc(ipLoc),esc(browserRegion)));
        }else{
          lines.push(t.shock.vpnSuspected);
        }
      }else{
        const vpnText={ru:'\u041d\u0435 \u043e\u0431\u043d\u0430\u0440\u0443\u0436\u0435\u043d',en:'Not detected',uz:'Aniqlanmagan'}[currentLang];
        groups.network.appendChild(mkRow(vpnLabel,vpnText,{badge:'safe'}));
        lines.push(t.shock.vpnNotDetected);
      }
      totalRows++;
    }

    // WebRTC
    const profiling=state.profilingContext;
    const webrtcIp=profiling?.webrtcLocalIp||null;
    const webrtcLabel='WebRTC';
    if(webrtcIp&&state.serverData?.ip&&webrtcIp!==state.serverData.ip){
      const leakText={ru:'\u0423\u0442\u0435\u0447\u043a\u0430: ',en:'Leak: ',uz:'Oqish: '}[currentLang]+webrtcIp;
      groups.network.appendChild(mkRow(webrtcLabel,leakText,{badge:'danger'}));
      lines.push(t.shock.webrtcLeak(esc(webrtcIp)));
    }else if(webrtcIp===null&&profiling){
      const safeText={ru:'\u0411\u0435\u0437\u043e\u043f\u0430\u0441\u043d\u043e',en:'Safe',uz:'Xavfsiz'}[currentLang];
      groups.network.appendChild(mkRow(webrtcLabel,safeText,{badge:'safe'}));
      lines.push(t.shock.webrtcSafe);
    }else if(!profiling){
      lines.push(t.shock.webrtcUnavailable);
      const unavText={ru:'\u041d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u0435\u043d',en:'Unavailable',uz:'Mavjud emas'}[currentLang];
      groups.network.appendChild(mkRow(webrtcLabel,unavText,{badge:'warning'}));
    }else{
      const safeText={ru:'\u0411\u0435\u0437\u043e\u043f\u0430\u0441\u043d\u043e',en:'Safe',uz:'Xavfsiz'}[currentLang];
      groups.network.appendChild(mkRow(webrtcLabel,safeText,{badge:'safe'}));
      lines.push(t.shock.webrtcSafe);
    }
    totalRows++;

    // Spoofing/consistency check
    const spoofing=checkSpoofing(basic);
    state.spoofingResult=spoofing;
    if(spoofing){
      const spoofLabel={ru:'\u0414\u0430\u043d\u043d\u044b\u0435 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0430',en:'Browser data',uz:"Brauzer ma\u02BBlumotlari"}[currentLang];
      if(spoofing.consistent){
        const naturalText={ru:'\u0412\u044b\u0433\u043b\u044f\u0434\u0438\u0442 \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e',en:'Looks natural',uz:"Tabiiy ko\u02BBrinadi"}[currentLang];
        groups.network.appendChild(mkRow(spoofLabel,naturalText,{badge:'safe'}));
      }else{
        const issuesText={ru:'\u041e\u0431\u043d\u0430\u0440\u0443\u0436\u0435\u043d\u044b \u043d\u0435\u0441\u043e\u043e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0438\u044f',en:'Inconsistencies found',uz:"Nomuvofiqliklar aniqlandi"}[currentLang];
        groups.network.appendChild(mkRow(spoofLabel,issuesText,{badge:'warning'}));
      }
      totalRows++;
    }
  }

  // === FINGERPRINT GROUP ===
  if(groups.fingerprint){
    if(basic.hashes?.canvas){
      groups.fingerprint.appendChild(mkRow('Canvas',esc(basic.hashes.canvas.substring(0,8)),{code:true}));
      totalRows++;
      lines.push(t.shock.canvas(esc(basic.hashes.canvas.substring(0,8))));
    }
    if(basic.hashes?.audio){
      groups.fingerprint.appendChild(mkRow('Audio',esc(basic.hashes.audio.substring(0,8)),{code:true}));
      totalRows++;
    }
    if(basic.webgl&&basic.webgl.supported){
      const rendererShort=(basic.webgl.renderer||'N/A').length>30?(basic.webgl.renderer.substring(0,27)+'...'):basic.webgl.renderer;
      groups.fingerprint.appendChild(mkRow('WebGL',esc(rendererShort),{code:true}));
      totalRows++;
      if(basic.webgl.hash){
        const webglHashLabel={ru:'WebGL \u0445\u0435\u0448',en:'WebGL hash',uz:'WebGL xesh'}[currentLang];
        groups.fingerprint.appendChild(mkRow(webglHashLabel,esc(basic.webgl.hash),{code:true}));
        totalRows++;
      }
    }
    if(basic.audioFp&&basic.audioFp.supported){
      const audioFpLabel={ru:'\u0410\u0443\u0434\u0438\u043e \u0445\u0435\u0448',en:'Audio hash',uz:'Audio xesh'}[currentLang];
      groups.fingerprint.appendChild(mkRow(audioFpLabel,esc(basic.audioFp.hash),{code:true}));
      totalRows++;
    }
    if(basic.fontsFp&&basic.fontsFp.count>0){
      const fontsLabel={ru:'\u0428\u0440\u0438\u0444\u0442\u044b',en:'Fonts',uz:'Shriftlar'}[currentLang];
      const fontsValue=basic.fontsFp.count+' ('+esc(basic.fontsFp.hash)+')';
      groups.fingerprint.appendChild(mkRow(fontsLabel,fontsValue,{code:true}));
      totalRows++;
    }
    if(basic.exposure?.adblock){
      const adLabel={ru:'\u0411\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u0449\u0438\u043a',en:'Ad blocker',uz:'Bloklagich'}[currentLang];
      const adText={ru:'\u041e\u0431\u043d\u0430\u0440\u0443\u0436\u0435\u043d',en:'Detected',uz:'Aniqlangan'}[currentLang];
      groups.fingerprint.appendChild(mkRow(adLabel,adText,{badge:'safe'}));
      totalRows++;
      lines.push(t.shock.adblock);
    }
  }

  // BATTERY (if low) - old lines only
  if(basic.battery&&basic.battery.level!=null&&!basic.battery.unavailable&&basic.battery.level<0.3){
    const pct=Math.round(basic.battery.level*100);
    lines.push(t.shock.battery(pct));
  }
  // MEDIA DEVICES (if many) - old lines only
  const mediaCount=(basic.media?.audioInput||0)+(basic.media?.videoInput||0);
  if(mediaCount>2){
    lines.push(t.shock.mediaDevices(mediaCount));
  }

  // Render old shockList for selftest backward compat
  if(ul){
    ul.innerHTML='';
    lines.filter(Boolean).forEach(function(text){
      const li=document.createElement('li');
      li.innerHTML=text;
      ul.appendChild(li);
    });
  }
  shockBulletCount=totalRows>0?totalRows:lines.filter(Boolean).length;
  syncShockVisibility();
}

function formatStorageForShock(storage,cookiesEnabled,t){
  if(!storage) return '';
  const yes=t.units?.yes||'yes';
  const no=t.units?.no||'no';
  const unknown=t.permStates?.unknown||'—';
  const labels=t.labels?.storage||{};
  const entries=[
    [labels.local||'localStorage',storage.local],
    [labels.session||'sessionStorage',storage.session],
    [labels.idb||'IndexedDB',storage.indexedDB],
    [labels.cookies||'Cookies',cookiesEnabled]
  ];
  return entries
    .map(([label,val])=>{
      if(val===true) return `${label}: ${yes}`;
      if(val===false) return `${label}: ${no}`;
      if(val==null) return `${label}: ${unknown}`;
      return `${label}: ${val}`;
    })
    .join(', ');
}

function formatTouchSummary(touch,pointer,t){
  const points=typeof touch?.maxTouchPoints==='number'?touch.maxTouchPoints:0;
  const pointerLabel=formatPointerLabel(pointer,t);
  return {points, pointer:pointerLabel};
}

function summariseList(items,limit=3){
  if(!Array.isArray(items)||!items.length) return '—';
  const head=items.slice(0,limit);
  const more=items.length>limit?` +${items.length-limit}`:'';
  return `${head.join(', ')}${more}`;
}

const _browserGroup = detectBrowserGroup();

function createRecCard(rec, levelLabels, isPersonal, altPrefix) {
  const bg = _browserGroup;
  const levelClass = rec.level === 'easy' ? 'rec-card--green' : rec.level === 'medium' ? 'rec-card--yellow' : rec.level === 'hard' ? 'rec-card--red' : '';
  const personalClass = isPersonal ? 'rec-card--personal' : '';
  const card = document.createElement('div');
  card.className = 'rec-card ' + (isPersonal ? personalClass : levelClass);

  // Zone 1: Title
  var zoneTop = document.createElement('div');
  zoneTop.className = 'rec-zone-top';
  var header = document.createElement('div');
  header.className = 'rec-header';
  var levelHtml = (isPersonal && rec.level && levelLabels[rec.level]) ? '<span class="rec-level">' + esc(levelLabels[rec.level]) + '</span>' : '';
  header.innerHTML = '<span class="rec-title">' + esc(rec.title) + '</span>' + levelHtml;
  zoneTop.appendChild(header);
  card.appendChild(zoneTop);

  // Zone 2: Why
  var why = typeof rec.problem === 'function' ? rec.problem() : (rec.problem || rec.body || '');
  if (why) {
    var zoneWhy = document.createElement('div');
    zoneWhy.className = 'rec-zone-why';
    zoneWhy.textContent = why;
    card.appendChild(zoneWhy);
  }

  // Zone 3: Action (browser-specific)
  var instr = rec.instructions && rec.instructions[bg] || rec.instructions && rec.instructions.chrome || null;
  if (instr) {
    var zoneAction = document.createElement('div');
    zoneAction.className = 'rec-zone-action';

    var actionEl = document.createElement('div');
    actionEl.className = 'rec-action';
    if (instr.link) {
      actionEl.innerHTML = esc(instr.action) + ' \u2192 <a href="' + esc(instr.link.url) + '" target="_blank" rel="noopener">' + esc(instr.link.text) + '</a>';
    } else {
      actionEl.textContent = instr.action;
    }
    zoneAction.appendChild(actionEl);

    if (instr.detail) {
      var detailEl = document.createElement('div');
      detailEl.className = 'rec-detail';
      detailEl.textContent = instr.detail;
      zoneAction.appendChild(detailEl);
    }

    if (instr.note) {
      var noteEl = document.createElement('div');
      noteEl.className = 'rec-note';
      noteEl.textContent = '\u2713 ' + instr.note;
      zoneAction.appendChild(noteEl);
    }

    if (rec.alternative && bg !== 'brave') {
      var altEl = document.createElement('div');
      altEl.className = 'rec-alt';
      altEl.textContent = (altPrefix || '') + rec.alternative;
      zoneAction.appendChild(altEl);
    }

    if(rec.expandDetail){
      var details=document.createElement('details');
      details.style.cssText='margin-top:8px;font-size:13px';
      var summary=document.createElement('summary');
      summary.style.cssText='cursor:pointer;color:var(--accent);font-size:13px';
      summary.textContent={ru:'\u041f\u043e\u0434\u0440\u043e\u0431\u043d\u0435\u0435 \u043e \u0432\u044b\u0431\u043e\u0440\u0435 VPN',en:'More on choosing a VPN',uz:"VPN tanlash haqida batafsil"}[currentLang]||'More';
      details.appendChild(summary);
      var expandContent=document.createElement('div');
      expandContent.style.cssText='margin-top:8px;line-height:1.6';
      expandContent.innerHTML=rec.expandDetail;
      details.appendChild(expandContent);
      zoneAction.appendChild(details);
    }

    card.appendChild(zoneAction);
  }

  return card;
}

function renderImplications(basic,t){
  const impl=t.implications;
  if(!impl) return;
  const titleEl=getEl('implProblemTitle');
  if(titleEl) titleEl.textContent=impl.problemTitle||'';
  const textEl=getEl('implProblemText');
  if(textEl) textEl.innerHTML=impl.problemText||'';
  const risksTitleEl=getEl('implRisksTitle');
  if(risksTitleEl) risksTitleEl.textContent=impl.risksTitle||'';
  const grid=getEl('implRisksGrid');
  if(grid){
    grid.innerHTML='';
    (impl.risks||[]).forEach(r=>{
      const card=document.createElement('div');
      card.className='risk-card';
      card.innerHTML='<div class="risk-icon">'+r.icon+'</div><div class="risk-title">'+r.title+'</div><div class="risk-body">'+r.body+'</div>';
      grid.appendChild(card);
    });
  }
  const stepsTitleEl=getEl('implStepsTitle');
  if(stepsTitleEl) stepsTitleEl.textContent=impl.stepsTitle||'';
  const altPrefix=impl.altPrefix||'';
  const personalEl=getEl('personalRecs');
  if(personalEl){
    personalEl.innerHTML='';
    if(basic&&impl.personal){
      const picks=[];
      if(basic.hashes&&basic.hashes.canvas){
        picks.push(impl.personal.canvas);
      }
      if((basic.plugins||[]).length>3){
        const rec=Object.assign({},impl.personal.plugins);
        const n=(basic.plugins||[]).length;
        if(typeof rec.problem==='function'){const fn=rec.problem;rec.problem=function(){return fn(n);};}
        picks.push(rec);
      }
      const perms=basic.perms||{};
      if(Object.values(perms).some(function(v){return String(v).toLowerCase()==='granted';})){
        picks.push(impl.personal.permissions);
      }
      const vpnState=state.vpn||{};
      if(vpnState.status==='likely'){
        picks.push(impl.personal.vpn);
      }
      if(state.profilingContext&&state.profilingContext.webrtcLocalIp){
        picks.push(impl.personal.webrtc);
      }
      if(basic.languages&&basic.languages.length>2){
        const rec=Object.assign({},impl.personal.languages);
        const n=basic.languages.length;
        if(typeof rec.problem==='function'){const fn=rec.problem;rec.problem=function(){return fn(n);};}
        picks.push(rec);
      }
      if(basic.webgl&&basic.webgl.supported&&impl.personal.webgl){
        picks.push(impl.personal.webgl);
      }
      if(basic.audioFp&&basic.audioFp.supported&&impl.personal.audioFp){
        picks.push(impl.personal.audioFp);
      }
      if(basic.fontsFp&&basic.fontsFp.count>15&&impl.personal.fonts){
        const rec=Object.assign({},impl.personal.fonts);
        const n=basic.fontsFp.count;
        if(typeof rec.problem==='function'){const fn=rec.problem;rec.problem=function(){return fn(n);};}
        picks.push(rec);
      }
      // Spoofing recs
      const spoofing=state.spoofingResult;
      if(spoofing&&!spoofing.consistent){
        if(spoofing.issues.includes('ua_platform')&&impl.personal.spoofing){
          picks.push(impl.personal.spoofing);
        }
        if(spoofing.issues.includes('canvas_randomized')&&impl.personal.canvasRandomized){
          picks.push(impl.personal.canvasRandomized);
        }
        if(spoofing.issues.includes('tz_mismatch')&&impl.personal.tzMismatch){
          picks.push(impl.personal.tzMismatch);
        }
      }
      if(picks.length){
        const heading=document.createElement('div');
        heading.className='rec-section-title';
        heading.textContent=impl.personalTitle||'';
        personalEl.appendChild(heading);
        picks.forEach(function(rec){
          if(rec) personalEl.appendChild(createRecCard(rec,impl.levelLabels||{},true,altPrefix));
        });
      }
    }
  }
  const generalEl=getEl('generalRecs');
  if(generalEl){
    generalEl.innerHTML='';
    if(impl.general&&impl.general.length){
      const heading=document.createElement('div');
      heading.className='rec-section-title';
      heading.textContent=impl.generalTitle||'';
      generalEl.appendChild(heading);
      // Sort by weight: easy first (highest impact/effort ratio), then medium, then hard
      const sorted=[...impl.general].sort((a,b)=>{
        const order={easy:0,medium:1,hard:2};
        return (order[a.level]??1)-(order[b.level]??1);
      });
      const VISIBLE_COUNT=3;
      sorted.forEach(function(rec,i){
        if(i<VISIBLE_COUNT){
          generalEl.appendChild(createRecCard(rec,impl.levelLabels||{},false,altPrefix));
        }
      });
      if(sorted.length>VISIBLE_COUNT){
        const details=document.createElement('details');
        details.className='rec-overflow-wrap';
        const summary=document.createElement('summary');
        summary.className='btn btn-inline';
        summary.style.cssText='margin-top:8px;cursor:pointer;list-style:none;display:inline-flex';
        const showLabels={ru:'Ещё рекомендации',en:'More recommendations',uz:'Boshqa tavsiyalar'};
        summary.textContent=showLabels[currentLang]||showLabels.en;
        details.appendChild(summary);
        for(let i=VISIBLE_COUNT;i<sorted.length;i++){
          details.appendChild(createRecCard(sorted[i],impl.levelLabels||{},false,altPrefix));
        }
        generalEl.appendChild(details);
      }
    }
  }
}

function buildPersonalizedAdvice({basic,state,pct,level},t){
  const adv=t.uniqAdvice||{};
  const fallback=t.uniqAdviceFallback||[];
  const picks=[];
  const used=new Set();
  const grantedPerms=Object.entries(basic.perms||{}).filter(([,val])=>String(val).toLowerCase()==='granted');
  const exposure=basic.exposure||{};
  const fontCount=Array.isArray(exposure.fonts)?exposure.fonts.length:0;
  const trackerCount=Array.isArray(exposure.trackers)?exposure.trackers.length:0;
  const resourceCount=Array.isArray(exposure.resources)?exposure.resources.length:0;
  const context={basic,state,pct,level,grantedPerms,fontCount,trackerCount,resourceCount};
  const push=(key,condition=true)=>{
    if(!condition||used.has(key)) return;
    const template=adv[key];
    if(!template) return;
    const text=typeof template==='function'?template(context):template;
    if(!text) return;
    used.add(key);
    picks.push(text);
  };

  push('separateProfiles',level!=='low');
  push('canvasShield',Boolean(basic.hashes?.canvas||basic.hashes?.audio));
  push('storage',Boolean(basic.storage?.local||basic.storage?.session||basic.storage?.indexedDB));
  push('cookies',basic.cookiesEnabled===true);
  push('permissions',grantedPerms.length>0);
  push('plugins',Array.isArray(basic.plugins)&&basic.plugins.length>0);
  push('fonts',fontCount>0);
  push('trackers',trackerCount>0);
  push('resources',resourceCount>3);
  push('vpn',state.vpn?.status!=='likely'&&level!=='low');
  push('browser',Array.isArray(basic.uaBrands)&&basic.uaBrands.some(brand=>(brand.brand||'').toLowerCase().includes('arc')));
  push('webrtc',state.vpn?.status==='likely'?false:true);
  push('ipRotate',Boolean(state.serverData));
  push('speed',state.speed?.status==='done'&&state.speed.mbps<25);
  push('privacyMode',level==='high');
  push('network',String(basic.net?.effectiveType||'').toLowerCase().includes('cell'));

  for(const key of fallback){
    if(picks.length>=7) break;
    push(key,true);
  }
  return picks.slice(0,7);
}

function buildProfilingContext(findings,basic,t){
  const cfg=t.profiling||{};
  const find=key=>findings.find(item=>item.key===key);
  const deviceFinding=find('device.model')||find('device.class');
  const osFinding=find('os.platform');
  const vpnFinding=find('vpn.probability');
  const locationFinding=find('location.region');
  const networkFinding=find('network.profile');
  const deviceLabel=deviceFinding?formatProfilingValue(deviceFinding,cfg):null;
  const osLabel=osFinding?formatProfilingValue(osFinding,cfg):null;
  const vpnLabel=vpnFinding?formatProfilingValue(vpnFinding,cfg):null;
  const locationLabel=locationFinding?formatProfilingValue(locationFinding,cfg):null;
  const networkLabel=networkFinding?formatProfilingValue(networkFinding,cfg):null;
  const timezone=basic?.timezone||LOCAL_TZ||'UTC';
  const locale=currentLang==='en'?'en-US':(currentLang==='uz'?'uz-UZ':'ru-RU');
  const localTime=timeInTZ(timezone,locale);
  const battery=basic?.battery;
  let batteryText=null;
  if(battery&&typeof battery.level==='number'){
    const pct=Math.max(0,Math.min(100,Math.round(battery.level*100)));
    batteryText=`${pct}%${battery.charging?' ⚡':''}`;
  }
  const netSummary=formatNetworkSummary(basic?.net);
  const units=t.units||{};
  const labels=t.labels||{};
  let connectionText=null;
  if(netSummary){
    const parts=[];
    if(netSummary.type) parts.push(netSummary.type);
    if(netSummary.downlink!=null) parts.push(`~${netSummary.downlink} ${units.mbps||'Mbps'}`);
    if(netSummary.rtt!=null) parts.push(`${labels.latency||'Latency'} ${netSummary.rtt} ${units.ms||'ms'}`);
    connectionText=parts.join(' • ');
  }
  const speedState=state.speed||{};
  let speedText=null;
  if(speedState.status==='done'){
    const parts=[];
    if(typeof speedState.mbps==='number'&&!Number.isNaN(speedState.mbps)) parts.push(`${speedState.mbps.toFixed(1)} ${units.mbps||'Mbps'}`);
    if(typeof speedState.latency==='number'&&!Number.isNaN(speedState.latency)) parts.push(`${labels.latency||'Latency'} ${speedState.latency} ${units.ms||'ms'}`);
    speedText=parts.join(' • ');
  }else if(speedState.status==='running'){
    speedText=t.speed?.running||null;
  }else if(speedState.status==='error'){
    speedText=speedState.error||null;
  }
  let location=locationLabel;
  if(!location){
    const details=state.serverData?.details||{};
    const parts=[details.region,details.country_name].filter(Boolean);
    if(parts.length) location=parts.join(', ');
    else if(details.timezone) location=details.timezone;
  }
  const provider=state.serverData?.details?.org||state.serverData?.detailSource||null;
  const ctx={
    unknown:cfg.unknown||'—',
    deviceLabel,
    deviceConfidence:Math.round((deviceFinding?.confidence||0)*100),
    osLabel,
    osConfidence:Math.round((osFinding?.confidence||0)*100),
    vpnLabel,
    vpnConfidence:Math.round((vpnFinding?.confidence||0)*100),
    location:location||null,
    connection:connectionText||networkLabel||null,
    connectionRaw:networkLabel||null,
    speedText:speedText,
    provider:provider||null,
    batteryText:batteryText,
    localTime:`${localTime}${timezone?` (${timezone})`:''}`,
    deviceFinding,
    osFinding,
    vpnFinding,
    locationFinding,
    networkFinding
  };
  return ctx;
}

async function collectExposureData(basic){
  const fonts=new Set();
  const trackers=new Set();
  const resources=new Set();
  try{
    const entries=performance?.getEntriesByType?.('resource')||[];
    entries.forEach(entry=>{
      const name=entry?.name;
      if(!name||typeof name!=='string') return;
      if(name.startsWith('data:')) return;
      let url;
      try{url=new URL(name,location.href);}catch(_){return;}
      if(url.origin===location.origin) return;
      const host=url.host;
      const initiator=(entry.initiatorType||'resource');
      resources.add(`${host} (${initiator})`);
      if((initiator||'').toLowerCase()==='font') fonts.add(host);
      const hostLower=host.toLowerCase();
      const pathLower=url.pathname.toLowerCase();
      if(TRACKER_PATTERNS.some(pattern=>hostLower.includes(pattern)||pathLower.includes(pattern))){
        trackers.add(host);
      }
    });
  }catch(_){/* ignore */}
  return {
    fonts:Array.from(fonts),
    trackers:Array.from(trackers),
    resources:Array.from(resources)
  };
}

function formatMonitorText(info,t){
  if(!info||!info.mode) return t.monitorText?.unknown||'';
  if(info.mode==='multi'){
    const label=t.monitorText?.multi;
    const count=info.count||2;
    if(typeof label==='function') return label(count);
    return label||'';
  }
  if(info.mode==='single'){
    const label=t.monitorText?.single;
    if(typeof label==='function') return label(info.count||1);
    return label||'';
  }
  return t.monitorText?.unknown||'';
}


let profilerModulePromise=null;
let profilerLoadError=null;
let profilingSequence=0;

function loadProfilerModule(){
  if(profilerModulePromise) return profilerModulePromise;
  if(globalThis.__profilerModule){
    profilerModulePromise=Promise.resolve(globalThis.__profilerModule);
    return profilerModulePromise;
  }
  profilerLoadError=null;
  profilerModulePromise=import('./src/profiler.js').then(mod=>{profilerLoadError=null;globalThis.__profilerModule=mod;return mod;}).catch(err=>{
    profilerLoadError=err;
    profilerModulePromise=null;
    throw err;
  });
  return profilerModulePromise;
}

function normalizeAsnCategory(value){
  const str=String(value||'').toLowerCase();
  if(!str) return 'unknown';
  if(str.includes('residential')||str.includes('consumer')||str.includes('isp')||str.includes('mobile')||str.includes('cellular')) return 'residential';
  if(str.includes('hosting')||str.includes('datacenter')||str.includes('data center')||str.includes('cloud')||str.includes('cdn')) return 'hosting';
  if(str.includes('business')||str.includes('corporate')||str.includes('enterprise')||str.includes('university')) return 'corporate';
  return 'unknown';
}

function buildProfilerIpGeo(){
  if(!state.serverData) return undefined;
  const details=state.serverData.details||extractCanonicalDetailsFromPayload(state.serverData.raw)||{};
  const geo=state.serverData.geo||{};
  const raw=state.serverData.raw||{};
  const ip=state.serverData.ip||details.ip||raw.ip||null;
  const country=details.country_name||details.country||geo.country_name||geo.country||raw.country_name||null;
  const region=details.region||details.city||geo.region||geo.city||null;
  const asnRaw=raw.asn||{};
  const asn=details.asn||details.org||asnRaw.asn||asnRaw.name||raw.org||null;
  const asnType=normalizeAsnCategory(details.asn_type||asnRaw.type||raw.connection?.type||raw.type);
  const latency=typeof state.speed?.latency==='number'?state.speed.latency:(typeof raw.connection?.rtt==='number'?raw.connection.rtt:null);
  const result={asnType};
  if(ip) result.ip=String(ip);
  if(country) result.country=String(country);
  if(region) result.region=String(region);
  if(asn) result.asn=String(asn);
  if(latency!=null) result.rttMs=Number(latency);
  return result;
}

function formatProfilingValue(finding,cfg){
  const values=cfg.values||{};
  const formatter=values[finding.key];
  if(typeof formatter==='function') return formatter(finding);
  return finding.value;
}

function syncShockVisibility(){
  const shock=getEl('shock');
  const section=getEl('shockSection');
  const visible=shockBulletCount>0;
  if(shock) shock.style.display=visible?'block':'none';
  if(section){
    section.style.display=visible?'block':'none';
    if(visible) section.classList.add('shock-animate');
  }
}

async function renderProfilingSection(basic,t){
  state.profilingContext=null;
  if(!basic){
    renderShockBullets(null,t);
    renderImplications(null,t);
    syncShockVisibility();
    return;
  }
  // basic data stays local — not exposed to globalThis
  const runId=++profilingSequence;
  const ipGeo=buildProfilerIpGeo();
  try{
    const mod=await loadProfilerModule();
    if(runId!==profilingSequence) return;
    if(profilerLoadError){
      throw profilerLoadError;
    }
    const findings=await mod.runProfiling(ipGeo);
    if(runId!==profilingSequence) return;
    const context=buildProfilingContext(findings,basic,t);
    state.profilingContext=context;
    renderShockBullets(basic,t,snapshotCache);
    renderImplications(basic,t);
    syncShockVisibility();
  }catch(err){
    if(runId!==profilingSequence) return;
    state.profilingContext=null;
    console.error('Profiling error',err);
    renderShockBullets(basic,t,snapshotCache);
    renderImplications(basic,t);
    syncShockVisibility();
  }
}

function updateHeroVerdict(pct,t,animate){
  const level=uniquenessLevel(pct);
  const uniqCopy=t.uniqMeaning(pct,{level});

  // Legacy uniqLine
  const uniqLineEl=getEl('uniqLine');
  if(uniqLineEl){
    uniqLineEl.dataset.level=level;
    uniqLineEl.textContent='';
    const headSpan=document.createElement('span');
    const codeSpan=document.createElement('span');
    codeSpan.className='code-pill';
    codeSpan.textContent=uniqCopy.headline;
    headSpan.appendChild(codeSpan);
    uniqLineEl.appendChild(headSpan);
  }

  // Conclusion
  const conclusionEl=getEl('heroConclusion');
  if(conclusionEl){
    conclusionEl.textContent=CONCLUSION_TEXTS[level]?.[currentLang]||CONCLUSION_TEXTS[level]?.ru||'';
  }

  // Hero number + subtitle
  const heroEl=getEl('heroVerdict');
  const heroNumEl=getEl('heroNumber');
  const heroSubEl=getEl('heroSubtitle');
  if(heroEl&&heroNumEl){
    heroEl.style.display='block';
    const skelEl=document.getElementById('heroSkeleton');
    if(skelEl) skelEl.style.display='none';
    heroNumEl.dataset.level=level;
    heroNumEl.textContent=pct+'%';

    if(animate&&typeof window.matchMedia==='function'&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      let current=0;
      const duration=1200;
      const start=performance.now();
      function animateCount(now2){
        const elapsed=now2-start;
        const progress=Math.min(elapsed/duration,1);
        const eased=1-Math.pow(1-progress,3);
        current=Math.round(eased*pct);
        heroNumEl.textContent=current+'%';
        if(progress<1&&typeof requestAnimationFrame==='function') requestAnimationFrame(animateCount);
      }
      if(typeof requestAnimationFrame==='function') requestAnimationFrame(animateCount);
    }

    if(heroSubEl) heroSubEl.textContent=uniqCopy.headline||'';
  }

  return {level,uniqCopy};
}

function detectLang(){

    const saved=localStorage.getItem('fp_lang');
    if(saved&&I18N[saved])return saved;
    const n=navigator.language||'ru';
    if(n.startsWith('ru'))return'ru';
    if(n.startsWith('en'))return'en';
    if(n.startsWith('uz'))return'uz';
    return'ru';
  }catch(_){return'ru';}
}

function resolveShareUrl(){
  try{
    const {origin,pathname}=window.location;
    if(origin&&origin!=='null'&&origin.startsWith('http')){
      const cleanPath=pathname.replace(/index\.html$/,'');
      const base=`${origin}${cleanPath}`.replace(/\/$/,'');
      return base||origin;
    }
  }catch(_){/* ignore */}
  return CANONICAL_URL;
}

function svgEscape(str){
  return String(str||'').replace(/[&<>'"]/g,ch=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[ch]);
}

async function copyText(value){
  if(navigator.clipboard&&window.isSecureContext){
    await navigator.clipboard.writeText(value);
    return;
  }
  // Fallback for non-secure contexts
  return new Promise((resolve,reject)=>{
    const textarea=document.createElement('textarea');
    textarea.value=value;
    textarea.setAttribute('readonly','');
    textarea.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0';
    document.body.appendChild(textarea);
    textarea.select();
    try{
      const ok=document.execCommand('copy');
      document.body.removeChild(textarea);
      if(ok) resolve(); else reject(new Error('execCommand failed'));
    }catch(e){
      document.body.removeChild(textarea);
      reject(e);
    }
  });
}

function flashShareMessage(btn,message,restore,isError){
  const original=restore||btn.dataset.label||btn.textContent;
  btn.textContent=message;
  btn.style.background=isError?'var(--warning,#f59e0b)':'var(--success,#22c55e)';
  btn.style.color='#fff';
  const timeout=2000;
  setTimeout(()=>{
    btn.textContent=btn.dataset.label||original;
    btn.style.background='';
    btn.style.color='';
  },timeout);
}

async function handleShareClick(){
  const btn=getEl('shareBtn');
  if(!btn)return;
  if(btn.getAttribute('aria-disabled')==='true')return;
  const t=I18N[currentLang]||I18N.ru;
  const payload=state.sharePayload;
  if(!payload){
    flashShareMessage(btn,t.share?.unavailable||t.ip?.button||t.saveButton,btn.dataset.label,true);
    return;
  }
  const defaultLabel=btn.dataset.label||btn.textContent;
  btn.disabled=true;
  const shareText=`${payload.text}\n${payload.url}`;
  // Pre-copy to clipboard while user-activation is still alive (Arc/Chromium fix)
  let clipboardOk=false;
  try{
    await copyText(shareText);
    clipboardOk=true;
  }catch(_){/* will try again later */}
  try{
    const text=payload.text;
    const title=payload.title;
    const url=payload.url;
    let shared=false;
    if(typeof navigator.share==='function'){
      let file=null;
      if(typeof File==='function'){
        try{
          const shareKey=payload.pct+'|'+payload.headline+'|'+currentLang;
          if(handleShareClick._cacheKey===shareKey&&handleShareClick._cacheFile){
            file=handleShareClick._cacheFile;
          }else{
            const svg=createShareCardSvg(payload,t);
            file=new File([svg],'fingerprint-share.svg',{type:'image/svg+xml'});
            handleShareClick._cacheKey=shareKey;
            handleShareClick._cacheFile=file;
          }
        }catch(_){file=null;}
      }
      const baseData={title,text,url};
      if(file){
        const richData={...baseData,files:[file]};
        try{
          if(typeof navigator.canShare==='function'&&navigator.canShare(richData)){
            await navigator.share(richData);
            shared=true;
          }
        }catch(_){/* rich share failed, fall through to base share */}
      }
      if(!shared){
        try{
          await navigator.share(baseData);
          shared=true;
        }catch(_){/* base share failed, fall through to clipboard */}
      }
    }
    if(shared){
      flashShareMessage(btn,t.share?.shared||t.share?.success||t.copy?.done||'Shared!',defaultLabel);
      return;
    }
    // Clipboard was already written above; show confirmation
    if(clipboardOk){
      flashShareMessage(btn,t.share?.copied||t.copy?.done||'Copied!',defaultLabel);
      return;
    }
    await copyText(shareText);
    flashShareMessage(btn,t.share?.copied||t.copy?.done||'Copied!',defaultLabel);
  }catch(err){
    if(clipboardOk){
      flashShareMessage(btn,t.share?.copied||t.copy?.done||'Copied!',defaultLabel);
    }else{
      console.error('share failed',err);
      flashShareMessage(btn,t.share?.error||'Error',defaultLabel,true);
    }
  }finally{
    btn.disabled=false;
  }
}

async function handleSaveClick(){
  const filename=`fingerprint-${new Date().toISOString().slice(0,10)}.html`;
  const html=document.documentElement.outerHTML;
  const blob=new Blob([html],{type:'text/html'});
  if(IS_IOS && typeof navigator.share==='function'){
    try{
      const fileType={type:'text/html'};
      const file=typeof File==='function'?new File([blob],filename,fileType):null;
      const payload=file?{files:[file],title:'Fingerprint snapshot'}:{title:'Fingerprint snapshot',text:html};
      let canShare=true;
      if(typeof navigator.canShare==='function'){
        try{
          canShare=navigator.canShare(payload);
        }catch(_){
          canShare=false;
        }
      }
      if(canShare){
        await navigator.share(payload);
        return;
      }
    }catch(_){/* fallback to download */}
  }else if(!IS_ANDROID && typeof window.print==='function'){
    try{
      window.print();
      return;
    }catch(_){/* fallback */}
  }
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.download=filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

/* ============== Speed hero animation ============== */
function animateSpeedHero(targetMbps,latency,t){
  const heroArea=getEl('speedHeroArea');
  const heroNumber=getEl('speedHeroNumber');
  const heroLabel=getEl('speedHeroLabel');
  const heroLatency=getEl('speedHeroLatency');
  if(!heroArea||!heroNumber) return;
  heroArea.style.display='';
  const mbpsLabel={ru:'Мбит/с',en:'Mbps',uz:'Mbps'}[currentLang]||'Mbps';
  const latencyLabel={ru:'Задержка',en:'Latency',uz:'Kechikish'}[currentLang]||'Latency';
  if(heroLabel) heroLabel.textContent=mbpsLabel;
  if(heroLatency&&latency) heroLatency.textContent=latencyLabel+': '+latency+' ms';
  // Count-up animation
  const duration=800;
  const start=performance.now();
  const from=0;
  const to=targetMbps;
  function step(now){
    const elapsed=now-start;
    const progress=Math.min(elapsed/duration,1);
    const eased=1-Math.pow(1-progress,3);
    const current=from+(to-from)*eased;
    heroNumber.textContent=current.toFixed(1);
    if(progress<1) requestAnimationFrame(step);
    else heroNumber.textContent=to.toFixed(1);
  }
  requestAnimationFrame(step);
}

/* ============== Real Speed Test via Worker ============== */
async function measureLatency(){
  const pings=[];
  for(let i=0;i<3;i++){
    const t0=performance.now();
    await fetch(WORKER_API+'/api/speedtest/ping',{cache:'no-store',signal:AbortSignal.timeout(5000)});
    pings.push(performance.now()-t0);
  }
  pings.sort((a,b)=>a-b);
  return Math.round(pings[0]); // best of 3
}

async function measureDownload(onProgress){
  // 3 rounds: 500KB warm-up, then 2MB, then 5MB
  const rounds=[{size:500000,label:'warming'},{size:2000000},{size:5000000}];
  let bestMbps=0;
  for(const round of rounds){
    const t0=performance.now();
    const resp=await fetch(WORKER_API+'/api/speedtest/download?size='+round.size,{cache:'no-store',signal:AbortSignal.timeout(30000)});
    const data=await resp.arrayBuffer();
    const elapsed=(performance.now()-t0)/1000; // seconds
    const mbps=(data.byteLength*8)/(elapsed*1000000);
    if(mbps>bestMbps) bestMbps=mbps;
    if(!round.label&&onProgress) onProgress(mbps);
  }
  return Number(bestMbps.toFixed(1));
}

async function runRealSpeedTest(t){
  const heroArea=getEl('speedHeroArea');
  const heroNumber=getEl('speedHeroNumber');
  const heroLabel=getEl('speedHeroLabel');
  const heroLatency=getEl('speedHeroLatency');
  if(!heroArea||!heroNumber) return;
  heroArea.style.display='';
  const mbpsLabel={ru:'Мбит/с',en:'Mbps',uz:'Mbps'}[currentLang]||'Mbps';
  const testingLabel={ru:'Измеряем...',en:'Testing...',uz:'Tekshirilmoqda...'}[currentLang];
  heroNumber.textContent='...';
  heroNumber.style.opacity='0.5';
  if(heroLabel) heroLabel.textContent=testingLabel;
  if(heroLatency) heroLatency.textContent='';

  try{
    // Step 1: Latency
    const latencyLabel={ru:'Задержка',en:'Latency',uz:'Kechikish'}[currentLang]||'Latency';
    const latency=await measureLatency();
    if(heroLatency) heroLatency.textContent=latencyLabel+': '+latency+' ms';

    // Step 2: Download speed (with live updates)
    const mbps=await measureDownload(function(currentMbps){
      heroNumber.textContent=currentMbps.toFixed(1);
    });

    // Final animation
    heroNumber.style.opacity='1';
    if(heroLabel) heroLabel.textContent=mbpsLabel;
    animateSpeedHero(mbps,latency,t);

    state.speed={status:'done',mbps,latency,error:null,note:'measured'};
    state.speedResult={mbps,latency,note:'measured'};
  }catch(e){
    heroNumber.textContent='—';
    heroNumber.style.opacity='1';
    if(heroLabel) heroLabel.textContent={ru:'Ошибка замера',en:'Test failed',uz:'Xatolik'}[currentLang]||'Error';
    console.warn('speedtest failed:',e);
  }
}

/* ============== Network Check (on-demand) ============== */
async function handleNetworkCheck(){
  const btn=getEl('networkBtn');
  const t=I18N[currentLang]||I18N.ru;
  if(btn){btn.disabled=true;btn.textContent=t.networkLoading||'Checking...';}
  try{
    const resultsEl=getEl('networkResults');
    if(resultsEl) resultsEl.style.display='';

    // Run IP fetch and speed test in parallel
    const ipPromise=autoFetchIp();
    const speedPromise=runRealSpeedTest(t);
    await ipPromise;
    state.ipFetchDone=true;

    refreshSnapshotServerData();
    if(snapshotCache){
      renderShockBullets(snapshotCache.basic,t,snapshotCache);
      renderImplications(snapshotCache.basic,t);
      renderProfilingSection(snapshotCache.basic,t);
    }

    // Wait for speed test to finish
    await speedPromise;

    // Call Worker OSINT API if we have an IP
    const ip=state.serverData?.ip||state.serverData?.details?.ip||null;
    if(ip) fetchOsintReport(ip,t);
    if(btn){btn.textContent=t.networkRecheck||'Re-check';btn.disabled=false;}
  }catch(e){
    if(btn){btn.textContent=t.networkButton||'Check network';btn.disabled=false;}
    const resultsEl=getEl('networkResults');
    if(resultsEl){
      resultsEl.style.display='';
      resultsEl.innerHTML='<p class="small" style="color:var(--danger)">'+esc(e.message||'Network check failed')+'</p>';
    }
  }
}

/* ============== OSINT Report via Cloudflare Worker ============== */
let _osintCache=null;
async function fetchOsintReport(ip,t){
  const container=getEl('osintResults');
  if(!container) return;
  container.style.display='';
  container.innerHTML='<p class="small" style="color:var(--muted);">'+(t.osintLoading||'Scanning public databases...')+'</p>';
  if(_osintCache&&_osintCache.resolved_ip===ip){
    renderOsintReport(_osintCache,t);return;
  }
  try{
    const resp=await fetch(WORKER_API+'/api/scan?target='+encodeURIComponent(ip),{signal:AbortSignal.timeout(20000)});
    if(!resp.ok) throw new Error('API '+resp.status);
    const data=await resp.json();
    _osintCache=data;
    renderOsintReport(data,t);
  }catch(e){
    container.innerHTML='<p class="small" style="color:var(--danger);">OSINT scan failed: '+esc(e.message)+'</p>';
  }
}
function renderOsintReport(data,t){
  const c=getEl('osintResults');if(!c)return;
  const geo=data.geolocation;
  const rep=data.reputation;
  const dns=data.dns;
  const labels=t.osint||{title:'Network Intelligence',geo:'Geolocation',isp:'ISP',asn:'ASN',type:'Connection',rep:'Reputation',clean:'Clean',listed:'Blacklisted',ptr:'Reverse DNS',checks:'checks passed',duration:'Scan time'};
  const rows=[];
  if(geo){
    if(geo.country) rows.push(makeOsintRow(labels.geo||'Geolocation',`${geo.city||''}, ${geo.region||''}, ${geo.country}`.replace(/^, |, $/g,'')));
    if(geo.isp) rows.push(makeOsintRow(labels.isp||'ISP',geo.isp));
    if(geo.asn) rows.push(makeOsintRow(labels.asn||'ASN','<code>'+esc(geo.asn)+'</code>'));
    if(geo.connection_type) rows.push(makeOsintRow(labels.type||'Type','<span class="tag tag--'+(geo.connection_type==='residential'?'ok':'warn')+'">'+esc(geo.connection_type)+'</span>'));
  }
  if(dns&&dns.ptr) rows.push(makeOsintRow(labels.ptr||'PTR','<code>'+esc(dns.ptr)+'</code>'));
  if(rep){
    const isClean=!rep.blacklisted;
    const repText=isClean
      ?'<span class="tag tag--ok">\u2705 '+(labels.clean||'Clean')+'</span> ('+rep.blacklists_checked+' '+(labels.checks||'checks')+')'
      :'<span class="tag tag--danger">\u26D4 '+(labels.listed||'Blacklisted')+'</span>: '+rep.blacklist_hits.join(', ');
    rows.push(makeOsintRow(labels.rep||'Reputation',repText));
  }
  rows.push(makeOsintRow(labels.duration||'Scan time',data.duration_ms+'ms \u2022 '+data.sources_ok.length+'/'+
    (data.sources_ok.length+data.sources_failed.length)+' sources'));
  c.innerHTML='<h3 style="font-size:15px;font-weight:700;margin:0 0 10px;">'+(labels.title||'Network Intelligence')+'</h3>'
    +'<div class="data-group">'+rows.join('')+'</div>';
}
function makeOsintRow(label,value){
  return '<div class="row"><span class="label">'+esc(label)+'</span><span class="value">'+value+'</span></div>';
}

let _fpjsPromise=null;
const WORKER_API='https://fingerprint-api.xfxrrpkvr5.workers.dev';
const FPJS_API_KEY='sE9LTvMdm0ITAz950nNQ';
async function loadFingerprintJS(){
  if(_fpjsPromise) return _fpjsPromise;
  _fpjsPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://fpjscdn.net/v3/'+FPJS_API_KEY+'/iife.min.js';
    s.onload=()=>{if(window.FingerprintJS)resolve(window.FingerprintJS);else reject(new Error('FingerprintJS not available'));};

function showFpjsHeroBadge(result,t){
  const badge=getEl('heroBadgeFpjs');
  if(!badge) return;
  const labels=t.fpjs||{};
  const vid=result.visitorId||'—';
  const conf=result.confidence?.score?Math.round(result.confidence.score*100):0;
  const confBadgeClass=conf>=90?'status-badge--danger':conf>=50?'status-badge--warning':'status-badge--safe';
  const disclaimer=t.fpjsDisclaimer||'';
  badge.innerHTML=
    '<span style="font-weight:600">FingerprintJS Pro:</span> '+
    '<code style="font-size:12px;background:var(--code-bg);padding:1px 6px;border-radius:4px">'+esc(vid.substring(0,12))+'…</code> '+
    '<span class="status-badge '+confBadgeClass+'" style="font-size:11px">'+esc(conf+'%')+'</span>'+
    (disclaimer?'<br><span style="font-size:11px;color:var(--muted)">'+esc(disclaimer)+'</span>':'');
  badge.style.display='';
}

async function handleFpjsClick(){
  const btn=getEl('fpjsBtn');
  const t=I18N[currentLang]||I18N.ru;
  if(btn){btn.disabled=true;btn.textContent=t.fpjsLoading||'Loading...';}
  try{
    const FpJS=await loadFingerprintJS();
    const fp=await FpJS.load();
    const result=await fp.get();
    const groupEl=getEl('groupFpjs');
    if(groupEl){
      const labels=t.fpjs||{};
      groupEl.innerHTML='<h3>'+(labels.groupTitle||'FingerprintJS Pro')+'</h3>';
      const mkR=(label,value,opts)=>{
        opts=opts||{};
        const div=document.createElement('div');
        div.className=opts.badge?'data-row data-row--status':'data-row';
        let valueHtml=opts.code?'<code>'+esc(value)+'</code>':esc(value);
        if(opts.badge){
          const cls=opts.badge==='safe'?'status-badge--safe':opts.badge==='danger'?'status-badge--danger':'status-badge--warning';
          valueHtml='<span class="status-badge '+cls+'">'+esc(value)+'</span>';
        }
        div.innerHTML='<span class="data-label">'+esc(label)+'</span><span class="data-value">'+valueHtml+'</span>';
        return div;
      };
      const vid=result.visitorId||'—';
      const conf=result.confidence?.score?Math.round(result.confidence.score*100):0;
      groupEl.appendChild(mkR(labels.visitorId||'Visitor ID',vid.substring(0,12)+'...',{code:true}));
      groupEl.appendChild(mkR(labels.confidence||'Confidence',conf+'%',{badge:conf>=90?'danger':conf>=50?'warning':'safe'}));
      groupEl.appendChild(mkR(labels.identified||'Identifiable',conf>=50?(labels.yes||'Yes'):(labels.no||'No'),{badge:conf>=50?'danger':'safe'}));
    }
    const resultsEl=getEl('fpjsResults');
    if(resultsEl) resultsEl.style.display='';
    // Show result in hero badge
    showFpjsHeroBadge(result,t);
    if(btn){btn.textContent=t.fpjsRecheck||'Re-check';btn.disabled=false;}
  }catch(e){
    if(btn){btn.textContent=t.fpjsButton||'Compare';btn.disabled=false;}
    const resultsEl=getEl('fpjsResults');
    if(resultsEl){
      resultsEl.style.display='';
      resultsEl.innerHTML='<p class="small" style="color:var(--danger)">'+esc(e.message||'FingerprintJS error')+'</p>';
    }
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  themePreference=loadThemePreference();

  try{localStorage.setItem('fp_lang',lang);}catch(_){/* ignore */}
  const shareBtnEl=getEl('shareBtn');
  if(shareBtnEl){
    shareBtnEl.addEventListener('click',()=>{handleShareClick().catch(()=>{});});
  }
  const printBtn=getEl('printBtn');
  if(printBtn){
    printBtn.addEventListener('click',()=>{handleSaveClick().catch(()=>{});});
  }
  const langBtn=getEl('langBtn');
  const langMenu=getEl('langMenu');
  if(langBtn&&langMenu){
    langBtn.addEventListener('click',event=>{
      event.preventDefault();
      event.stopPropagation();
      const next=!langMenuIsOpen;
      setThemeMenu(false);
      setLangMenu(next);
    });
    langMenu.querySelectorAll('button[data-lang]').forEach(btn=>{
      btn.addEventListener('click',event=>{
        event.preventDefault();
        event.stopPropagation();
        const value=btn.dataset.lang;
        if(!value) return;
        langMenuIsOpen=false;
        setLangMenu(false);
        try{localStorage.setItem('fp_lang',value);}catch(_){/* ignore */}
        langBtn.focus({preventScroll:true});
        render(value);
      });
    });
    document.addEventListener('click',event=>{
      if(!langMenuIsOpen) return;
      if(langMenu.contains(event.target)||event.target===langBtn) return;
      setLangMenu(false);
    });
  }
  const themeBtn=getEl('themeBtn');
  const themeMenu=getEl('themeMenu');
  if(themeBtn&&themeMenu){
    themeBtn.addEventListener('click',event=>{
      event.preventDefault();
      event.stopPropagation();
      const next=!themeMenuIsOpen;
      setLangMenu(false);
      setThemeMenu(next);
    });
    themeMenu.querySelectorAll('button[data-theme]').forEach(btn=>{
      btn.addEventListener('click',event=>{
        event.preventDefault();
        event.stopPropagation();
        const value=btn.dataset.theme;
        if(!value) return;
        applyThemePreference(value);
        updateThemeButton(I18N[currentLang]||I18N.ru);
        setThemeMenu(false);
        themeBtn.focus({preventScroll:true});
      });
    });
    document.addEventListener('click',event=>{
      if(themeMenuIsOpen&&!(themeMenu.contains(event.target)||event.target===themeBtn)){
        setThemeMenu(false);
      }
    });
  }
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'){
      setLangMenu(false);
      setThemeMenu(false);
      closeChangelog();
    }
  });
  document.getElementById('changelogClose')?.addEventListener('click', closeChangelog);
  document.getElementById('changelogModal')?.addEventListener('click', e => {
    if(e.target===document.getElementById('changelogModal')) closeChangelog();
  });
  // Methodology modal
  const methodBtnEl=getEl('methodologyBtn');
  const methodModal=getEl('methodologyModal');
  const methodCloseEl=getEl('methodologyClose');
  const methodTitle=getEl('methodologyTitle');
  const methodBodyEl=getEl('methodologyBody');
  if(methodBtnEl){
    methodBtnEl.style.display='inline-flex';
    methodBtnEl.addEventListener('click',()=>{
      const t=I18N[currentLang]||I18N.ru;
      // Safe: methodSummary and methodText come from our own I18N dictionary, not user input
      if(methodTitle) methodTitle.innerHTML=t.methodSummary||'';
      // methodText is now HTML from our own I18N dictionary (safe, not user input)
      if(methodBodyEl) methodBodyEl.innerHTML=t.methodText||'';
      if(methodModal) methodModal.style.display='flex';
    });
  }
  if(methodCloseEl){
    methodCloseEl.addEventListener('click',()=>{
      if(methodModal) methodModal.style.display='none';
    });

  if(methodModal){
    methodModal.addEventListener('click',(e)=>{
      if(e.target===methodModal) methodModal.style.display='none';
    });
  }
  // Wire network check and FingerprintJS Pro buttons
  const netBtn=getEl('networkBtn');
  if(netBtn) netBtn.addEventListener('click',handleNetworkCheck);

  render(lang);
});
