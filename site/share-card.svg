<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Russian link-preview card; share-card-en.svg is the English one. LinkedIn and most
  messengers do not show SVG, so og:image points at share-card.png, rendered from this file
  with headless Chrome (the command is in README, "Link previews").
-->
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <g font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="72" y="118" fill="#60a5fa" font-size="40" font-weight="600">Fingerprint by morgunov.tech</text>
    <text x="72" y="208" fill="#f8fafc" font-size="68" font-weight="700">Кто и что узнаёт о вас,</text>
    <text x="72" y="286" fill="#f8fafc" font-size="68" font-weight="700">пока вы открываете сайт</text>
    <text x="72" y="356" fill="#cbd5f5" font-size="30" font-weight="500">Шесть шагов от включения ноутбука до открытой страницы,</text>
    <text x="72" y="398" fill="#94a3b8" font-size="26">на ваших реальных данных: производитель системы, провайдер, браузер, сайт.</text>
    <g font-size="24" font-weight="600">
      <rect x="72" y="446" width="150" height="48" rx="12" fill="rgba(96,165,250,0.18)" /><text x="147" y="478" fill="#93c5fd" text-anchor="middle">ноутбук</text>
      <rect x="236" y="446" width="130" height="48" rx="12" fill="rgba(96,165,250,0.18)" /><text x="301" y="478" fill="#93c5fd" text-anchor="middle">система</text>
      <rect x="380" y="446" width="110" height="48" rx="12" fill="rgba(96,165,250,0.18)" /><text x="435" y="478" fill="#93c5fd" text-anchor="middle">Wi-Fi</text>
      <rect x="504" y="446" width="140" height="48" rx="12" fill="rgba(96,165,250,0.18)" /><text x="574" y="478" fill="#93c5fd" text-anchor="middle">браузер</text>
      <rect x="658" y="446" width="110" height="48" rx="12" fill="rgba(96,165,250,0.18)" /><text x="713" y="478" fill="#93c5fd" text-anchor="middle">адрес</text>
      <rect x="782" y="446" width="100" height="48" rx="12" fill="rgba(239,68,68,0.25)" /><text x="832" y="478" fill="#fca5a5" text-anchor="middle">сайт</text>
    </g>
    <text x="72" y="580" fill="#64748b" font-size="26">https://fprint.morgunov.tech</text>
  </g>
</svg>
