<?xml version="1.0" encoding="UTF-8"?>
<!--
  The English link-preview card, the one /en/ names; share-card.svg is the Russian one.
  LinkedIn and most messengers do not show SVG, so og:image points at share-card-en.png,
  rendered from this file with headless Chrome (the command is in README, "Link previews").
-->
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <g font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="72" y="118" fill="#60a5fa" font-size="40" font-weight="600">Fingerprint by morgunov.tech</text>
    <text x="72" y="208" fill="#f8fafc" font-size="68" font-weight="700">Who learns what about you</text>
    <text x="72" y="286" fill="#f8fafc" font-size="68" font-weight="700">while you open a website</text>
    <text x="72" y="356" fill="#cbd5f5" font-size="30" font-weight="500">Six steps from opening your laptop to a loaded page,</text>
    <text x="72" y="398" fill="#94a3b8" font-size="26">on your real data: the system's maker, your provider, the browser, the site.</text>
    <g font-size="24" font-weight="600">
      <rect x="72" y="446" width="130" height="48" rx="12" fill="rgba(96,165,250,0.18)" /><text x="137" y="478" fill="#93c5fd" text-anchor="middle">laptop</text>
      <rect x="216" y="446" width="130" height="48" rx="12" fill="rgba(96,165,250,0.18)" /><text x="281" y="478" fill="#93c5fd" text-anchor="middle">system</text>
      <rect x="360" y="446" width="110" height="48" rx="12" fill="rgba(96,165,250,0.18)" /><text x="415" y="478" fill="#93c5fd" text-anchor="middle">Wi-Fi</text>
      <rect x="484" y="446" width="140" height="48" rx="12" fill="rgba(96,165,250,0.18)" /><text x="554" y="478" fill="#93c5fd" text-anchor="middle">browser</text>
      <rect x="638" y="446" width="130" height="48" rx="12" fill="rgba(96,165,250,0.18)" /><text x="703" y="478" fill="#93c5fd" text-anchor="middle">address</text>
      <rect x="782" y="446" width="100" height="48" rx="12" fill="rgba(239,68,68,0.25)" /><text x="832" y="478" fill="#fca5a5" text-anchor="middle">site</text>
    </g>
    <text x="72" y="580" fill="#64748b" font-size="26">https://fprint.morgunov.tech</text>
  </g>
</svg>
